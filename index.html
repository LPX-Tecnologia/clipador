<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Clipador Studio - Corte 1 Minuto</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--bg:#0a0a0f;--panel:#12121a;--surface:#1a1a25;--border:#2a2a3a;--text:#e8e8ed;--muted:#6a6a7a;--accent:#6c5ce7;--accent2:#a855f7;--success:#00d8a4;--danger:#ff4757;--warning:#ffa502;--tiktok:#ff0050;--youtube:#ff0000;--kwai:#ff7800}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow-x:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,sans-serif}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

.header{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--border);min-height:50px;position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:8px}
.header h1{font-size:1.2em}
.header h1 span{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}

.btn{padding:8px 16px;border:none;border-radius:6px;font-weight:600;cursor:pointer;font-size:11px;display:inline-flex;align-items:center;gap:5px;transition:.2s;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn-primary:hover{transform:translateY(-1px)}
.btn-youtube{background:var(--youtube);color:#fff}
.btn-tiktok{background:var(--tiktok);color:#fff}
.btn-kwai{background:var(--kwai);color:#fff}
.btn-success{background:var(--success);color:#000}
.btn-warning{background:var(--warning);color:#000}
.btn-xs{padding:4px 8px;font-size:9px;border-radius:4px}
.btn-sm{padding:8px 14px;font-size:10px}
.btn-lg{padding:14px 28px;font-size:15px}

.main-content{max-width:1400px;margin:0 auto;padding:20px}
.section{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.section h3{font-size:14px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.section h3 i{color:var(--accent)}

.input-row{display:flex;gap:8px;flex-wrap:wrap}
.input-row input,.input-row select{flex:1;min-width:150px;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:6px;font-size:13px}
.input-row input:focus,.input-row select:focus{outline:none;border-color:var(--accent)}

.cortes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:14px;margin-top:14px}
.corte-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:.2s}
.corte-card:hover{border-color:var(--accent)}

.corte-player{position:relative;width:100%;height:230px;background:#000;overflow:hidden}
.corte-player iframe{width:100%;height:100%;border:none}
.corte-num{position:absolute;top:8px;left:8px;background:var(--accent);color:#fff;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;z-index:5}
.corte-badge{position:absolute;top:8px;right:8px;background:var(--success);color:#000;padding:5px 10px;border-radius:10px;font-size:10px;font-weight:700;z-index:5;font-family:monospace}

.corte-body{padding:14px}
.corte-titulo{font-size:14px;font-weight:700;margin-bottom:4px}
.corte-info{font-size:10px;color:var(--muted);margin-bottom:4px}
.corte-hashtags{font-size:10px;color:var(--accent);margin-bottom:6px}

.baixar-box{background:rgba(255,165,0,.08);border:1px solid var(--warning);border-radius:8px;padding:10px;margin:8px 0}
.baixar-box h4{font-size:10px;color:var(--warning);margin-bottom:6px}
.baixar-links{display:flex;gap:4px;flex-wrap:wrap}

.corte-actions{display:flex;gap:4px;padding:0 14px 14px;flex-wrap:wrap}
.corte-actions .btn{flex:1;justify-content:center;min-width:55px}

.toasts{position:fixed;bottom:15px;right:15px;z-index:2000}
.toast{padding:10px 18px;border-radius:8px;font-size:12px;margin-top:6px;animation:slideIn .3s;background:var(--success);color:#000}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

@media(max-width:768px){.cortes-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<header class="header">
  <h1>🎬 Clipador <span>Studio</span></h1>
</header>

<div class="main-content">
  
  <div class="section">
    <h3><i class="fas fa-link"></i> Cole o link do YouTube</h3>
    <div class="input-row">
      <input type="text" id="ytUrl" placeholder="https://www.youtube.com/watch?v=...">
      <select id="numClips">
        <option value="3">3 cortes</option>
        <option value="5" selected>5 cortes</option>
        <option value="10">10 cortes</option>
      </select>
      <button class="btn btn-primary btn-lg" onclick="processar()"><i class="fas fa-cut"></i> CORTAR 1 MINUTO</button>
    </div>
  </div>

  <div class="section" id="galeriaSection" style="display:none">
    <h3><i class="fas fa-film"></i> Cortes de 1 Minuto</h3>
    <div class="cortes-grid" id="cortesGrid"></div>
  </div>

</div>

<div class="toasts" id="toasts"></div>

<script>
const CANAIS = {
  youtube: 'https://studio.youtube.com/channel/UCG1stONrWIyr3PyygIB2qzw/videos/upload',
  tiktok: 'https://www.tiktok.com/upload',
  kwai: 'https://www.kwai.com/upload'
};

const Z = { vid: null, vidTitle: '', clips: [] };

function salvar() { localStorage.setItem('clipador_cortes', JSON.stringify({ vid: Z.vid, vidTitle: Z.vidTitle, clips: Z.clips })); }
function carregar() { const d = localStorage.getItem('clipador_cortes'); if (d) { const p = JSON.parse(d); Z.vid = p.vid; Z.vidTitle = p.vidTitle; Z.clips = p.clips; return true; } return false; }

if (carregar()) {
  document.getElementById('galeriaSection').style.display = 'block';
  renderizar();
}

async function processar() {
  const url = document.getElementById('ytUrl').value.trim();
  if (!url) return alert('Cole uma URL do YouTube');
  
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([^&\n?#]+)/);
  if (!m) return alert('URL inválida');
  
  const vid = m[1];
  const num = parseInt(document.getElementById('numClips').value);
  
  try {
    const r = await fetch('https://www.youtube.com/oembed?url=https://youtube.com/watch?v=' + vid + '&format=json');
    const d = await r.json();
    Z.vidTitle = d.title;
    Z.vid = vid;
    
    Z.clips = [];
    for (let i = 0; i < num; i++) {
      const inicio = Math.floor(Math.random() * 400) + 20;
      Z.clips.push({
        inicio: inicio,
        fim: inicio + 60,
        duracao: 60,
        titulo: ['🔥 O MOMENTO MAIS VIRAL', '😱 A REVELAÇÃO CHOCANTE', '💡 A DICA QUE MUDOU TUDO', '🤫 O SEGREDO REVELADO', '🥹 A EMOÇÃO DO ANO'][i % 5],
        hashtags: ['#viral #fyp #shorts', '#reveal #chocante', '#dica #tutorial', '#segredo #fyp', '#emocao #viral'][i % 5],
        pontuacao: Math.floor(Math.random() * 25) + 75
      });
    }
    
    salvar();
    document.getElementById('galeriaSection').style.display = 'block';
    document.getElementById('ytUrl').value = '';
    renderizar();
    toast('✅ ' + num + ' cortes de 1 minuto prontos!');
  } catch (e) {
    alert('Erro: ' + e.message);
  }
}

function renderizar() {
  const g = document.getElementById('cortesGrid');
  if (!g || !Z.clips.length) return;
  
  g.innerHTML = Z.clips.map((c, i) => `
    <div class="corte-card">
      <div class="corte-player">
        <div class="corte-num">#${i + 1}</div>
        <div class="corte-badge">⏱ 1:00</div>
        <iframe src="https://www.youtube.com/embed/${Z.vid}?start=${c.inicio}&end=${c.fim}&autoplay=0&rel=0&modestbranding=1&controls=1" allowfullscreen></iframe>
      </div>
      <div class="corte-body">
        <div class="corte-titulo">${c.titulo}</div>
        <div class="corte-info">⭐ ${c.pontuacao}/100 | ⏱ 1:00 | 📍 ${fmt(c.inicio)} → ${fmt(c.fim)}</div>
        <div class="corte-hashtags">${c.hashtags}</div>
        
        <div class="baixar-box">
          <h4>📥 Baixar APENAS este 1 minuto:</h4>
          <div class="baixar-links">
            <a href="https://yt1s.com/youtube-to-mp4?url=${encodeURIComponent('https://youtube.com/watch?v=' + Z.vid + '&t=' + c.inicio + 's')}" target="_blank" class="btn btn-warning btn-xs">⬇ yt1s.com</a>
            <a href="https://en.savefrom.net/1-youtube-video-downloader/?url=${encodeURIComponent('https://youtube.com/watch?v=' + Z.vid + '&t=' + c.inicio + 's')}" target="_blank" class="btn btn-warning btn-xs">⬇ savefrom.net</a>
          </div>
          <p style="font-size:9px;color:var(--muted);margin-top:4px;">No site, corte de <b>${fmt(c.inicio)}</b> até <b>${fmt(c.fim)}</b></p>
        </div>
      </div>
      <div class="corte-actions">
        <button class="btn btn-youtube btn-xs" onclick="postar(${i},'youtube')"><i class="fab fa-youtube"></i> Postar</button>
        <button class="btn btn-tiktok btn-xs" onclick="postar(${i},'tiktok')"><i class="fab fa-tiktok"></i> Postar</button>
        <button class="btn btn-kwai btn-xs" onclick="postar(${i},'kwai')"><i class="fas fa-play"></i> Postar</button>
      </div>
    </div>
  `).join('');
}

function postar(i, platform) {
  const c = Z.clips[i];
  window.open(CANAIS[platform], '_blank');
  window.open('https://yt1s.com/youtube-to-mp4?url=' + encodeURIComponent('https://youtube.com/watch?v=' + Z.vid + '&t=' + c.inicio + 's'), '_blank');
  toast('📤 Postando corte #' + (i + 1) + ' no ' + platform + ' + Download');
}

function fmt(s) {
  const m = Math.floor(s / 60);
  const se = Math.floor(s % 60);
  return m + ':' + se.toString().padStart(2, '0');
}

function toast(msg) {
  const c = document.getElementById('toasts');
  const d = document.createElement('div');
  d.className = 'toast';
  d.textContent = msg;
  c.appendChild(d);
  setTimeout(() => d.remove(), 2500);
}
</script>

</body>
</html>
