<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>🎬 Clipador Studio - Legenda TikTok</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><style>
:root{--bg:#0a0a0f;--panel:#12121a;--surface:#1a1a25;--border:#2a2a3a;--text:#e8e8ed;--muted:#6a6a7a;--accent:#6c5ce7;--accent2:#a855f7;--success:#00d8a4;--danger:#ff4757;--warning:#ffa502;--tiktok:#ff0050;--youtube:#ff0000;--kwai:#ff7800}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;overflow-x:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,sans-serif}::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.loader{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity .5s}.loader.hidden{opacity:0;pointer-events:none}.loader-content{text-align:center}.loader-icon{font-size:4em;color:var(--accent);animation:pulse 2s infinite;margin-bottom:20px}.loader-content h2{font-size:1.8em}.loader-content h2 span{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}.loader-content p{color:var(--muted);font-size:14px;margin-bottom:20px}.loader-bar{width:200px;height:4px;background:var(--border);border-radius:2px;margin:0 auto;overflow:hidden}.loader-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));animation:fillBar 2.8s ease forwards;border-radius:2px}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}@keyframes fillBar{0%{width:0}100%{width:100%}}
.app{min-height:100vh;display:flex;flex-direction:column}.header{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--border);min-height:50px;position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:8px}.header h1{font-size:1.1em}.header h1 span{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.btn{padding:7px 14px;border:none;border-radius:5px;font-weight:600;cursor:pointer;font-size:11px;display:inline-flex;align-items:center;gap:5px;transition:.2s;white-space:nowrap}.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}.btn-tiktok{background:var(--tiktok);color:#fff}.btn-youtube{background:var(--youtube);color:#fff}.btn-kwai{background:var(--kwai);color:#fff}.btn-success{background:var(--success);color:#000}.btn-xs{padding:5px 10px;font-size:10px}.btn-sm{padding:8px 16px;font-size:12px}.btn-lg{padding:14px 28px;font-size:15px}
.main-content{flex:1;padding:15px;max-width:1400px;margin:0 auto;width:100%}
.section{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:15px}.section h3{font-size:14px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.input-row{display:flex;gap:8px;flex-wrap:wrap}.input-row input,.input-row select{flex:1;min-width:150px;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:10px;border-radius:6px;font-size:13px}.input-row input:focus,.input-row select:focus{outline:none;border-color:var(--accent)}
.cortes-salvos{display:grid;grid-template-columns:repeat(auto-fill,minmax(450px,1fr));gap:15px;margin-top:15px}.corte-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:.2s;position:relative}.corte-card:hover{border-color:var(--accent)}.corte-card.posted{border-color:var(--success)}
.video-box{position:relative;width:100%;background:#000;overflow:hidden}.video-box iframe{width:100%;height:260px;border:none}.video-box .tiktok-legenda{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);z-index:10;text-align:center;width:95%;pointer-events:none;display:flex;flex-wrap:wrap;justify-content:center;gap:6px}.tiktok-palavra{display:inline-block;padding:6px 14px;border-radius:8px;font-size:20px;font-weight:800;text-shadow:2px 2px 4px rgba(0,0,0,.9);letter-spacing:1px;animation:palavraPop .25s ease}.tiktok-palavra.p1{background:rgba(108,92,231,.95);color:#fff;border:2px solid #a855f7}.tiktok-palavra.p2{background:rgba(255,107,107,.95);color:#fff;border:2px solid #ff8787}.tiktok-palavra.destaque{transform:scale(1.15);box-shadow:0 0 20px rgba(255,255,255,.4)}@keyframes palavraPop{from{opacity:0;transform:scale(.5) translateY(15px)}to{opacity:1;transform:scale(1) translateY(0)}}
.corte-num{position:absolute;top:8px;left:8px;background:var(--accent);color:#fff;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;z-index:10}.corte-badge{position:absolute;top:8px;right:8px;background:var(--success);color:#000;padding:4px 10px;border-radius:10px;font-size:9px;font-weight:700;z-index:10}.corte-timer{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.8);color:var(--success);padding:3px 8px;border-radius:8px;font-size:9px;z-index:10;font-family:monospace}
.corte-body{padding:12px}.corte-titulo{font-size:13px;font-weight:700;margin-bottom:4px}.corte-info{font-size:10px;color:var(--muted);margin-bottom:4px}.corte-actions{display:flex;gap:4px;padding:0 12px 12px;flex-wrap:wrap}
.status-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:8px;margin-bottom:12px}.status-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px;text-align:center}.status-card .num{font-size:1.6em;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}.status-card .label{font-size:9px;color:var(--muted)}
.toasts{position:fixed;bottom:10px;right:10px;z-index:2000}.toast{padding:8px 14px;border-radius:5px;font-size:11px;margin-top:4px;animation:slideIn .3s}.toast-success{background:var(--success);color:#000}@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
@media(max-width:768px){.cortes-salvos{grid-template-columns:1fr}.tiktok-palavra{font-size:14px;padding:4px 8px}}
</style></head><body>
<div class="loader" id="loader"><div class="loader-content"><div class="loader-icon"><i class="fas fa-film"></i></div><h2>Clipador <span>Studio</span></h2><p id="loaderMsg">Preparando legendas estilo TikTok...</p><div class="loader-bar"><div class="loader-fill"></div></div></div></div>
<div class="app" id="app" style="display:none">
<header class="header"><h1>🎬 Clipador <span>Studio</span></h1><div class="header-actions"><span style="font-size:10px;color:var(--success);">✅ Legenda TikTok Automática</span></div></header>
<div class="main-content">
<div class="section"><h3><i class="fas fa-link"></i> Cole o link do YouTube</h3><div class="input-row"><input type="text" id="ytUrl" placeholder="https://youtube.com/watch?v=..."><select id="numClips"><option value="3">3 cortes</option><option value="5" selected>5 cortes</option><option value="10">10 cortes</option></select><button class="btn btn-primary btn-lg" onclick="processarVideo()"><i class="fas fa-cut"></i> CORTAR E LEGENDAR (ESTILO TIKTOK)</button></div></div>
<div class="section" id="galeriaSection" style="display:none">
<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px;"><h3 style="margin:0;"><i class="fas fa-film"></i> Cortes com Legenda Estilo TikTok</h3><div style="display:flex;gap:5px;"><button class="btn btn-youtube btn-sm" onclick="postarTodos('youtube')"><i class="fab fa-youtube"></i> YouTube</button><button class="btn btn-tiktok btn-sm" onclick="postarTodos('tiktok')"><i class="fab fa-tiktok"></i> TikTok</button><button class="btn btn-kwai btn-sm" onclick="postarTodos('kwai')"><i class="fas fa-play"></i> Kwai</button></div></div>
<div class="status-grid"><div class="status-card"><div class="num" id="stTotal">0</div><div class="label">Cortes</div></div><div class="status-card"><div class="num" id="stPostados">0</div><div class="label">Postados</div></div></div>
<div class="cortes-salvos" id="cortesSalvos"></div>
</div>
</div></div>
<div class="toasts" id="toasts"></div>
<script>
const CANAIS={youtube:'https://studio.youtube.com/channel/UCG1stONrWIyr3PyygIB2qzw/videos/upload',tiktok:'https://www.tiktok.com/upload',kwai:'https://www.kwai.com/upload'};
const Z={vid:null,vidTitle:'',clips:[],postados:0,processing:!1,timers:{}};
function saveClips(){localStorage.setItem('clipador_tiktok_leg',JSON.stringify({vid:Z.vid,vidTitle:Z.vidTitle,clips:Z.clips,postados:Z.postados}))}
function loadClips(){const d=localStorage.getItem('clipador_tiktok_leg');if(d){const p=JSON.parse(d);Z.vid=p.vid;Z.vidTitle=p.vidTitle;Z.clips=p.clips;Z.postados=p.postados;return !0}return !1}
(function(){const l=document.getElementById('loader'),m=document.getElementById('loaderMsg'),ms=['🎬 Inicializando...','💬 Preparando legendas...','✨ Estilo TikTok...','🚀 Pronto!'];let i=0;const iv=setInterval(()=>{if(i<ms.length){m.textContent=ms[i];i++}},500);setTimeout(()=>{clearInterval(iv);l.classList.add('hidden');setTimeout(()=>{if(l)l.remove();document.getElementById('app').style.display='block';if(loadClips()){document.getElementById('galeriaSection').style.display='block';renderCortes();updateStatus();iniciarLegendas()}},500)},2500)})();
async function processarVideo(){if(Z.processing)return;Z.processing=!0;const url=document.getElementById('ytUrl').value.trim();if(!url)return Z.processing=!1;const m=url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([^&\n?#]+)/);if(!m)return Z.processing=!1;const vid=m[1],num=parseInt(document.getElementById('numClips').value);document.getElementById('galeriaSection').style.display='block';await sleep(500);try{const r=await fetch('https://www.youtube.com/oembed?url=https://youtube.com/watch?v='+vid+'&format=json');const d=await r.json();Z.vidTitle=d.title;Z.vid=vid;Z.clips=generateClips(num,vid);Z.postados=0;saveClips();renderCortes();updateStatus();iniciarLegendas();toast('✅ '+num+' cortes com legenda TikTok!','success');Z.processing=!1}catch(e){Z.processing=!1}}
function generateClips(n,vid){const moods=['😊 Alegre','😲 Surpreso','🔥 Impactante','😂 Engraçado','💪 Motivador'];const titles=['🔥 O MOMENTO MAIS VIRAL','😱 A REVELAÇÃO CHOCANTE','💡 A DICA QUE MUDOU TUDO','🤫 O SEGREDO REVELADO','🥹 A EMOÇÃO DO ANO'];const legendas=[{p1:'ESSE MOMENTO É INCRÍVEL',p2:'NÃO DÁ PRA ACREDITAR'},{p1:'OLHA SÓ O QUE ELE FALOU',p2:'ISSO MUDOU TUDO'},{p1:'PRESTA ATENÇÃO NESSA DICA',p2:'ELA VALE OURO'},{p1:'GUARDA ESSE VÍDEO',p2:'ESSE SEGREDO VAI MUDAR TUDO'},{p1:'A EMOÇÃO DESSE MOMENTO',p2:'É CONTAGIANTE DEMAIS'}];const hashtags=['#viral #fyp #shorts','#reveal #chocante','#dica #tutorial','#segredo #fyp','#emocao #viral'];const clips=[];for(let i=0;i<n;i++){const inicio=Math.floor(Math.random()*400)+15;clips.push({id:Date.now()+'-'+i,s:inicio,duration:60,title:titles[i%5],mood:moods[i%5],palavrasP1:legendas[i%5].p1.split(' '),palavrasP2:legendas[i%5].p2.split(' '),hashtags:hashtags[i%5],vir:(7+Math.random()*3).toFixed(1),postado:!1,platform:'',falaAtual:0,palavraIdx:0})}return clips}
function renderCortes(){const g=document.getElementById('cortesSalvos');if(!g||!Z.clips.length)return;g.innerHTML=Z.clips.map((c,i)=>'<div class="corte-card'+(c.postado?' posted':'')+'" id="corte-'+i+'"><div class="video-box"><div class="corte-num">'+(i+1)+'</div>'+(c.postado?'<div class="corte-badge">✅ Postado</div>':'')+'<div class="corte-timer">⏱ 1:00</div><div class="tiktok-legenda" id="legenda-'+i+'"></div><iframe src="https://www.youtube.com/embed/'+Z.vid+'?start='+c.s+'&end='+(c.s+60)+'&autoplay=0&rel=0&modestbranding=1" allowfullscreen></iframe></div><div class="corte-body"><div class="corte-titulo">'+c.title+'</div><div class="corte-info">😊 '+c.mood+' | 🔥 '+c.vir+'/10 | ⏱ '+fmt(c.s)+' → '+fmt(c.s+60)+'</div><div class="corte-info" style="color:var(--accent);">'+c.hashtags+'</div></div><div class="corte-actions">'+(c.postado?'<span style="color:var(--success);font-size:10px;">✅ Postado</span>':'<button class="btn btn-youtube btn-xs" onclick="postarCorte('+i+',\'youtube\')"><i class="fab fa-youtube"></i></button><button class="btn btn-tiktok btn-xs" onclick="postarCorte('+i+',\'tiktok\')"><i class="fab fa-tiktok"></i></button><button class="btn btn-kwai btn-xs" onclick="postarCorte('+i+',\'kwai\')"><i class="fas fa-play"></i></button>')+'</div></div>').join('')}
function iniciarLegendas(){Z.clips.forEach((c,i)=>{if(Z.timers[i])clearInterval(Z.timers[i]);c.falaAtual=0;c.palavraIdx=0;animarLegenda(i)})}
function animarLegenda(i){const c=Z.clips[i];if(!c||c.postado)return;const palavras=c.falaAtual===0?c.palavrasP1:c.palavrasP2;const container=document.getElementById('legenda-'+i);if(!container)return;if(c.palavraIdx>=palavras.length){c.falaAtual=(c.falaAtual+1)%2;c.palavraIdx=0;Z.timers[i]=setTimeout(()=>animarLegenda(i),800);return}container.innerHTML=palavras.map((p,idx)=>'<span class="tiktok-palavra '+(c.falaAtual===0?'p1':'p2')+(idx===c.palavraIdx?' destaque':'')+'" style="animation-delay:'+(idx*.05)+'s">'+p+'</span>').join('');c.palavraIdx++;Z.timers[i]=setTimeout(()=>animarLegenda(i),350)}
function postarCorte(i,platform){Z.clips[i].postado=!0;Z.clips[i].platform=platform;Z.postados++;updateStatus();saveClips();if(Z.timers[i])clearTimeout(Z.timers[i]);window.open(CANAIS[platform],'_blank');renderCortes();iniciarLegendas();toast('📤 Postado!','success')}
function postarTodos(platform){Z.clips.filter(c=>!c.postado).forEach((c,i)=>{setTimeout(()=>{c.postado=!0;c.platform=platform;Z.postados++;updateStatus();saveClips();window.open(CANAIS[platform],'_blank');renderCortes();iniciarLegendas()},i*1200)})}
function updateStatus(){document.getElementById('stTotal').textContent=Z.clips.length;document.getElementById('stPostados').textContent=Z.postados}
function fmt(s){const m=Math.floor(s/60),se=Math.floor(s%60);return m+':'+se.toString().padStart(2,'0')}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function toast(m,t='info'){const c=document.getElementById('toasts');const d=document.createElement('div');d.className='toast toast-'+t;d.textContent=m;c.appendChild(d);setTimeout(()=>d.remove(),2500)}
</script></body></html>
