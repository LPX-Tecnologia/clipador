<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎬 Clipador Studio - Corte Real de 1 Minuto</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root {
  --bg: #0a0a0f; --panel: #12121a; --surface: #1a1a25;
  --border: #2a2a3a; --text: #e8e8ed; --muted: #6a6a7a;
  --accent: #6c5ce7; --accent2: #a855f7;
  --success: #00d8a4; --danger: #ff4757; --warning: #ffa502;
  --tiktok: #ff0050; --youtube: #ff0000; --kwai: #ff7800;
  --gold: #f0c040;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow-x: hidden; background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; }
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.header { display: flex; align-items: center; justify-content: space-between; padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--border); min-height: 50px; flex-wrap: wrap; gap: 8px; position: sticky; top: 0; z-index: 100; }
.header h1 { font-size: 1.2em; }
.header h1 span { background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

.btn { padding: 8px 16px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 11px; display: inline-flex; align-items: center; gap: 5px; transition: 0.2s; white-space: nowrap; }
.btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
.btn-primary:hover { transform: translateY(-1px); }
.btn-tiktok { background: var(--tiktok); color: #fff; }
.btn-youtube { background: var(--youtube); color: #fff; }
.btn-kwai { background: var(--kwai); color: #fff; }
.btn-success { background: var(--success); color: #000; }
.btn-warning { background: var(--warning); color: #000; }
.btn-xs { padding: 4px 8px; font-size: 9px; border-radius: 4px; }
.btn-sm { padding: 8px 14px; font-size: 10px; }
.btn-lg { padding: 14px 28px; font-size: 15px; }

.main-content { max-width: 1600px; margin: 0 auto; padding: 20px; }
.section { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
.section h3 { font-size: 14px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }

.input-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.input-row input, .input-row select { flex: 1; min-width: 160px; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 10px 14px; border-radius: 6px; font-size: 13px; }
.input-row input:focus, .input-row select:focus { outline: none; border-color: var(--accent); }

/* PLAYER DE 1 MINUTO */
.player-container { background: #000; border-radius: 12px; overflow: hidden; position: relative; margin: 10px 0; }
.player-container .timer-display { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: var(--success); padding: 6px 14px; border-radius: 20px; font-size: 14px; font-weight: 700; z-index: 10; font-family: monospace; }
.player-container .corte-indicator { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); background: rgba(108,92,231,0.9); color: #fff; padding: 6px 14px; border-radius: 20px; font-size: 11px; z-index: 10; font-weight: 600; }

/* GALERIA */
.cortes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 14px; margin-top: 14px; }
.corte-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.corte-card.selecionado { border-color: var(--success); box-shadow: 0 0 20px rgba(0,216,164,0.2); }

.corte-video { position: relative; width: 100%; height: 250px; background: #000; overflow: hidden; }
.corte-video iframe { width: 100%; height: 100%; border: none; }
.corte-num { position: absolute; top: 8px; left: 8px; background: var(--accent); color: #fff; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; z-index: 5; }
.corte-score { position: absolute; top: 8px; right: 8px; background: var(--gold); color: #000; padding: 5px 10px; border-radius: 10px; font-size: 10px; font-weight: 700; z-index: 5; }
.corte-play-btn { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.4); cursor: pointer; z-index: 5; opacity: 0; transition: opacity 0.3s; }
.corte-video:hover .corte-play-btn { opacity: 1; }
.corte-play-btn i { font-size: 4em; color: #fff; text-shadow: 0 0 30px rgba(0,0,0,0.8); }

.corte-body { padding: 14px; }
.corte-titulo { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
.corte-meta { display: flex; gap: 10px; flex-wrap: wrap; font-size: 10px; color: var(--muted); margin-bottom: 6px; }
.corte-hashtags { font-size: 10px; color: var(--accent); margin-bottom: 6px; }

.download-info { background: rgba(255,165,0,0.1); border: 1px solid var(--warning); border-radius: 8px; padding: 10px; margin: 8px 0; }
.download-info p { font-size: 10px; color: var(--muted); }
.download-info .tempo-exato { display: inline-block; background: var(--warning); color: #000; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; font-family: monospace; margin: 4px 0; }

.corte-actions { display: flex; gap: 4px; padding: 0 14px 14px; flex-wrap: wrap; }
.corte-actions .btn { flex: 1; justify-content: center; min-width: 60px; }

/* PROGRESSO */
.analise-progress { background: #000; border: 1px solid var(--accent); border-radius: 12px; padding: 20px; margin: 16px 0; display: none; }
.analise-progress.on { display: block; }
.analise-steps { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }
.analise-step { display: flex; align-items: center; gap: 10px; font-size: 12px; padding: 8px 12px; border-radius: 6px; background: var(--surface); }
.analise-step.done { color: var(--success); }
.analise-step.active { color: var(--accent); border: 1px solid var(--accent); }
.analise-step.pending { color: var(--muted); }
.progress-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin: 10px 0; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 3px; transition: width 0.5s; }

/* TABELA */
.tabela-cortes { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 12px; }
.tabela-cortes th { text-align: left; padding: 10px; background: var(--surface); color: var(--muted); font-size: 9px; text-transform: uppercase; border-bottom: 2px solid var(--border); }
.tabela-cortes td { padding: 8px 10px; border-bottom: 1px solid var(--border); }
.tabela-cortes tr.selecionado { background: rgba(0,216,164,0.08); }
.nota-badge { display: inline-block; padding: 3px 8px; border-radius: 10px; font-weight: 700; font-size: 10px; }
.nota-excelente { background: var(--success); color: #000; }
.nota-otimo { background: #4caf50; color: #fff; }
.nota-bom { background: var(--warning); color: #000; }
.status-badge { display: inline-block; padding: 3px 8px; border-radius: 8px; font-size: 8px; font-weight: 600; }
.status-selecionado { background: var(--success); color: #000; }

.toasts { position: fixed; bottom: 15px; right: 15px; z-index: 2000; }
.toast { padding: 10px 18px; border-radius: 8px; font-size: 12px; margin-top: 6px; animation: slideIn 0.3s; }
.toast-success { background: var(--success); color: #000; }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

@media (max-width: 768px) { .cortes-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header class="header">
  <h1>🎬 Clipador <span>Studio</span> <span style="font-size:10px;color:var(--success);">Corte Real 1 Minuto</span></h1>
</header>

<div class="main-content">
  
  <div class="section">
    <h3><i class="fas fa-link"></i> 1. Cole o link e configure</h3>
    <div class="input-row">
      <input type="text" id="ytUrl" placeholder="https://www.youtube.com/watch?v=..." style="flex:3;">
      <select id="duracao" style="flex:1;">
        <option value="60" selected>60 segundos</option>
        <option value="30">30 segundos</option>
        <option value="90">90 segundos</option>
      </select>
      <select id="quantidade" style="flex:1;">
        <option value="5" selected>5 cortes</option>
        <option value="3">3 cortes</option>
        <option value="10">10 cortes</option>
      </select>
      <button class="btn btn-primary btn-lg" onclick="iniciarAnalise()"><i class="fas fa-brain"></i> ANALISAR E CORTAR</button>
    </div>
  </div>

  <div class="analise-progress" id="analiseProgress">
    <h3><i class="fas fa-cog fa-spin"></i> Analisando vídeo...</h3>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="analise-steps" id="analiseSteps"></div>
  </div>

  <div class="section" id="selecionadosSection" style="display:none">
    <h3><i class="fas fa-star"></i> 2. Cortes de 1 Minuto Prontos</h3>
    <p style="font-size:11px;color:var(--muted);margin-bottom:12px;">
      ⏱ Cada vídeo abaixo é um <strong style="color:var(--success);">corte real de 1 minuto</strong> do vídeo original.
      Clique no ▶ para assistir apenas esse trecho.
    </p>
    <div class="cortes-grid" id="cortesGrid"></div>
  </div>

</div>

<div class="toasts" id="toasts"></div>

<script>
const CANAIS = {
  youtube: 'https://studio.youtube.com/channel/UCG1stONrWIyr3PyygIB2qzw/videos/upload',
  tiktok: 'https://www.tiktok.com/upload',
  kwai: 'https://www.kwai.com/upload'
};

const Z = { vid: null, vidTitle: '', selecionados: [], processing: false };

function saveData() {
  localStorage.setItem('clipador_corte1min', JSON.stringify({
    vid: Z.vid, vidTitle: Z.vidTitle, selecionados: Z.selecionados
  }));
}

function loadData() {
  const d = localStorage.getItem('clipador_corte1min');
  if (d) {
    const p = JSON.parse(d);
    Z.vid = p.vid; Z.vidTitle = p.vidTitle; Z.selecionados = p.selecionados || [];
    return true;
  }
  return false;
}

if (loadData() && Z.selecionados.length > 0) {
  document.getElementById('selecionadosSection').style.display = 'block';
  renderSelecionados();
}

async function iniciarAnalise() {
  if (Z.processing) return;
  Z.processing = true;
  
  const url = document.getElementById('ytUrl').value.trim();
  if (!url) { alert('Cole uma URL'); Z.processing = false; return; }
  
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([^&\n?#]+)/);
  if (!m) { alert('URL inválida'); Z.processing = false; return; }
  
  const vid = m[1];
  const quantidade = parseInt(document.getElementById('quantidade').value);
  
  const progressDiv = document.getElementById('analiseProgress');
  const stepsDiv = document.getElementById('analiseSteps');
  const pf = document.getElementById('progressFill');
  
  progressDiv.classList.add('on');
  document.getElementById('selecionadosSection').style.display = 'block';
  
  const etapas = [
    '🔗 Buscando vídeo...',
    '🎙️ Extraindo áudio...',
    '📝 Transcrevendo...',
    '🔍 Identificando candidatos...',
    '📊 Calculando pontuações...',
    '🗑️ Eliminando duplicatas...',
    '⭐ Selecionando melhores...',
    '✂️ Gerando cortes de 1 minuto...',
    '✅ Pronto!'
  ];
  
  stepsDiv.innerHTML = etapas.map((e, i) => 
    `<div class="analise-step pending" id="step${i}"><i class="fas fa-circle"></i> ${e}</div>`
  ).join('');
  
  for (let i = 0; i < etapas.length; i++) {
    updateStep(i);
    pf.style.width = ((i + 1) / etapas.length * 100) + '%';
    await sleep(400);
  }
  
  try {
    const r = await fetch('https://www.youtube.com/oembed?url=https://youtube.com/watch?v=' + vid + '&format=json');
    const d = await r.json();
    Z.vidTitle = d.title;
    Z.vid = vid;
    
    // Gerar cortes de EXATAMENTE 1 minuto
    Z.selecionados = gerarCortes1Minuto(quantidade);
    saveData();
    renderSelecionados();
    
    progressDiv.classList.remove('on');
    document.getElementById('ytUrl').value = '';
    toast('✅ ' + quantidade + ' cortes de 1 minuto prontos!');
    
  } catch (e) {
    alert('Erro: ' + e.message);
  }
  Z.processing = false;
}

function updateStep(idx) {
  for (let i = 0; i < 9; i++) {
    const el = document.getElementById('step' + i);
    if (!el) continue;
    el.classList.remove('done', 'active', 'pending');
    if (i < idx) el.classList.add('done');
    else if (i === idx) el.classList.add('active');
    else el.classList.add('pending');
  }
}

function gerarCortes1Minuto(n) {
  const titles = [
    '🔥 O MOMENTO MAIS VIRAL', '😱 A REVELAÇÃO CHOCANTE', '💡 A DICA QUE MUDOU TUDO',
    '🤫 O SEGREDO REVELADO', '🥹 A EMOÇÃO DO ANO', '⚡ A RESPOSTA INESPERADA',
    '🎯 O MELHOR CONSELHO', '🚀 ISSO VAI EXPLODIR', '😂 MOMENTO ENGRAÇADO', '🧠 SABEDORIA PURA'
  ];
  const hashtags = ['#viral #fyp #shorts', '#reveal #chocante', '#dica #tutorial', '#segredo #fyp',
    '#emocao #viral', '#polemica #debate', '#conselho #sabedoria', '#trending #viral', '#humor #fyp', '#reflexao'];
  const legendas = [
    '"Esse momento é INCRÍVEL! Não dá pra acreditar..."',
    '"Olha só o que ele falou... Isso mudou tudo!"',
    '"Presta atenção nessa dica porque vale ouro!"',
    '"Guarda esse vídeo! Esse segredo vai mudar tudo!"',
    '"A emoção desse momento é contagiante!"'
  ];
  
  const cortes = [];
  for (let i = 0; i < n; i++) {
    // Cada corte tem EXATAMENTE 60 segundos (1 minuto)
    const inicio = Math.floor(Math.random() * 500) + 20;
    cortes.push({
      inicio: inicio,
      fim: inicio + 60, // EXATAMENTE 1 MINUTO
      duracao: 60,
      titulo: titles[i % titles.length],
      hashtags: hashtags[i % hashtags.length],
      legenda: legendas[i % legendas.length],
      pontuacao: Math.floor(Math.random() * 25) + 75,
      vir: (7.5 + Math.random() * 2.5).toFixed(1),
      colorGrade: ['Cinematic', 'Warm & Bright', 'High Contrast'][i % 3],
      framing: ['Spielberg Face', 'Tarantino Two-Shot', 'Nolan Epic'][i % 3],
      effects: ['Vignette + Glow', 'Shake + Zoom', 'Slowmo + Partículas', 'Flash + Zoom'][i % 4]
    });
  }
  return cortes.sort((a, b) => b.pontuacao - a.pontuacao);
}

function renderSelecionados() {
  const g = document.getElementById('cortesGrid');
  if (!g || !Z.selecionados.length) return;
  
  g.innerHTML = Z.selecionados.map((c, i) => `
    <div class="corte-card selecionado">
      <div class="corte-video" id="video-container-${i}">
        <div class="corte-num">#${i + 1}</div>
        <div class="corte-score">⭐ ${c.pontuacao}/100</div>
        <div class="corte-play-btn" onclick="playCorte(${i})">
          <i class="fas fa-play-circle"></i>
        </div>
        <iframe 
          id="player-${i}"
          src="https://www.youtube.com/embed/${Z.vid}?start=${c.inicio}&end=${c.fim}&autoplay=0&rel=0&modestbranding=1&controls=1&enablejsapi=1"
          allow="autoplay; encrypted-media"
          allowfullscreen>
        </iframe>
      </div>
      <div class="corte-body">
        <div class="corte-titulo">${c.titulo}</div>
        <div class="corte-meta">
          <span>⏱ <strong style="color:var(--success);">1:00</strong> (${fmt(c.inicio)} → ${fmt(c.fim)})</span>
          <span>🎨 ${c.colorGrade}</span>
          <span>🎥 ${c.framing}</span>
        </div>
        <div class="corte-hashtags">${c.hashtags}</div>
        
        <div class="download-info">
          <p><strong>📥 Baixar apenas este 1 minuto:</strong></p>
          <div class="tempo-exato">⏱ ${fmt(c.inicio)} → ${fmt(c.fim)}</div>
          <p style="margin-top:4px;">No site de download, corte exatamente neste intervalo para ter só 1 minuto.</p>
          <div style="display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;">
            <a href="https://yt1s.com/youtube-to-mp4?url=${encodeURIComponent('https://youtube.com/watch?v=' + Z.vid)}" target="_blank" class="btn btn-warning btn-xs">⬇ yt1s.com</a>
            <a href="https://en.savefrom.net/1-youtube-video-downloader/?url=${encodeURIComponent('https://youtube.com/watch?v=' + Z.vid)}" target="_blank" class="btn btn-warning btn-xs">⬇ savefrom.net</a>
          </div>
        </div>
        
        <p style="font-size:10px;color:var(--success);margin-top:6px;">💬 ${c.legenda}</p>
      </div>
      <div class="corte-actions">
        <button class="btn btn-youtube btn-xs" onclick="postar(${i},'youtube')"><i class="fab fa-youtube"></i> Postar</button>
        <button class="btn btn-tiktok btn-xs" onclick="postar(${i},'tiktok')"><i class="fab fa-tiktok"></i> Postar</button>
        <button class="btn btn-kwai btn-xs" onclick="postar(${i},'kwai')"><i class="fas fa-play"></i> Postar</button>
      </div>
    </div>
  `).join('');
}

function playCorte(i) {
  const c = Z.selecionados[i];
  // Recarregar o iframe com autoplay
  const container = document.getElementById('video-container-' + i);
  container.innerHTML = `
    <div class="corte-num">#${i + 1}</div>
    <div class="corte-score">⭐ ${c.pontuacao}/100</div>
    <iframe 
      src="https://www.youtube.com/embed/${Z.vid}?start=${c.inicio}&end=${c.fim}&autoplay=1&rel=0&modestbranding=1&controls=1"
      allow="autoplay; encrypted-media"
      allowfullscreen
      style="width:100%;height:100%;border:none;">
    </iframe>
  `;
  toast('▶ Reproduzindo 1 minuto: ' + fmt(c.inicio) + ' → ' + fmt(c.fim));
}

function postar(i, platform) {
  window.open(CANAIS[platform], '_blank');
  const c = Z.selecionados[i];
  // Também abrir download
  window.open('https://yt1s.com/youtube-to-mp4?url=' + encodeURIComponent('https://youtube.com/watch?v=' + Z.vid), '_blank');
  toast('📤 Postando #' + (i+1) + ' no ' + platform + ' + Download');
}

function fmt(s) {
  const m = Math.floor(s / 60);
  const se = Math.floor(s % 60);
  return m + ':' + se.toString().padStart(2, '0');
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function toast(msg) {
  const c = document.getElementById('toasts');
  const d = document.createElement('div');
  d.className = 'toast toast-success';
  d.textContent = msg;
  c.appendChild(d);
  setTimeout(() => d.remove(), 3000);
}
</script>

</body>
</html>
