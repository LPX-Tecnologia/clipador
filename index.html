<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Clipador Studio</title>
</head>
<body style="background:#0a0a0f;color:white;font-family:sans-serif;padding:20px;">
<h1>🎬 Clipador Studio</h1>
<p>Se você está vendo isso, o HTML carregou!</p>

<input type="text" id="ytUrl" placeholder="Cole o link do YouTube" style="padding:10px;width:100%;max-width:500px;margin:10px 0;background:#1a1a25;color:white;border:1px solid #2a2a3a;border-radius:6px;">
<button onclick="testar()" style="padding:10px 20px;background:#6c5ce7;color:white;border:none;border-radius:6px;cursor:pointer;">TESTAR</button>

<div id="resultado" style="margin-top:20px;"></div>

<script>
function testar() {
  const url = document.getElementById('ytUrl').value;
  if (!url) {
    document.getElementById('resultado').innerHTML = '<p style="color:red;">Digite uma URL</p>';
    return;
  }
  
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([^&\n?#]+)/);
  if (!m) {
    document.getElementById('resultado').innerHTML = '<p style="color:red;">URL inválida</p>';
    return;
  }
  
  const vid = m[1];
  document.getElementById('resultado').innerHTML = `
    <p style="color:green;">✅ Vídeo encontrado! ID: ${vid}</p>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/${vid}?start=60&end=120" frameborder="0" allowfullscreen></iframe>
    <p>Este é um trecho de 1 minuto (60s - 120s)</p>
  `;
}
</script>
</body>
</html><!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎬 Clipador Studio</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root {
  --bg: #0a0a0f; --panel: #12121a; --surface: #1a1a25;
  --border: #2a2a3a; --text: #e8e8ed; --muted: #6a6a7a;
  --accent: #6c5ce7; --accent2: #a855f7;
  --success: #00d8a4; --danger: #ff4757; --warning: #ffa502;
  --tiktok: #ff0050; --youtube: #ff0000; --kwai: #ff7800;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow-x: hidden; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.header { display: flex; align-items: center; justify-content: space-between; padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--border); min-height: 50px; flex-wrap: wrap; gap: 8px; }
.header h1 { font-size: 1.2em; }
.header h1 span { background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.header-actions { display: flex; gap: 5px; flex-wrap: wrap; }

.btn { padding: 8px 16px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 11px; display: inline-flex; align-items: center; gap: 5px; transition: 0.2s; white-space: nowrap; }
.btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
.btn-primary:hover { transform: translateY(-1px); }
.btn-tiktok { background: var(--tiktok); color: #fff; }
.btn-youtube { background: var(--youtube); color: #fff; }
.btn-kwai { background: var(--kwai); color: #fff; }
.btn-success { background: var(--success); color: #000; }
.btn-xs { padding: 5px 10px; font-size: 9px; border-radius: 4px; }
.btn-sm { padding: 8px 14px; font-size: 10px; }
.btn-lg { padding: 14px 28px; font-size: 15px; }

.main-content { max-width: 1400px; margin: 0 auto; padding: 20px; }
.section { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
.section h3 { font-size: 14px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.section h3 i { color: var(--accent); }

.input-row { display: flex; gap: 8px; flex-wrap: wrap; }
.input-row input, .input-row select { flex: 1; min-width: 180px; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 10px 14px; border-radius: 6px; font-size: 13px; }
.input-row input:focus, .input-row select:focus { outline: none; border-color: var(--accent); }

.status-bar { display: flex; gap: 12px; padding: 10px 14px; background: var(--surface); border-radius: 8px; margin-bottom: 14px; font-size: 11px; align-items: center; flex-wrap: wrap; }
.status-bar b { color: var(--accent); }

.cortes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 14px; margin-top: 14px; }
.corte-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; transition: 0.2s; }
.corte-card:hover { border-color: var(--accent); }
.corte-card.posted { border-color: var(--success); }
.corte-video { position: relative; width: 100%; height: 220px; background: #000; overflow: hidden; }
.corte-video iframe { width: 100%; height: 100%; border: none; }
.corte-num { position: absolute; top: 8px; left: 8px; background: var(--accent); color: #fff; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; z-index: 5; }
.corte-timer { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.8); color: var(--success); padding: 3px 8px; border-radius: 8px; font-size: 9px; z-index: 5; font-family: monospace; }
.corte-badge { position: absolute; top: 8px; right: 8px; background: var(--success); color: #000; padding: 4px 10px; border-radius: 10px; font-size: 9px; font-weight: 700; z-index: 5; }
.corte-body { padding: 14px; }
.corte-titulo { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
.corte-info { font-size: 10px; color: var(--muted); margin-bottom: 4px; display: flex; flex-wrap: wrap; gap: 8px; }
.corte-hashtags { font-size: 10px; color: var(--accent); margin-bottom: 6px; }
.corte-legenda { background: rgba(108,92,231,0.08); border-left: 3px solid var(--accent); padding: 8px 10px; border-radius: 0 6px 6px 0; font-size: 10px; font-style: italic; margin-bottom: 8px; line-height: 1.4; }
.corte-actions { display: flex; gap: 4px; padding: 0 14px 14px; flex-wrap: wrap; }
.corte-actions .btn { flex: 1; justify-content: center; min-width: 55px; }

.toasts { position: fixed; bottom: 15px; right: 15px; z-index: 2000; display: flex; flex-direction: column; gap: 6px; }
.toast { padding: 10px 18px; border-radius: 8px; font-size: 12px; font-weight: 500; animation: slideIn 0.3s; }
.toast-success { background: var(--success); color: #000; }
.toast-error { background: var(--danger); color: #fff; }
.toast-info { background: var(--accent); color: #fff; }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

@media (max-width: 768px) {
  .cortes-grid { grid-template-columns: 1fr; }
  .header { flex-direction: column; align-items: flex-start; }
  .input-row { flex-direction: column; }
  .input-row input, .input-row select { min-width: 100%; }
}
</style>
</head>
<body>

<header class="header">
  <h1>🎬 Clipador <span>Studio</span></h1>
  <div class="header-actions">
    <span style="font-size:10px;color:var(--success);">✅ Canal YouTube Conectado</span>
    <a href="https://studio.youtube.com/channel/UCG1stONrWIyr3PyygIB2qzw/videos/upload" target="_blank" class="btn btn-youtube btn-xs"><i class="fab fa-youtube"></i> YouTube Studio</a>
  </div>
</header>

<div class="main-content">
  
  <div class="section">
    <h3><i class="fas fa-link"></i> Cole o link do YouTube</h3>
    <div class="input-row">
      <input type="text" id="ytUrl" placeholder="https://www.youtube.com/watch?v=...">
      <select id="numClips">
        <option value="3">3 cortes</option>
        <option value="5" selected>5 cortes</option>
        <option value="10">10 cortes</option>
      </select>
      <button class="btn btn-primary btn-lg" onclick="processarVideo()"><i class="fas fa-cut"></i> GERAR CORTES DE 1 MINUTO</button>
    </div>
  </div>

  <div id="statusBar" class="status-bar" style="display:none">
    <span>📹 <b id="stTotal">0</b> cortes</span>
    <span>✅ <b id="stPostados">0</b> postados</span>
    <span>⏳ <b id="stPendentes">0</b> pendentes</span>
  </div>

  <div class="section" id="galeriaSection" style="display:none">
    <h3><i class="fas fa-images"></i> Cortes Gerados (1 minuto cada)</h3>
    <div class="cortes-grid" id="cortesGrid">
      <p style="color:var(--muted);text-align:center;padding:40px;grid-column:1/-1;">Cole um link e clique em Gerar Cortes</p>
    </div>
  </div>

</div>

<div class="toasts" id="toasts"></div>

<script>
// ============ CLIPADOR STUDIO ============
const CANAIS = {
  youtube: 'https://studio.youtube.com/channel/UCG1stONrWIyr3PyygIB2qzw/videos/upload',
  tiktok: 'https://www.tiktok.com/upload',
  kwai: 'https://www.kwai.com/upload'
};

const Z = {
  vid: null, vidTitle: '', clips: [], postados: 0, processing: false
};

// Salvar/Carregar
function saveClips() {
  localStorage.setItem('clipador_v1', JSON.stringify({ vid: Z.vid, vidTitle: Z.vidTitle, clips: Z.clips, postados: Z.postados }));
}

function loadClips() {
  const d = localStorage.getItem('clipador_v1');
  if (d) {
    const p = JSON.parse(d);
    Z.vid = p.vid; Z.vidTitle = p.vidTitle; Z.clips = p.clips; Z.postados = p.postados;
    return true;
  }
  return false;
}

// Iniciar
(function() {
  if (loadClips()) {
    document.getElementById('galeriaSection').style.display = 'block';
    document.getElementById('statusBar').style.display = 'flex';
    renderCortes();
    updateStatus();
  }
  console.log('🎬 Clipador Studio pronto!');
  console.log('💡 Cole um link do YouTube e clique em Gerar Cortes');
})();

// Processar vídeo
async function processarVideo() {
  if (Z.processing) return;
  Z.processing = true;
  
  const url = document.getElementById('ytUrl').value.trim();
  if (!url) { alert('Cole uma URL do YouTube'); Z.processing = false; return; }
  
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([^&\n?#]+)/);
  if (!m) { alert('URL inválida'); Z.processing = false; return; }
  
  const vid = m[1];
  const num = parseInt(document.getElementById('numClips').value);
  
  document.getElementById('galeriaSection').style.display = 'block';
  document.getElementById('statusBar').style.display = 'flex';
  
  try {
    const r = await fetch('https://www.youtube.com/oembed?url=https://youtube.com/watch?v=' + vid + '&format=json');
    const d = await r.json();
    Z.vidTitle = d.title;
    Z.vid = vid;
    Z.clips = generateClips(num, vid);
    Z.postados = 0;
    saveClips();
    renderCortes();
    updateStatus();
    toast('✅ ' + Z.clips.length + ' cortes gerados!', 'success');
    document.getElementById('ytUrl').value = '';
  } catch (e) {
    alert('Erro: ' + e.message);
  }
  Z.processing = false;
}

// Gerar cortes
function generateClips(n, vid) {
  const moods = ['😊 Alegre', '😲 Surpreso', '🔥 Impactante', '😂 Engraçado', '💪 Motivador'];
  const titles = ['🔥 O MOMENTO MAIS VIRAL', '😱 A REVELAÇÃO CHOCANTE', '💡 A DICA QUE MUDOU TUDO', '🤫 O SEGREDO REVELADO', '🥹 A PARTE MAIS EMOCIONANTE'];
  const effects = ['Vignette + Glow', 'Shake + Zoom', 'Slowmo + Partículas', 'Flash + Zoom', 'Fade + Glow'];
  const hashtags = ['#viral #fyp #shorts', '#reveal #chocante', '#dica #tutorial', '#segredo #fyp', '#emocao #viral'];
  const legendas = [
    '"Esse momento é INCRÍVEL! Não dá pra acreditar..."',
    '"Olha só o que ele falou... Isso mudou tudo!"',
    '"Presta atenção nessa dica porque vale ouro!"',
    '"Guarda esse vídeo porque esse segredo vai mudar tudo!"',
    '"A emoção desse momento é contagiante!"'
  ];
  
  const clips = [];
  for (let i = 0; i < n; i++) {
    const inicio = Math.floor(Math.random() * 400) + 15;
    clips.push({
      id: Date.now() + '-' + i, s: inicio, duration: 60,
      title: titles[i % 5], mood: moods[i % 5], effects: effects[i % 5],
      hashtags: hashtags[i % 5], legenda: legendas[i % 5],
      vir: (7 + Math.random() * 3).toFixed(1),
      colorGrade: ['Cinematic', 'Warm & Bright', 'High Contrast'][i % 3],
      framing: ['Spielberg Face', 'Tarantino Two-Shot', 'Nolan Epic'][i % 3],
      postado: false, platform: ''
    });
  }
  return clips;
}

// Renderizar
function renderCortes() {
  const g = document.getElementById('cortesGrid');
  if (!g || !Z.clips.length) return;
  
  g.innerHTML = Z.clips.map((c, i) => `
    <div class="corte-card ${c.postado ? 'posted' : ''}">
      <div class="corte-video">
        <div class="corte-num">${i + 1}</div>
        <div class="corte-timer">⏱ 1:00</div>
        ${c.postado ? '<div class="corte-badge">✅ Postado</div>' : ''}
        <iframe src="https://www.youtube.com/embed/${Z.vid}?start=${c.s}&end=${c.s + 60}&autoplay=0&rel=0&modestbranding=1&controls=1" allowfullscreen></iframe>
      </div>
      <div class="corte-body">
        <div class="corte-titulo">${c.title}</div>
        <div class="corte-info">
          <span>😊 ${c.mood}</span> | <span>🎨 ${c.colorGrade}</span> | <span>🎥 ${c.framing}</span> | <span>🔥 ${c.vir}/10</span>
        </div>
        <div class="corte-hashtags">${c.hashtags}</div>
        <div class="corte-legenda">💬 ${c.legenda}</div>
      </div>
      <div class="corte-actions">
        ${c.postado ? '<span style="font-size:10px;color:var(--success);text-align:center;width:100%;">✅ Já postado</span>' : `
          <button class="btn btn-youtube btn-xs" onclick="postar(${i},'youtube')"><i class="fab fa-youtube"></i></button>
          <button class="btn btn-tiktok btn-xs" onclick="postar(${i},'tiktok')"><i class="fab fa-tiktok"></i></button>
          <button class="btn btn-kwai btn-xs" onclick="postar(${i},'kwai')"><i class="fas fa-play"></i></button>
        `}
      </div>
    </div>
  `).join('');
}

// Postar
function postar(i, platform) {
  Z.clips[i].postado = true;
  Z.clips[i].platform = platform;
  Z.postados++;
  updateStatus();
  saveClips();
  window.open(CANAIS[platform], '_blank');
  renderCortes();
  toast('📤 Postado no ' + platform + '!', 'success');
}

// Status
function updateStatus() {
  const t = Z.clips.length;
  const p = Z.clips.filter(c => c.postado).length;
  document.getElementById('stTotal').textContent = t;
  document.getElementById('stPostados').textContent = p;
  document.getElementById('stPendentes').textContent = t - p;
}

// Utils
function toast(msg, type) {
  const c = document.getElementById('toasts');
  const d = document.createElement('div');
  d.className = 'toast toast-' + type;
  d.textContent = msg;
  c.appendChild(d);
  setTimeout(() => { d.style.opacity = '0'; d.style.transition = 'opacity 0.3s'; setTimeout(() => d.remove(), 300); }, 2500);
}
</script>

</body>
</html>
