<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>🎬 Clipador Studio - Kinetic Typography</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><style>
:root{--bg:#0a0a0f;--panel:#12121a;--surface:#1a1a25;--border:#2a2a3a;--text:#e8e8ed;--muted:#6a6a7a;--accent:#6c5ce7;--accent2:#a855f7;--success:#00d8a4;--danger:#ff4757;--warning:#ffa502;--tiktok:#ff0050;--youtube:#ff0000;--kwai:#ff7800}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;overflow-x:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,sans-serif}::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.loader{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity .5s}.loader.hidden{opacity:0;pointer-events:none}.loader-content{text-align:center}.loader-icon{font-size:4em;color:var(--accent);animation:pulse 2s infinite;margin-bottom:20px}.loader-content h2{font-size:1.8em}.loader-content h2 span{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}.loader-content p{color:var(--muted);font-size:14px;margin-bottom:20px}.loader-bar{width:200px;height:4px;background:var(--border);border-radius:2px;margin:0 auto;overflow:hidden}.loader-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));animation:fillBar 2.8s ease forwards;border-radius:2px}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}@keyframes fillBar{0%{width:0}100%{width:100%}}
.app{min-height:100vh;display:flex;flex-direction:column}.header{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--border);min-height:50px;position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:8px}.header h1{font-size:1.1em}.header h1 span{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.btn{padding:7px 14px;border:none;border-radius:5px;font-weight:600;cursor:pointer;font-size:11px;display:inline-flex;align-items:center;gap:5px;transition:.2s;white-space:nowrap}.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}.btn-tiktok{background:var(--tiktok);color:#fff}.btn-youtube{background:var(--youtube);color:#fff}.btn-kwai{background:var(--kwai);color:#fff}.btn-success{background:var(--success);color:#000}.btn-xs{padding:4px 8px;font-size:9px}.btn-sm{padding:8px 16px;font-size:12px}.btn-lg{padding:14px 28px;font-size:15px}
.main-content{flex:1;padding:15px;max-width:1600px;margin:0 auto;width:100%}
.section{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:15px}.section h3{font-size:14px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.input-row{display:flex;gap:8px;flex-wrap:wrap}.input-row input,.input-row select{flex:1;min-width:150px;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:10px;border-radius:6px;font-size:13px}.input-row input:focus,.input-row select:focus{outline:none;border-color:var(--accent)}
.editor-principal{display:none;grid-template-columns:1fr 320px;gap:15px;margin-top:15px}.video-container{position:relative;background:#000;border-radius:12px;overflow:hidden;min-height:450px}.video-container iframe{width:100%;height:100%;border:none;position:absolute;top:0;left:0}.kinetic-layer{position:absolute;inset:0;z-index:10;pointer-events:none;overflow:hidden}.kinetic-word{position:absolute;font-weight:900;text-shadow:0 2px 8px rgba(0,0,0,.9);white-space:nowrap;letter-spacing:-0.5px}.kinetic-word.p1{color:#fff;text-shadow:0 0 20px rgba(108,92,231,.8),0 2px 8px rgba(0,0,0,.9)}.kinetic-word.p2{color:#fff;text-shadow:0 0 20px rgba(255,107,107,.8),0 2px 8px rgba(0,0,0,.9)}.kinetic-word.emphasis{color:#ff0;text-shadow:0 0 30px rgba(255,255,0,.9),0 4px 12px rgba(0,0,0,.9);animation:emphasisPulse .5s ease infinite alternate}@keyframes emphasisPulse{from{filter:brightness(1)}to{filter:brightness(1.4)}}
.editor-painel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:15px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;max-height:450px}
.painel-secao{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px}.painel-secao h4{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;display:flex;align-items:center;gap:5px}
.corte-info{font-size:10px;display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.03)}.corte-info span{color:var(--accent);font-family:monospace}
.estilos-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}.estilo-btn{padding:6px;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:4px;cursor:pointer;font-size:9px;text-align:center;transition:.2s}.estilo-btn:hover{border-color:var(--accent)}.estilo-btn.ativo{background:var(--accent);color:#fff}
.cortes-lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin-top:15px}.corte-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;cursor:pointer;transition:.2s}.corte-card:hover{border-color:var(--accent)}.corte-card.ativo{border-color:var(--accent);box-shadow:0 0 15px rgba(108,92,231,.3)}.corte-card .thumb{height:140px;background:#000;position:relative}.corte-card .thumb iframe{width:100%;height:100%;border:none;pointer-events:none}.corte-card .info{padding:8px;font-size:10px}
.status-bar{display:flex;gap:10px;padding:8px 12px;background:var(--surface);border-radius:8px;margin-bottom:10px;font-size:10px;align-items:center;flex-wrap:wrap}
.toasts{position:fixed;bottom:10px;right:10px;z-index:2000}.toast{padding:8px 14px;border-radius:5px;font-size:11px;margin-top:4px;animation:slideIn .3s}.toast-success{background:var(--success);color:#000}@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
@media(max-width:900px){.editor-principal{grid-template-columns:1fr}.cortes-lista{grid-template-columns:1fr}}
</style></head><body>
<div class="loader" id="loader"><div class="loader-content"><div class="loader-icon"><i class="fas fa-film"></i></div><h2>Clipador <span>Studio</span></h2><p id="loaderMsg">Carregando Kinetic Typography...</p><div class="loader-bar"><div class="loader-fill"></div></div></div></div>
<div class="app" id="app" style="display:none">
<header class="header"><h1>🎬 Clipador <span>Studio</span> <span style="font-size:10px;color:var(--accent);">Kinetic Typography</span></h1><div class="header-actions"><button class="btn btn-youtube btn-xs" onclick="postarTodos('youtube')"><i class="fab fa-youtube"></i></button><button class="btn btn-tiktok btn-xs" onclick="postarTodos('tiktok')"><i class="fab fa-tiktok"></i></button><button class="btn btn-kwai btn-xs" onclick="postarTodos('kwai')"><i class="fas fa-play"></i></button></div></header>
<div class="main-content">
<div class="section"><h3><i class="fas fa-link"></i> Cole o link do YouTube</h3><div class="input-row"><input type="text" id="ytUrl" placeholder="https://youtube.com/watch?v=..."><select id="numClips"><option value="3">3 cortes</option><option value="5" selected>5 cortes</option><option value="10">10 cortes</option></select><button class="btn btn-primary btn-lg" onclick="processarVideo()"><i class="fas fa-cut"></i> CORTAR 1 MINUTO COM LEGENDAS</button></div></div>
<div class="status-bar" id="statusBar" style="display:none"><span>📹 <b id="stTotal">0</b> cortes</span><span>✂️ <b>1 minuto</b> cada</span><span>✅ <b id="stPostados">0</b> postados</span></div>
<div class="editor-principal" id="editorPrincipal"><div class="video-container" id="videoContainer"><div class="kinetic-layer" id="kineticLayer"></div></div>
<div class="editor-painel"><div class="painel-secao"><h4>✂️ Corte de 1 Minuto</h4><div class="corte-info"><span>Início:</span><strong id="trimInicio">0:00</strong></div><div class="corte-info"><span>Fim:</span><strong id="trimFim">1:00</strong></div><div class="corte-info"><span>Duração:</span><strong style="color:var(--success);">1:00</strong></div><input type="range" id="trimSlider" min="0" max="60" value="0" oninput="ajustarTrim(parseInt(this.value))" style="width:100%;margin-top:6px;"><div style="display:flex;gap:4px;margin-top:4px;"><button class="btn btn-xs" onclick="ajustarTrim(Z.trimOffset-5)">-5s</button><button class="btn btn-xs" onclick="ajustarTrim(Z.trimOffset+5)">+5s</button></div></div>
<div class="painel-secao"><h4>💬 Legenda (Kinetic Typography)</h4><div class="corte-info"><span style="color:#a855f7;">👤 Pessoa 1:</span><span id="legP1">-</span></div><div class="corte-info"><span style="color:#ff8787;">👤 Pessoa 2:</span><span id="legP2">-</span></div><div class="estilos-grid" style="margin-top:8px;"><button class="estilo-btn ativo" onclick="mudarEstilo('kinetic',this)">✨ Kinetic</button><button class="estilo-btn" onclick="mudarEstilo('zoom',this)">🔍 Zoom</button><button class="estilo-btn" onclick="mudarEstilo('slide',this)">➡️ Slide</button><button class="estilo-btn" onclick="mudarEstilo('bounce',this)">🔄 Bounce</button></div></div>
<div class="painel-secao"><h4>📤 Publicar</h4><button class="btn btn-youtube btn-sm" onclick="postarAtual('youtube')" style="width:100%;margin-bottom:4px;"><i class="fab fa-youtube"></i> YouTube</button><button class="btn btn-tiktok btn-sm" onclick="postarAtual('tiktok')" style="width:100%;margin-bottom:4px;"><i class="fab fa-tiktok"></i> TikTok</button><button class="btn btn-kwai btn-sm" onclick="postarAtual('kwai')" style="width:100%;margin-bottom:4px;"><i class="fas fa-play"></i> Kwai</button></div></div></div>
<div class="cortes-lista" id="cortesLista"></div></div></div>
<div class="toasts" id="toasts"></div>
<script>
const CANAIS={youtube:'https://studio.youtube.com/channel/UCG1stONrWIyr3PyygIB2qzw/videos/upload',tiktok:'https://www.tiktok.com/upload',kwai:'https://www.kwai.com/upload'};
const Z={vid:null,vidTitle:'',clips:[],postados:0,processing:!1,clipAtual:null,trimOffset:0,estilo:'kinetic',timerLegenda:null,frameCount:0};
function saveClips(){localStorage.setItem('clipador_kinetic',JSON.stringify({vid:Z.vid,vidTitle:Z.vidTitle,clips:Z.clips,postados:Z.postados}))}
function loadClips(){const d=localStorage.getItem('clipador_kinetic');if(d){const p=JSON.parse(d);Z.vid=p.vid;Z.vidTitle=p.vidTitle;Z.clips=p.clips;Z.postados=p.postados;return !0}return !1}
(function(){const l=document.getElementById('loader'),m=document.getElementById('loaderMsg'),ms=['🎬 Inicializando...','💬 Kinetic Typography...','✨ Preparando animações...','🚀 Pronto!'];let i=0;const iv=setInterval(()=>{if(i<ms.length){m.textContent=ms[i];i++}},500);setTimeout(()=>{clearInterval(iv);l.classList.add('hidden');setTimeout(()=>{if(l)l.remove();document.getElementById('app').style.display='block';if(loadClips()){renderCortes();updateStatus();document.getElementById('statusBar').style.display='flex'}},500)},2500)})();
async function processarVideo(){if(Z.processing)return;Z.processing=!0;const url=document.getElementById('ytUrl').value.trim();if(!url)return Z.processing=!1;const m=url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([^&\n?#]+)/);if(!m)return Z.processing=!1;const vid=m[1],num=parseInt(document.getElementById('numClips').value);document.getElementById('statusBar').style.display='flex';await sleep(500);try{const r=await fetch('https://www.youtube.com/oembed?url=https://youtube.com/watch?v='+vid+'&format=json');const d=await r.json();Z.vidTitle=d.title;Z.vid=vid;Z.clips=generateClips(num,vid);Z.postados=0;saveClips();renderCortes();updateStatus();abrirCorte(0);toast('✅ '+num+' cortes com Kinetic Typography!','success');Z.processing=!1}catch(e){Z.processing=!1}}
function generateClips(n,vid){const titles=['🔥 O MOMENTO MAIS VIRAL','😱 A REVELAÇÃO CHOCANTE','💡 A DICA QUE MUDOU TUDO','🤫 O SEGREDO REVELADO','🥹 A EMOÇÃO DO ANO'];const legendasP1=['ESSE MOMENTO É INCRÍVEL','OLHA SÓ O QUE ELE FALOU','PRESTA ATENÇÃO NESSA DICA','GUARDA ESSE VÍDEO','A EMOÇÃO DESSE MOMENTO'];const legendasP2=['NÃO DÁ PRA ACREDITAR','ISSO MUDOU TUDO','ELA VALE OURO','ESSE SEGREDO VAI MUDAR','É CONTAGIANTE DEMAIS'];const clips=[];for(let i=0;i<n;i++)clips.push({id:Date.now()+'-'+i,s:Math.floor(Math.random()*400)+15,title:titles[i%5],legendaP1:legendasP1[i%5],legendaP2:legendasP2[i%5],vir:(7+Math.random()*3).toFixed(1),postado:!1,platform:''});return clips}
function renderCortes(){const g=document.getElementById('cortesLista');if(!g||!Z.clips.length)return;g.innerHTML=Z.clips.map((c,i)=>'<div class="corte-card'+(Z.clipAtual===i?' ativo':'')+'" onclick="abrirCorte('+i+')"><div class="thumb"><iframe src="https://www.youtube.com/embed/'+Z.vid+'?start='+c.s+'&end='+(c.s+60)+'&autoplay=0&rel=0&modestbranding=1" allowfullscreen></iframe></div><div class="info"><strong>'+c.title+'</strong><br>🔥 '+c.vir+'/10 | ⏱ 1:00</div></div>').join('')}
function abrirCorte(i){Z.clipAtual=i;Z.trimOffset=0;const c=Z.clips[i];document.getElementById('editorPrincipal').style.display='grid';document.getElementById('videoContainer').innerHTML='<iframe src="https://www.youtube.com/embed/'+Z.vid+'?start='+(c.s+Z.trimOffset)+'&end='+(c.s+Z.trimOffset+60)+'&autoplay=1&rel=0&modestbranding=1" allow="autoplay" allowfullscreen></iframe><div class="kinetic-layer" id="kineticLayer"></div>';document.getElementById('trimInicio').textContent=fmt(Z.trimOffset);document.getElementById('trimFim').textContent=fmt(Z.trimOffset+60);document.getElementById('legP1').textContent=c.legendaP1;document.getElementById('legP2').textContent=c.legendaP2;document.getElementById('trimSlider').value=Z.trimOffset;iniciarKineticTypography();renderCortes();updateStatus();document.getElementById('editorPrincipal').scrollIntoView({behavior:'smooth'})}
function ajustarTrim(v){Z.trimOffset=Math.max(0,Math.min(v,300));document.getElementById('trimSlider').value=Z.trimOffset;const c=Z.clips[Z.clipAtual];if(!c)return;document.getElementById('videoContainer').innerHTML='<iframe src="https://www.youtube.com/embed/'+Z.vid+'?start='+(c.s+Z.trimOffset)+'&end='+(c.s+Z.trimOffset+60)+'&autoplay=1&rel=0&modestbranding=1" allow="autoplay" allowfullscreen></iframe><div class="kinetic-layer" id="kineticLayer"></div>';document.getElementById('trimInicio').textContent=fmt(Z.trimOffset);document.getElementById('trimFim').textContent=fmt(Z.trimOffset+60);iniciarKineticTypography()}
function mudarEstilo(estilo,btn){Z.estilo=estilo;document.querySelectorAll('.estilo-btn').forEach(b=>b.classList.remove('ativo'));btn.classList.add('ativo');iniciarKineticTypography();toast('💬 Estilo: '+estilo,'success')}
function iniciarKineticTypography(){if(Z.timerLegenda)clearInterval(Z.timerLegenda);Z.frameCount=0;animarKinetic()}
function animarKinetic(){const c=Z.clips[Z.clipAtual];if(!c||c.postado)return;const layer=document.getElementById('kineticLayer');if(!layer)return;const quemFala=Math.floor(Z.frameCount/8)%2;const frase=quemFala===0?c.legendaP1:c.legendaP2;const palavras=frase.split(' ');const palavraIdx=Z.frameCount%palavras.length;const isEmphasis=palavraIdx===0||palavraIdx===palavras.length-1||palavras[palavraIdx].length>5;layer.innerHTML='';const containerW=layer.offsetWidth||800;const containerH=layer.offsetHeight||450;let xAtual=containerW*0.05;const yBase=containerH*0.75;for(let i=0;i<=palavraIdx;i++){const span=document.createElement('span');span.className='kinetic-word '+(quemFala===0?'p1':'p2')+(isEmphasis&&i===palavraIdx?' emphasis':'');span.textContent=palavras[i];span.style.fontSize=(isEmphasis&&i===palavraIdx?'28px':'20px')+' ';span.style.position='absolute';span.style.left=xAtual+'px';const yOffset=Z.estilo==='bounce'?Math.sin((Z.frameCount+i)*0.5)*15:Z.estilo==='zoom'&&i===palavraIdx?20:0;span.style.top=(yBase+yOffset)+'px';span.style.animation='fadeInUp 0.3s ease forwards';span.style.transform=i===palavraIdx?'scale(1.15)':'scale(1)';span.style.transition='all 0.3s ease';span.style.zIndex=i===palavraIdx?10:1;layer.appendChild(span);xAtual+=span.offsetWidth+10;if(xAtual>containerW*0.9){xAtual=containerW*0.05;layer.innerHTML='';for(let j=Math.max(0,palavraIdx-3);j<=palavraIdx;j++){const s=document.createElement('span');s.className='kinetic-word '+(quemFala===0?'p1':'p2');s.textContent=palavras[j];s.style.fontSize='18px';s.style.position='absolute';s.style.left=(containerW*0.05+(j-Math.max(0,palavraIdx-3))*80)+'px';s.style.top=(containerH*0.82)+'px';layer.appendChild(s)}}}Z.frameCount++;Z.timerLegenda=setTimeout(()=>animarKinetic(),350)}
function postarAtual(platform){if(Z.clipAtual===null)return;const c=Z.clips[Z.clipAtual];c.postado=!0;c.platform=platform;Z.postados++;updateStatus();saveClips();window.open(CANAIS[platform],'_blank');toast('📤 Postado no '+platform+'!','success')}
function postarTodos(platform){Z.clips.filter(c=>!c.postado).forEach((c,i)=>{setTimeout(()=>{c.postado=!0;c.platform=platform;Z.postados++;updateStatus();saveClips();window.open(CANAIS[platform],'_blank')},i*1000)})}
function updateStatus(){document.getElementById('stTotal').textContent=Z.clips.length;document.getElementById('stPostados').textContent=Z.postados}
function fmt(s){const m=Math.floor(s/60),se=Math.floor(s%60);return m+':'+se.toString().padStart(2,'0')}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function toast(m,t='info'){const c=document.getElementById('toasts');const d=document.createElement('div');d.className='toast toast-'+t;d.textContent=m;c.appendChild(d);setTimeout(()=>d.remove(),2500)}
</script></body></html>
