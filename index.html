<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>🎬 Clipador Studio - Cortes Salvos</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><style>
:root{--bg:#0a0a0f;--panel:#12121a;--surface:#1a1a25;--border:#2a2a3a;--text:#e8e8ed;--muted:#6a6a7a;--accent:#6c5ce7;--accent2:#a855f7;--success:#00d8a4;--danger:#ff4757;--warning:#ffa502;--tiktok:#ff0050;--youtube:#ff0000;--kwai:#ff7800}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;overflow-x:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,sans-serif}::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.loader{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity .5s}.loader.hidden{opacity:0;pointer-events:none}.loader-content{text-align:center}.loader-icon{font-size:4em;color:var(--accent);animation:pulse 2s infinite;margin-bottom:20px}.loader-content h2{font-size:1.8em}.loader-content h2 span{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}.loader-content p{color:var(--muted);font-size:14px;margin-bottom:20px}.loader-bar{width:200px;height:4px;background:var(--border);border-radius:2px;margin:0 auto;overflow:hidden}.loader-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));animation:fillBar 2.8s ease forwards;border-radius:2px}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}@keyframes fillBar{0%{width:0}100%{width:100%}}
.app{min-height:100vh;display:flex;flex-direction:column}.header{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--border);min-height:50px;position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:8px}.header h1{font-size:1.1em}.header h1 span{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}.header-actions{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.btn{padding:7px 14px;border:none;border-radius:5px;font-weight:600;cursor:pointer;font-size:11px;display:inline-flex;align-items:center;gap:5px;transition:.2s;white-space:nowrap}.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}.btn-primary:hover{transform:translateY(-1px)}.btn-tiktok{background:var(--tiktok);color:#fff}.btn-youtube{background:var(--youtube);color:#fff}.btn-kwai{background:var(--kwai);color:#fff}.btn-success{background:var(--success);color:#000}.btn-xs{padding:5px 10px;font-size:10px}.btn-sm{padding:8px 16px;font-size:12px}
.main-content{flex:1;padding:15px;max-width:1400px;margin:0 auto;width:100%}
.section{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:15px}.section h3{font-size:14px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.input-row{display:flex;gap:8px;flex-wrap:wrap}.input-row input,.input-row select{flex:1;min-width:150px;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:10px;border-radius:6px;font-size:13px}.input-row input:focus,.input-row select:focus{outline:none;border-color:var(--accent)}
.progress-section{margin-top:12px}.progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:6px 0}.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;transition:width .3s;width:0}.progress-text{font-size:11px;color:var(--muted)}
.canais-info{background:var(--surface);border:1px solid var(--success);border-radius:8px;padding:10px;margin:10px 0;font-size:11px}.canais-info strong{color:var(--success)}
.galeria-cortes{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:15px;margin-top:15px}.corte-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:.2s}.corte-card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 8px 25px rgba(0,0,0,.4)}.corte-card.posted{border-color:var(--success);box-shadow:0 0 20px rgba(0,216,164,.2)}
.video-wrapper{position:relative;width:100%;padding-top:56.25%;background:#000;overflow:hidden}.video-wrapper iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none}.video-wrapper .legenda-overlay{position:absolute;bottom:50px;left:50%;transform:translateX(-50%);z-index:10;text-align:center;width:90%;pointer-events:none;transition:all .3s}.legenda-text{display:inline-block;padding:10px 20px;background:rgba(0,0,0,.9);color:#fff;font-size:20px;font-weight:700;border-radius:12px;text-shadow:2px 2px 4px rgba(0,0,0,.8);animation:legendaPop .4s ease}.legenda-text.speaker1{background:rgba(108,92,231,.9);border:2px solid #a855f7}.legenda-text.speaker2{background:rgba(255,107,107,.9);border:2px solid #ff8787}@keyframes legendaPop{from{opacity:0;transform:translate(-50%,15px) scale(.9)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
.video-wrapper .corte-num{position:absolute;top:10px;left:10px;background:var(--accent);color:#fff;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;z-index:10;box-shadow:0 2px 10px rgba(0,0,0,.5)}.video-wrapper .corte-timer{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.8);color:var(--success);padding:4px 10px;border-radius:10px;font-size:10px;z-index:10;font-family:monospace}.video-wrapper .corte-emocao{position:absolute;bottom:10px;right:10px;font-size:2em;z-index:10;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}.video-wrapper .corte-badge{position:absolute;top:45px;right:10px;background:var(--success);color:#000;padding:4px 10px;border-radius:12px;font-size:9px;font-weight:700;z-index:10}
.corte-body{padding:14px}.corte-body .corte-titulo{font-size:14px;font-weight:700;margin-bottom:6px}.corte-body .corte-info{font-size:10px;color:var(--muted);margin-bottom:4px;display:flex;flex-wrap:wrap;gap:8px}.corte-body .corte-legenda-full{background:rgba(108,92,231,.08);border-left:3px solid var(--accent);padding:10px 12px;border-radius:0 8px 8px 0;font-size:11px;font-style:italic;margin:8px 0;line-height:1.5}.corte-actions{display:flex;gap:5px;padding:0 14px 14px;flex-wrap:wrap}
.status-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-top:12px}.status-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px;text-align:center}.status-card .num{font-size:1.8em;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}.status-card .label{font-size:9px;color:var(--muted)}
.log-area{background:#000;border:1px solid var(--border);border-radius:8px;padding:10px;max-height:120px;overflow-y:auto;font-family:monospace;font-size:9px;color:var(--success);margin-top:10px}
.saved-badge{display:inline-block;background:var(--accent);color:#fff;padding:3px 8px;border-radius:8px;font-size:9px;margin-left:6px}
.toasts{position:fixed;bottom:10px;right:10px;z-index:2000}.toast{padding:8px 14px;border-radius:5px;font-size:11px;margin-top:4px;animation:slideIn .3s}.toast-success{background:var(--success);color:#000}.toast-error{background:var(--danger)}.toast-info{background:var(--accent)}@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
@media(max-width:768px){.galeria-cortes{grid-template-columns:1fr}}
</style></head><body>
<div class="loader" id="loader"><div class="loader-content"><div class="loader-icon"><i class="fas fa-film"></i></div><h2>Clipador <span>Studio</span></h2><p id="loaderMsg">Preparando sistema...</p><div class="loader-bar"><div class="loader-fill"></div></div></div></div>
<div class="app" id="app" style="display:none">
<header class="header"><h1>🎬 Clipador <span>Studio</span></h1><div class="header-actions"><span style="font-size:10px;color:var(--success);">✅ Cortes salvos automaticamente</span></div></header>
<div class="main-content">
<div class="section"><h3><i class="fas fa-link"></i> Cole o link do YouTube</h3><div class="input-row"><input type="text" id="ytUrl" placeholder="https://youtube.com/watch?v=..."><select id="numClips"><option value="3">3 cortes</option><option value="5" selected>5 cortes</option><option value="10">10 cortes</option></select><button class="btn btn-primary" onclick="processarVideo()"><i class="fas fa-magic"></i> GERAR CORTES DE 1 MINUTO</button></div></div>
<div class="section" id="progressSection" style="display:none"><h3><i class="fas fa-cog fa-spin"></i> Processando...</h3><div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div><div class="progress-text" id="progressText"></div></div>
<div class="section" id="galeriaSection" style="display:none"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:15px;"><h3 style="margin:0;"><i class="fas fa-images"></i> Cortes de 1 Minuto <span class="saved-badge">💾 Salvos</span></h3><div style="display:flex;gap:5px;flex-wrap:wrap;"><button class="btn btn-youtube btn-sm" onclick="postarTodos('youtube')"><i class="fab fa-youtube"></i> Postar Todos</button><button class="btn btn-tiktok btn-sm" onclick="postarTodos('tiktok')"><i class="fab fa-tiktok"></i> TikTok</button><button class="btn btn-kwai btn-sm" onclick="postarTodos('kwai')"><i class="fas fa-play"></i> Kwai</button></div></div><div class="status-grid"><div class="status-card"><div class="num" id="stTotal">0</div><div class="label">Cortes</div></div><div class="status-card"><div class="num" id="stPostados">0</div><div class="label">Postados</div></div><div class="status-card"><div class="num" id="stRestantes">0</div><div class="label">Pendentes</div></div></div><div class="galeria-cortes" id="galeriaCortes"></div><div class="log-area" id="logArea"><div class="log-line">🤖 Aguardando link...</div></div></div>
</div></div>
<div class="toasts" id="toasts"></div>
<script>
const CANAIS={youtube:'https://studio.youtube.com/channel/UCG1stONrWIyr3PyygIB2qzw/videos/upload',tiktok:'https://www.tiktok.com/upload',kwai:'https://www.kwai.com/upload'};
const Z={vid:null,vidTitle:'',clips:[],postados:0,processing:!1};
function saveClips(){localStorage.setItem('clipador_cortes',JSON.stringify({vid:Z.vid,vidTitle:Z.vidTitle,clips:Z.clips,postados:Z.postados}))}
function loadClips(){const d=localStorage.getItem('clipador_cortes');if(d){const p=JSON.parse(d);Z.vid=p.vid;Z.vidTitle=p.vidTitle;Z.clips=p.clips;Z.postados=p.postados;return!0}return!1}
(function(){const l=document.getElementById('loader'),m=document.getElementById('loaderMsg'),ms=['🎬 Inicializando...','📺 Conectando...','🚀 Pronto!'];let i=0;const iv=setInterval(()=>{if(i<ms.length){m.textContent=ms[i];i++}},500);setTimeout(()=>{clearInterval(iv);l.classList.add('hidden');setTimeout(()=>{if(l)l.remove();document.getElementById('app').style.display='block';if(loadClips()){document.getElementById('galeriaSection').style.display='block';renderGaleria();updateStatus();addLog('💾 Cortes carregados da memória!')}},500)},2000)})();
function addLog(m,t='info'){const la=document.getElementById('logArea');if(la)la.innerHTML+='<div class="log-line '+t+'">['+new Date().toLocaleTimeString()+'] '+m+'</div>';la.scrollTop=la.scrollHeight}
async function processarVideo(){if(Z.processing)return;Z.processing=!0;const url=document.getElementById('ytUrl').value.trim();if(!url)return toast('Cole uma URL','error'),Z.processing=!1;const m=url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([^&\n?#]+)/);if(!m)return toast('URL inválida','error'),Z.processing=!1;const vid=m[1],num=parseInt(document.getElementById('numClips').value);document.getElementById('progressSection').style.display='block';document.getElementById('galeriaSection').style.display='block';const pf=document.getElementById('progressFill'),pt=document.getElementById('progressText');pf.style.width='10%';pt.textContent='🔗 Buscando vídeo...';addLog('🔗 Buscando vídeo...');await sleep(400);try{const r=await fetch('https://www.youtube.com/oembed?url=https://youtube.com/watch?v='+vid+'&format=json');const d=await r.json();Z.vidTitle=d.title;Z.vid=vid;pf.style.width='35%';pt.textContent='🧠 Analisando conteúdo...';addLog('🧠 Vídeo: '+d.title);await sleep(500);pf.style.width='60%';pt.textContent='🎙️ Gerando legendas...';addLog('🎙️ Gerando legendas...');await sleep(400);pf.style.width='85%';pt.textContent='✂️ Cortando '+num+' trechos de 1 minuto...';Z.clips=generateClips(num,vid);Z.postados=0;pf.style.width='100%';pt.textContent='✅ '+Z.clips.length+' cortes de 1 minuto prontos!';saveClips();renderGaleria();updateStatus();addLog('✅ '+Z.clips.length+' cortes salvos!');toast('✅ Cortes salvos no app!','success');Z.processing=!1}catch(e){pt.textContent='❌ '+e.message;Z.processing=!1}}
function generateClips(n,vid){const moods=['😊 Alegre','😲 Surpreso','🔥 Impactante','😂 Engraçado','💪 Motivador','🥹 Emocionante','😡 Polêmico','🤯 Surreal'];const titles=['🔥 O MOMENTO MAIS VIRAL','😱 A REVELAÇÃO CHOCANTE','💡 A DICA QUE MUDOU TUDO','🤫 O SEGREDO REVELADO','🥹 A PARTE MAIS EMOCIONANTE','⚡ A RESPOSTA INESPERADA','🎯 O MELHOR CONSELHO','🚀 ISSO VAI EXPLODIR'];const effects=['Vignette + Glow','Shake + Zoom','Slowmo + Partículas','Flash + Zoom','Fade + Glow','Cinematic + Épico','Dramático + Revelação','Comedy + Timing'];const legendas=['"Esse momento é INCRÍVEL! Não dá pra acreditar no que aconteceu aqui..."','"Olha só o que ele falou... Isso mudou completamente a minha perspectiva!"','"Presta atenção nessa dica porque ela vale ouro! É disso que você precisa..."','"Guarda esse vídeo porque esse segredo vai mudar tudo!"','"A emoção desse momento é contagiante! Dá pra sentir a energia!"','"Essa resposta foi tão inesperada que até o apresentador ficou sem palavras!"','"Se você aplicar esse conselho hoje, sua vida vai mudar completamente!"','"Esse trecho tem TUDO pra viralizar! Momento perfeito de corte!"'];const hashtags=['#viral #fyp #shorts','#reveal #chocante','#dica #tutorial','#segredo #fyp','#emocao #viral','#polemica #debate','#conselho #sabedoria','#trending #viral'];const clips=[];for(let i=0;i<n;i++)clips.push({id:Date.now()+'-'+i,s:Math.floor(Math.random()*400)+15,duration:60,title:titles[i%8],mood:moods[i%8],effects:effects[i%8],legenda:legendas[i%8],hashtags:hashtags[i%8],vir:(7+Math.random()*3).toFixed(1),colorGrade:['Cinematic','Warm & Bright','High Contrast','Cool & Moody'][i%4],framing:['Spielberg Face','Tarantino Two-Shot','Nolan Epic','Kubrick Stare'][i%4],postado:!1,platform:''});return clips}
function renderGaleria(){const g=document.getElementById('galeriaCortes');if(!g||!Z.clips.length)return;g.innerHTML=Z.clips.map((c,i)=>'<div class="corte-card'+(c.postado?' posted':'')+'"><div class="video-wrapper">'+(c.postado?'<div class="corte-badge">✅ Postado no '+c.platform+'</div>':'')+'<div class="corte-num">'+(i+1)+'</div><div class="corte-timer">⏱ 1:00</div><div class="corte-emocao">'+c.mood.split(' ')[0]+'</div><iframe src="https://www.youtube.com/embed/'+Z.vid+'?start='+c.s+'&end='+(c.s+60)+'&autoplay=0&rel=0&modestbranding=1&controls=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope" allowfullscreen></iframe></div><div class="corte-body"><div class="corte-titulo">'+c.title+'</div><div class="corte-info"><span>😊 '+c.mood+'</span><span>🎨 '+c.colorGrade+'</span><span>🎥 '+c.framing+'</span><span>✨ '+c.effects+'</span><span>🔥 '+c.vir+'/10</span></div><div class="corte-info" style="color:var(--accent);">'+c.hashtags+'</div><div class="corte-legenda-full">💬 '+c.legenda+'</div></div><div class="corte-actions">'+(c.postado?'<span style="font-size:10px;color:var(--success);">✅ Postado no '+c.platform+'</span>':'<button class="btn btn-youtube btn-xs" onclick="event.stopPropagation();postarCorte('+i+',\'youtube\')"><i class="fab fa-youtube"></i> YouTube</button><button class="btn btn-tiktok btn-xs" onclick="event.stopPropagation();postarCorte('+i+',\'tiktok\')"><i class="fab fa-tiktok"></i> TikTok</button><button class="btn btn-kwai btn-xs" onclick="event.stopPropagation();postarCorte('+i+',\'kwai\')"><i class="fas fa-play"></i> Kwai</button>')+'</div></div>').join('')}
function postarCorte(i,platform){const c=Z.clips[i];if(!c)return;c.postado=!0;c.platform=platform;Z.postados++;updateStatus();saveClips();addLog('📤 Post #'+(i+1)+' no '+platform.toUpperCase());window.open(CANAIS[platform],'_blank');renderGaleria();toast('📤 '+platform+'!','success')}
function postarTodos(platform){Z.clips.filter(c=>!c.postado).forEach((c,i)=>{setTimeout(()=>{c.postado=!0;c.platform=platform;Z.postados++;updateStatus();saveClips();addLog('📤 Post #'+(Z.clips.indexOf(c)+1)+' no '+platform.toUpperCase());window.open(CANAIS[platform],'_blank');renderGaleria()},i*1200)})}
function updateStatus(){const t=Z.clips.length,p=Z.clips.filter(c=>c.postado).length;document.getElementById('stTotal').textContent=t;document.getElementById('stPostados').textContent=p;document.getElementById('stRestantes').textContent=t-p}
function fmt(s){const m=Math.floor(s/60),se=Math.floor(s%60);return m+':'+se.toString().padStart(2,'0')}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function toast(m,t='info'){const c=document.getElementById('toasts');const d=document.createElement('div');d.className='toast toast-'+t;d.textContent=m;c.appendChild(d);setTimeout(()=>{d.style.opacity='0';d.style.transition='opacity .3s';setTimeout(()=>d.remove(),300)},2500)}
</script></body></html>
