<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clipador — Cortador de Shorts com IA</title>
<style>
:root {
  --bg: #0a0a0f;
  --surface: #13131a;
  --border: #252530;
  --text: #e8e8ed;
  --muted: #7a7a85;
  --accent: #6c5ce7;
  --accent2: #a855f7;
  --success: #00d8a4;
  --danger: #ff4757;
  --warning: #ffa502;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  min-height: 100vh;
  line-height: 1.6;
}

.container { max-width: 900px; margin: 0 auto; padding: 20px; }

.header {
  text-align: center; padding: 40px 0;
  border-bottom: 1px solid var(--border); margin-bottom: 30px;
}

.header h1 {
  font-size: 2.5em;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.header p { color: var(--muted); margin-top: 10px; }

.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 24px; margin-bottom: 20px;
}

.input-group { display: flex; gap: 12px; }

input, select {
  background: var(--bg); border: 1px solid var(--border);
  color: var(--text); padding: 12px 16px; border-radius: 8px;
  font-size: 14px; width: 100%;
}

input:focus, select:focus {
  outline: none; border-color: var(--accent);
}

.btn {
  padding: 12px 24px; border: none; border-radius: 8px;
  font-weight: 600; cursor: pointer; font-size: 14px;
  transition: all 0.3s; white-space: nowrap;
}

.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: white;
}

.btn-primary:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 4px 15px rgba(108, 92, 231, 0.3);
}

.btn-secondary {
  background: transparent; border: 1px solid var(--border); color: var(--text);
}

.btn-test {
  background: var(--success); color: #000; font-size: 12px; padding: 8px 16px;
}

.video-item {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 20px; margin-bottom: 16px;
  animation: slideIn 0.3s ease;
}

@keyframes slideIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.badge {
  padding: 4px 12px; border-radius: 20px;
  font-size: 11px; font-weight: 600; text-transform: uppercase;
}

.badge-processing { background: #2a2a35; color: var(--warning); }
.badge-completed { background: #1a2a25; color: var(--success); }
.badge-error { background: #2a1a1a; color: var(--danger); }

.progress-bar {
  height: 6px; background: var(--border); border-radius: 3px;
  overflow: hidden; margin: 15px 0;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  transition: width 0.5s ease;
}

.clips-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 12px; margin-top: 15px;
}

.clip-card {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 12px;
}

.clip-card:hover { border-color: var(--accent); transform: translateY(-2px); }

.clip-thumbnail {
  width: 100%; height: 140px; background: var(--surface);
  border-radius: 6px; margin-bottom: 10px; display: flex;
  align-items: center; justify-content: center;
  font-size: 3em; cursor: pointer; position: relative;
}

.clip-time {
  font-family: 'Courier New', monospace; font-size: 11px;
  color: var(--accent); margin-bottom: 6px;
}

.clip-title {
  font-size: 13px; font-weight: 500; margin-bottom: 10px;
}

.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.8); backdrop-filter: blur(4px);
  z-index: 1000; align-items: center; justify-content: center;
}

.modal-overlay.open { display: flex; }

.modal {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 30px; max-width: 500px; width: 90%;
}

.toast {
  position: fixed; bottom: 20px; right: 20px;
  padding: 16px 24px; border-radius: 8px; color: white;
  font-weight: 500; z-index: 2000; animation: slideUp 0.3s ease;
}

.toast-success { background: var(--success); color: #000; }
.toast-error { background: var(--danger); }

@keyframes slideUp {
  from { transform: translateY(100px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.spinner {
  width: 20px; height: 20px; border: 2px solid var(--border);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin 0.8s linear infinite; display: inline-block;
}

@keyframes spin { to { transform: rotate(360deg); } }

.empty-state {
  text-align: center; padding: 60px 20px; color: var(--muted);
}

.api-indicator {
  display: inline-block; width: 8px; height: 8px;
  border-radius: 50%; margin-right: 6px;
}

.api-indicator.online { background: var(--success); box-shadow: 0 0 6px var(--success); }
.api-indicator.offline { background: var(--danger); }

label {
  display: block; margin-bottom: 6px;
  color: var(--muted); font-size: 13px; font-weight: 500;
}

.form-group { margin-bottom: 16px; }

@media (max-width: 600px) {
  .header h1 { font-size: 1.8em; }
  .input-group { flex-direction: column; }
  .clips-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🎬 Clipador PRO</h1>
    <p>Transforme vídeos do YouTube em shorts viralizáveis com IA</p>
  </div>

  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
      <strong>🔗 Novo Vídeo</strong>
      <span style="font-size: 12px; color: var(--muted);">
        <span class="api-indicator" id="apiDot"></span>
        <span id="apiLabel">API não configurada</span>
      </span>
    </div>
    
    <div class="input-group">
      <input type="text" id="youtubeUrl" placeholder="Cole a URL do YouTube..." />
      <button class="btn btn-primary" id="processBtn">
        ⚡ Processar
      </button>
    </div>
    
    <div style="margin-top: 10px; font-size: 12px;">
      <a href="#" onclick="openSettings()" style="color: var(--accent);">
        ⚙️ Configurar API (Gemini gratuito)
      </a>
    </div>
  </div>

  <div id="videoList">
    <div class="empty-state">
      <p style="font-size: 48px;">📹</p>
      <p>Nenhum vídeo processado ainda</p>
    </div>
  </div>
</div>

<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h2>⚙️ Configurações</h2>
    
    <div style="background: #1a2a25; border: 1px solid var(--success); border-radius: 8px; padding: 12px; margin: 15px 0;">
      <strong>🌟 Recomendado: Google Gemini (GRÁTIS)</strong><br>
      <a href="https://aistudio.google.com/apikey" target="_blank" style="color: var(--accent); font-size: 13px;">
        → Clique aqui para pegar sua chave gratuita
      </a>
    </div>
    
    <div class="form-group">
      <label>Sua chave API do Gemini</label>
      <input type="password" id="geminiKey" placeholder="AIza..." />
    </div>
    
    <button class="btn btn-test" onclick="testGeminiKey()" style="width: 100%; margin-bottom: 15px;">
      🧪 Testar chave
    </button>
    
    <div id="testResult" style="font-size: 13px; margin-bottom: 15px;"></div>
    
    <div style="display: flex; gap: 10px; justify-content: flex-end;">
      <button class="btn btn-secondary" onclick="closeSettings()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveSettings()">💾 Salvar</button>
    </div>
  </div>
</div>

<script>
// ============ SIMPLIFIED STATE ============
let videos = JSON.parse(localStorage.getItem('clipador_videos') || '[]');
let geminiKey = localStorage.getItem('clipador_gemini_key') || '';

// DOM
const youtubeInput = document.getElementById('youtubeUrl');
const processBtn = document.getElementById('processBtn');
const videoList = document.getElementById('videoList');
const settingsModal = document.getElementById('settingsModal');

// ============ INIT ============
function init() {
  updateApiIndicator();
  if (!geminiKey) setTimeout(openSettings, 500);
  renderVideos();
}

function updateApiIndicator() {
  const dot = document.getElementById('apiDot');
  const label = document.getElementById('apiLabel');
  if (geminiKey) {
    dot.className = 'api-indicator online';
    label.textContent = 'Gemini conectado';
  } else {
    dot.className = 'api-indicator offline';
    label.textContent = 'API não configurada';
  }
}

// ============ SETTINGS ============
function openSettings() {
  document.getElementById('geminiKey').value = geminiKey;
  document.getElementById('testResult').innerHTML = '';
  settingsModal.classList.add('open');
}

function closeSettings() {
  settingsModal.classList.remove('open');
}

function saveSettings() {
  geminiKey = document.getElementById('geminiKey').value.trim();
  localStorage.setItem('clipador_gemini_key', geminiKey);
  updateApiIndicator();
  closeSettings();
  showToast('✅ Chave salva!', 'success');
}

async function testGeminiKey() {
  const key = document.getElementById('geminiKey').value.trim();
  if (!key) return showToast('Digite uma chave primeiro', 'error');
  
  const resultDiv = document.getElementById('testResult');
  resultDiv.innerHTML = '<span style="color: var(--warning);">🔄 Testando...</span>';
  
  try {
    const response = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: 'Responda apenas: OK' }] }]
        })
      }
    );
    
    const data = await response.json();
    
    if (data.candidates) {
      resultDiv.innerHTML = '<span style="color: var(--success);">✅ Chave funcionando! Pode fechar e usar o app.</span>';
      geminiKey = key;
      localStorage.setItem('clipador_gemini_key', geminiKey);
      updateApiIndicator();
    } else {
      resultDiv.innerHTML = `<span style="color: var(--danger);">❌ Erro: ${data.error?.message || 'Chave inválida'}</span>`;
    }
  } catch (error) {
    resultDiv.innerHTML = `<span style="color: var(--danger);">❌ Erro: ${error.message}</span>`;
  }
}

// ============ PROCESS ============
processBtn.addEventListener('click', async () => {
  const url = youtubeInput.value.trim();
  if (!url) return showToast('Cole uma URL do YouTube', 'error');
  if (!geminiKey) {
    showToast('Configure sua chave Gemini primeiro', 'error');
    return openSettings();
  }
  
  const videoId = extractVideoId(url);
  if (!videoId) return showToast('URL inválida', 'error');
  
  const video = {
    id: Date.now().toString(),
    url,
    videoId,
    title: 'Analisando...',
    status: 'processing',
    progress: 0,
    etapa: 'Iniciando...',
    clips: [],
    createdAt: new Date().toISOString()
  };
  
  videos.unshift(video);
  save();
  renderVideos();
  youtubeInput.value = '';
  
  await processVideo(video);
});

function extractVideoId(url) {
  const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([^&\n?#]+)/);
  return match ? match[1] : null;
}

async function processVideo(video) {
  try {
    // Etapa 1: Metadata
    updateProgress(video.id, 20, 'Obtendo informações...');
    const metadata = await getVideoMetadata(video.videoId);
    video.title = metadata.title;
    save();
    renderVideos();
    
    // Etapa 2: Análise com Gemini
    updateProgress(video.id, 50, 'Analisando com Gemini...');
    const clips = await analyzeVideo(video.videoId, video.title);
    
    // Etapa 3: Finalizar
    updateProgress(video.id, 90, 'Finalizando...');
    
    video.clips = clips.map((clip, i) => ({
      id: `${video.id}-${i}`,
      inicio: clip.inicio,
      fim: clip.fim,
      titulo: clip.titulo_gancho,
      virality: clip.virality || 7.5,
      youtubeUrl: `https://youtube.com/watch?v=${video.videoId}&t=${Math.floor(clip.inicio)}`
    }));
    
    video.status = 'completed';
    video.progress = 100;
    video.etapa = 'Concluído!';
    save();
    renderVideos();
    showToast(`✅ ${video.clips.length} shorts encontrados!`, 'success');
    
  } catch (error) {
    console.error('Erro:', error);
    video.status = 'error';
    video.etapa = error.message;
    save();
    renderVideos();
    showToast('❌ ' + error.message, 'error');
  }
}

function updateProgress(videoId, progress, etapa) {
  const video = videos.find(v => v.id === videoId);
  if (video) {
    video.progress = progress;
    video.etapa = etapa;
    save();
    renderVideos();
  }
}

// ============ API ============
async function getVideoMetadata(videoId) {
  const resp = await fetch(`https://www.youtube.com/oembed?url=https://youtube.com/watch?v=${videoId}&format=json`);
  if (!resp.ok) throw new Error('Vídeo não encontrado');
  const data = await resp.json();
  return { title: data.title };
}

async function analyzeVideo(videoId, title) {
  const prompt = `Você é um editor profissional de YouTube Shorts.

Analise este vídeo: "${title}"
Link: https://youtube.com/watch?v=${videoId}

Sugira de 3 a 5 momentos ideais para criar shorts virais de 30-60 segundos.

Responda APENAS com JSON:
[
  {
    "inicio": 120.5,
    "fim": 175.0,
    "titulo_gancho": "Título curto e viral para o short",
    "virality": 8.5
  }
]

Baseie os timestamps em uma entrevista/podcast típica desse formato.`;

  // Usar APENAS o modelo atual
  const response = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiKey}`,
    {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }] }],
        generationConfig: {
          temperature: 0.7,
          maxOutputTokens: 2000
        }
      })
    }
  );

  if (!response.ok) {
    const error = await response.json();
    throw new Error(error.error?.message || 'Erro na API Gemini');
  }

  const data = await response.json();
  
  if (!data.candidates?.[0]?.content?.parts?.[0]?.text) {
    throw new Error('Resposta inválida da API');
  }
  
  const text = data.candidates[0].content.parts[0].text;
  console.log('Resposta do Gemini:', text);
  
  // Extrair JSON
  const jsonMatch = text.match(/\[[\s\S]*\]/);
  if (!jsonMatch) throw new Error('A IA não retornou JSON válido');
  
  return JSON.parse(jsonMatch[0]);
}

// ============ RENDER ============
function renderVideos() {
  if (videos.length === 0) {
    videoList.innerHTML = `
      <div class="empty-state">
        <p style="font-size: 48px;">📹</p>
        <p>Nenhum vídeo processado ainda</p>
        <p style="font-size: 13px;">Cole um link do YouTube acima</p>
      </div>`;
    return;
  }

  videoList.innerHTML = videos.map(v => `
    <div class="video-item">
      <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 15px;">
        <div>
          <strong>${esc(v.title)}</strong>
          <div style="font-size: 12px; color: var(--muted);">${v.url}</div>
          <div style="font-size: 11px; color: var(--muted);">${new Date(v.createdAt).toLocaleString('pt-BR')}</div>
        </div>
        <span class="badge badge-${v.status}">
          ${v.status === 'processing' ? '<span class="spinner"></span>' : ''}
          ${v.status === 'processing' ? 'Processando' : ''}
          ${v.status === 'completed' ? '✅ Pronto' : ''}
          ${v.status === 'error' ? '❌ Erro' : ''}
        </span>
      </div>
      
      ${v.status === 'processing' ? `
        <div style="margin-bottom: 8px; font-size: 13px; color: var(--muted);">${v.etapa}</div>
        <div class="progress-bar">
          <div class="progress-fill" style="width: ${v.progress}%"></div>
        </div>
      ` : ''}
      
      ${v.clips.length > 0 ? `
        <div class="clips-grid">
          ${v.clips.map(c => `
            <div class="clip-card">
              <div class="clip-thumbnail" onclick="window.open('${c.youtubeUrl}', '_blank')">▶</div>
              <div class="clip-time">⏱ ${fmt(c.inicio)} - ${fmt(c.fim)}</div>
              <div class="clip-title">${esc(c.titulo)}</div>
              <div style="display: flex; gap: 6px;">
                <button class="btn btn-primary" style="flex:1; padding:8px; font-size:12px;" onclick="window.open('${c.youtubeUrl}', '_blank')">▶ Assistir</button>
                <button class="btn btn-secondary" style="padding:8px; font-size:12px;" onclick="copyLink('${c.youtubeUrl}')">📋</button>
              </div>
              <div style="font-size: 11px; color: var(--accent); margin-top: 6px;">🔥 Viral: ${c.virality}/10</div>
            </div>
          `).join('')}
        </div>
      ` : ''}
      
      ${v.status === 'error' ? `
        <div style="color: var(--danger); padding: 12px; background: rgba(255,71,87,0.1); border-radius: 8px; margin-top: 10px;">
          ❌ ${v.etapa}
        </div>
      ` : ''}
      
      <button class="btn btn-secondary" style="margin-top: 10px; font-size: 12px;" onclick="deleteVideo('${v.id}')">🗑 Excluir</button>
    </div>
  `).join('');
}

// ============ UTILS ============
function fmt(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return `${m}:${sec.toString().padStart(2, '0')}`;
}

function esc(t) {
  const d = document.createElement('div');
  d.textContent = t;
  return d.innerHTML;
}

function save() {
  localStorage.setItem('clipador_videos', JSON.stringify(videos));
}

function deleteVideo(id) {
  if (confirm('Excluir?')) {
    videos = videos.filter(v => v.id !== id);
    save();
    renderVideos();
  }
}

function copyLink(url) {
  navigator.clipboard.writeText(url).then(() => showToast('📋 Link copiado!', 'success'));
}

function showToast(msg, type) {
  const t = document.createElement('div');
  t.className = `toast toast-${type}`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

// Start
init();
</script>

</body>
</html>
