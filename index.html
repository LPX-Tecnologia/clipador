<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>🎬 Clipador Studio - CapCut Integrado</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><style>
:root{--bg:#0a0a0f;--panel:#12121a;--surface:#1a1a25;--border:#2a2a3a;--text:#e8e8ed;--muted:#6a6a7a;--accent:#6c5ce7;--accent2:#a855f7;--success:#00d8a4;--danger:#ff4757;--warning:#ffa502;--tiktok:#ff0050;--youtube:#ff0000;--kwai:#ff7800}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;overflow-x:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,sans-serif}::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.loader{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity .5s}.loader.hidden{opacity:0;pointer-events:none}.loader-content{text-align:center}.loader-icon{font-size:4em;color:var(--accent);animation:pulse 2s infinite;margin-bottom:20px}.loader-content h2{font-size:1.8em}.loader-content h2 span{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}.loader-content p{color:var(--muted);font-size:14px;margin-bottom:20px}.loader-bar{width:200px;height:4px;background:var(--border);border-radius:2px;margin:0 auto;overflow:hidden}.loader-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));animation:fillBar 2.8s ease forwards;border-radius:2px}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}@keyframes fillBar{0%{width:0}100%{width:100%}}
.app{min-height:100vh;display:flex;flex-direction:column}.header{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--border);min-height:50px;position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:8px}.header h1{font-size:1.1em}.header h1 span{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.btn{padding:7px 14px;border:none;border-radius:5px;font-weight:600;cursor:pointer;font-size:11px;display:inline-flex;align-items:center;gap:5px;transition:.2s;white-space:nowrap}.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}.btn-tiktok{background:var(--tiktok);color:#fff}.btn-youtube{background:var(--youtube);color:#fff}.btn-kwai{background:var(--kwai);color:#fff}.btn-success{background:var(--success);color:#000}.btn-warning{background:var(--warning);color:#000}.btn-danger{background:var(--danger);color:#fff}.btn-xs{padding:4px 8px;font-size:9px}.btn-sm{padding:8px 16px;font-size:12px}.btn-lg{padding:14px 28px;font-size:15px}
.main-content{flex:1;padding:15px;max-width:1500px;margin:0 auto;width:100%}
.section{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:15px}.section h3{font-size:14px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.input-row{display:flex;gap:8px;flex-wrap:wrap}.input-row input,.input-row select{flex:1;min-width:150px;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:10px;border-radius:6px;font-size:13px}.input-row input:focus,.input-row select:focus{outline:none;border-color:var(--accent)}
.editor-container{display:none;background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-top:15px}
.editor-toolbar{display:flex;gap:4px;padding:10px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:center}
.editor-toolbar .tool-group{display:flex;gap:3px;padding:0 8px;border-right:1px solid var(--border)}.editor-toolbar .tool-group:last-child{border:none}
.editor-preview-area{display:grid;grid-template-columns:1fr 300px;min-height:400px}
.editor-canvas-area{background:#000;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;min-height:400px}
.editor-canvas-area canvas{width:100%;height:100%;position:absolute;top:0;left:0}
.editor-canvas-area .legenda-layer{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);z-index:10;text-align:center;width:90%;pointer-events:none;display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.legenda-palavra{display:inline-block;padding:6px 14px;border-radius:8px;font-size:20px;font-weight:800;text-shadow:2px 2px 4px rgba(0,0,0,.9);animation:palavraPop .3s ease}.legenda-palavra.p1{background:rgba(108,92,231,.95);color:#fff;border:2px solid #a855f7}.legenda-palavra.p2{background:rgba(255,107,107,.95);color:#fff;border:2px solid #ff8787}.legenda-palavra.destaque{transform:scale(1.2);box-shadow:0 0 25px rgba(255,255,255,.5)}@keyframes palavraPop{from{opacity:0;transform:scale(.3) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
.editor-panel-right{background:var(--surface);border-left:1px solid var(--border);padding:10px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.panel-section{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px}.panel-section h4{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.effect-btn{width:100%;padding:6px 10px;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:4px;cursor:pointer;font-size:10px;margin-bottom:4px;text-align:left;transition:.2s}.effect-btn:hover{border-color:var(--accent);background:rgba(108,92,231,.1)}.effect-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.speed-control{display:flex;align-items:center;gap:8px}.speed-control input{flex:1}
.timeline-container{background:var(--surface);border-top:1px solid var(--border);padding:10px;overflow-x:auto}.timeline-ruler{height:20px;position:relative;margin-bottom:4px}.timeline-ruler span{position:absolute;font-size:8px;color:var(--muted);top:0}.timeline-track{height:50px;background:var(--bg);border-radius:4px;position:relative;overflow:visible}.timeline-clip{position:absolute;height:100%;background:linear-gradient(135deg,rgba(108,92,231,.4),rgba(168,85,247,.4));border:2px solid var(--accent);border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff;min-width:40px}.timeline-clip:hover{background:rgba(108,92,231,.6)}.timeline-clip.active{border-color:#fff;box-shadow:0 0 15px rgba(108,92,231,.5)}.timeline-playhead{position:absolute;top:-5px;width:2px;height:60px;background:#ff0;z-index:5;pointer-events:none}
.cortes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:12px;margin-top:15px}.corte-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;transition:.2s}.corte-card:hover{border-color:var(--accent)}.corte-card .thumb{position:relative;background:#000;height:200px;overflow:hidden}.corte-card .thumb iframe{width:100%;height:100%;border:none}.corte-card .thumb .legenda-overlay{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);z-index:10;text-align:center;width:90%;pointer-events:none;display:flex;flex-wrap:wrap;justify-content:center;gap:5px}.corte-card .info{padding:10px}.corte-card .info h4{font-size:12px;margin-bottom:4px}.corte-card .info p{font-size:10px;color:var(--muted)}.corte-card .actions{display:flex;gap:3px;padding:0 10px 10px}
.status-bar{display:flex;gap:10px;padding:8px 12px;background:var(--surface);border-radius:8px;margin-bottom:10px;font-size:10px;align-items:center;flex-wrap:wrap}
.toasts{position:fixed;bottom:10px;right:10px;z-index:2000}.toast{padding:8px 14px;border-radius:5px;font-size:11px;margin-top:4px;animation:slideIn .3s}.toast-success{background:var(--success);color:#000}@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
@media(max-width:900px){.editor-preview-area{grid-template-columns:1fr}.cortes-grid{grid-template-columns:1fr}}
</style></head><body>
<div class="loader" id="loader"><div class="loader-content"><div class="loader-icon"><i class="fas fa-film"></i></div><h2>Clipador <span>Studio</span></h2><p id="loaderMsg">Carregando editor estilo CapCut...</p><div class="loader-bar"><div class="loader-fill"></div></div></div></div>
<div class="app" id="app" style="display:none">
<header class="header"><h1>🎬 Clipador <span>Studio</span> <span style="font-size:10px;color:var(--muted);">Editor Estilo CapCut</span></h1><div class="header-actions"><button class="btn btn-youtube btn-xs" onclick="postarTodos('youtube')"><i class="fab fa-youtube"></i></button><button class="btn btn-tiktok btn-xs" onclick="postarTodos('tiktok')"><i class="fab fa-tiktok"></i></button><button class="btn btn-kwai btn-xs" onclick="postarTodos('kwai')"><i class="fas fa-play"></i></button></div></header>
<div class="main-content">
<div class="section"><h3><i class="fas fa-link"></i> Cole o link do YouTube</h3><div class="input-row"><input type="text" id="ytUrl" placeholder="https://youtube.com/watch?v=..."><select id="numClips"><option value="3">3 cortes</option><option value="5" selected>5 cortes</option></select><button class="btn btn-primary btn-lg" onclick="processarVideo()"><i class="fas fa-magic"></i> GERAR CORTES</button><button class="btn btn-warning btn-lg" onclick="abrirEditor()" id="btnEditor" style="display:none;"><i class="fas fa-edit"></i> ABRIR EDITOR CAPCUT</button></div></div>
<div class="status-bar" id="statusBar" style="display:none"><span>📹 <b id="stTotal">0</b> cortes</span><span>✅ <b id="stPostados">0</b> postados</span><span>🎨 Efeito: <b id="stEfeito">Cinematic</b></span><span>⚡ Velocidade: <b id="stVelocidade">1x</b></span></div>
<div class="cortes-grid" id="cortesGrid"></div>
<div class="editor-container" id="editorContainer">
<div class="editor-toolbar"><div class="tool-group"><button class="btn btn-xs" onclick="desfazer()"><i class="fas fa-undo"></i></button><button class="btn btn-xs" onclick="refazer()"><i class="fas fa-redo"></i></button></div><div class="tool-group"><button class="btn btn-xs" onclick="cortarInicio()"><i class="fas fa-cut"></i> Início</button><button class="btn btn-xs" onclick="cortarFim()"><i class="fas fa-cut"></i> Fim</button></div><div class="tool-group"><button class="btn btn-xs" onclick="dividirClip()"><i class="fas fa-scissors"></i> Dividir</button></div><div class="tool-group"><span style="font-size:9px;color:var(--muted);">Vel:</span><input type="range" min="0.5" max="2" step="0.1" value="1" oninput="mudarVelocidade(this.value)" style="width:60px;"></div><div class="tool-group"><button class="btn btn-success btn-xs" onclick="exportarVideo()"><i class="fas fa-download"></i> Exportar</button></div></div>
<div class="editor-preview-area"><div class="editor-canvas-area" id="editorCanvas"><canvas id="previewCanvas"></canvas><div class="legenda-layer" id="legendaLayer"></div></div><div class="editor-panel-right"><div class="panel-section"><h4>🎨 Efeitos</h4><button class="effect-btn active" onclick="aplicarEfeito('cinematic',this)">Cinematic</button><button class="effect-btn" onclick="aplicarEfeito('vintage',this)">Vintage</button><button class="effect-btn" onclick="aplicarEfeito('dramatic',this)">Dramatic</button><button class="effect-btn" onclick="aplicarEfeito('warm',this)">Warm</button><button class="effect-btn" onclick="aplicarEfeito('cool',this)">Cool</button></div><div class="panel-section"><h4>💬 Legendas</h4><button class="effect-btn" onclick="estiloLegenda('tiktok')">Estilo TikTok</button><button class="effect-btn" onclick="estiloLegenda('cinema')">Estilo Cinema</button><button class="effect-btn" onclick="estiloLegenda('bold')">Negrito</button><button class="effect-btn" onclick="alternarCorLegenda()">Alternar Cor</button></div><div class="panel-section"><h4>🎵 Áudio</h4><button class="effect-btn" onclick="adicionarMusica()">+ Adicionar Música</button><button class="effect-btn" onclick="removerAudio()">Remover Áudio</button></div></div></div>
<div class="timeline-container"><div class="timeline-ruler" id="timelineRuler"></div><div class="timeline-track" id="timelineTrack"><div class="timeline-playhead" id="playhead"></div></div></div>
</div>
</div></div>
<div class="toasts" id="toasts"></div>
<script>
const CANAIS={youtube:'https://studio.youtube.com/channel/UCG1stONrWIyr3PyygIB2qzw/videos/upload',tiktok:'https://www.tiktok.com/upload',kwai:'https://www.kwai.com/upload'};
const Z={vid:null,vidTitle:'',clips:[],postados:0,processing:!1,editorAberto:!1,clipEditando:null,efeitoAtual:'cinematic',velocidade:1,timers:{}};
function saveClips(){localStorage.setItem('clipador_capcut',JSON.stringify({vid:Z.vid,vidTitle:Z.vidTitle,clips:Z.clips,postados:Z.postados}))}
function loadClips(){const d=localStorage.getItem('clipador_capcut');if(d){const p=JSON.parse(d);Z.vid=p.vid;Z.vidTitle=p.vidTitle;Z.clips=p.clips;Z.postados=p.postados;return !0}return !1}
(function(){const l=document.getElementById('loader'),m=document.getElementById('loaderMsg'),ms=['🎬 Carregando editor...','✂️ Ferramentas de corte...','💬 Legendas animadas...','🎨 Efeitos...','🚀 Pronto!'];let i=0;const iv=setInterval(()=>{if(i<ms.length){m.textContent=ms[i];i++}},450);setTimeout(()=>{clearInterval(iv);l.classList.add('hidden');setTimeout(()=>{if(l)l.remove();document.getElementById('app').style.display='block';if(loadClips()){renderCortes();updateStatus();document.getElementById('statusBar').style.display='flex';document.getElementById('btnEditor').style.display='inline-flex'}},500)},2500)})();
async function processarVideo(){if(Z.processing)return;Z.processing=!0;const url=document.getElementById('ytUrl').value.trim();if(!url)return Z.processing=!1;const m=url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([^&\n?#]+)/);if(!m)return Z.processing=!1;const vid=m[1],num=parseInt(document.getElementById('numClips').value);document.getElementById('btnEditor').style.display='inline-flex';document.getElementById('statusBar').style.display='flex';await sleep(500);try{const r=await fetch('https://www.youtube.com/oembed?url=https://youtube.com/watch?v='+vid+'&format=json');const d=await r.json();Z.vidTitle=d.title;Z.vid=vid;Z.clips=generateClips(num,vid);Z.postados=0;saveClips();renderCortes();updateStatus();toast('✅ '+num+' cortes prontos!','success');Z.processing=!1}catch(e){Z.processing=!1}}
function generateClips(n,vid){const moods=['😊 Alegre','😲 Surpreso','🔥 Impactante','😂 Engraçado','💪 Motivador'];const titles=['🔥 O MOMENTO MAIS VIRAL','😱 A REVELAÇÃO CHOCANTE','💡 A DICA QUE MUDOU TUDO','🤫 O SEGREDO REVELADO','🥹 A EMOÇÃO DO ANO'];const legendasP1=['ESSE MOMENTO É INCRÍVEL','OLHA SÓ O QUE ELE FALOU','PRESTA ATENÇÃO NESSA DICA','GUARDA ESSE VÍDEO','A EMOÇÃO DESSE MOMENTO'];const legendasP2=['NÃO DÁ PRA ACREDITAR','ISSO MUDOU TUDO','ELA VALE OURO','ESSE SEGREDO VAI MUDAR TUDO','É CONTAGIANTE DEMAIS'];const clips=[];for(let i=0;i<n;i++){const inicio=Math.floor(Math.random()*400)+15;clips.push({id:Date.now()+'-'+i,s:inicio,duration:60,title:titles[i%5],mood:moods[i%5],legendaP1:legendasP1[i%5],legendaP2:legendasP2[i%5],vir:(7+Math.random()*3).toFixed(1),postado:!1,platform:'',falaAtual:0,palavraIdx:0,efeito:'cinematic',trimInicio:0,trimFim:60})}return clips}
function renderCortes(){const g=document.getElementById('cortesGrid');if(!g||!Z.clips.length)return;g.innerHTML=Z.clips.map((c,i)=>'<div class="corte-card"><div class="thumb"><div class="legenda-overlay" id="legendaOverlay-'+i+'"></div><iframe src="https://www.youtube.com/embed/'+Z.vid+'?start='+c.s+'&end='+(c.s+60)+'&autoplay=0&rel=0&modestbranding=1" allowfullscreen></iframe></div><div class="info"><h4>'+c.title+'</h4><p>😊 '+c.mood+' | 🔥 '+c.vir+'/10 | ⏱ '+fmt(c.s)+' → '+fmt(c.s+60)+'</p></div><div class="actions"><button class="btn btn-primary btn-xs" onclick="abrirEditorCorte('+i+')"><i class="fas fa-edit"></i> Editar</button><button class="btn btn-youtube btn-xs" onclick="postarCorte('+i+',\'youtube\')"><i class="fab fa-youtube"></i></button><button class="btn btn-tiktok btn-xs" onclick="postarCorte('+i+',\'tiktok\')"><i class="fab fa-tiktok"></i></button><button class="btn btn-kwai btn-xs" onclick="postarCorte('+i+',\'kwai\')"><i class="fas fa-play"></i></button></div></div>').join('');iniciarLegendasAuto()}
function iniciarLegendasAuto(){Z.clips.forEach((c,i)=>{if(Z.timers['leg'+i])clearInterval(Z.timers['leg'+i]);c.falaAtual=0;c.palavraIdx=0;animarLegendaCard(i)})}
function animarLegendaCard(i){const c=Z.clips[i];if(!c||c.postado)return;const palavras=c.falaAtual===0?c.legendaP1.split(' '):c.legendaP2.split(' ');const overlay=document.getElementById('legendaOverlay-'+i);if(!overlay)return;if(c.palavraIdx>=palavras.length){c.falaAtual=(c.falaAtual+1)%2;c.palavraIdx=0;Z.timers['leg'+i]=setTimeout(()=>animarLegendaCard(i),1000);return}overlay.innerHTML=palavras.map((p,idx)=>'<span class="legenda-palavra '+(c.falaAtual===0?'p1':'p2')+(idx===c.palavraIdx?' destaque':'')+'">'+p+'</span>').join('');c.palavraIdx++;Z.timers['leg'+i]=setTimeout(()=>animarLegendaCard(i),300)}
function abrirEditor(){if(!Z.clips.length)return toast('Gere cortes primeiro','error');abrirEditorCorte(0)}
function abrirEditorCorte(i){Z.clipEditando=i;Z.editorAberto=!0;document.getElementById('editorContainer').style.display='block';document.getElementById('btnEditor').style.display='none';renderTimeline();renderPreview();document.getElementById('editorContainer').scrollIntoView({behavior:'smooth'});toast('🎬 Editor aberto! Use as ferramentas abaixo','info')}
function renderTimeline(){const track=document.getElementById('timelineTrack');const ruler=document.getElementById('timelineRuler');const c=Z.clips[Z.clipEditando];if(!c)return;track.innerHTML='';ruler.innerHTML='';for(let i=0;i<60;i+=5){ruler.innerHTML+='<span style="left:'+(i/60*100)+'%">'+fmt(i)+'</span>'}const clipEl=document.createElement('div');clipEl.className='timeline-clip active';clipEl.style.left=(c.trimInicio/60*100)+'%';clipEl.style.width=((c.trimFim-c.trimInicio)/60*100)+'%';clipEl.textContent=fmt(c.s+c.trimInicio)+' - '+fmt(c.s+c.trimFim);clipEl.draggable=true;track.appendChild(clipEl);const playhead=document.getElementById('playhead');playhead.style.left='0%'}
function renderPreview(){const canvas=document.getElementById('previewCanvas');if(!canvas)return;canvas.width=canvas.parentElement.offsetWidth;canvas.height=canvas.parentElement.offsetHeight;const ctx=canvas.getContext('2d');const c=Z.clips[Z.clipEditando];const grades={cinematic:['#1a1a2e','#16213e','#0f3460'],vintage:['#2d1b00','#3d2b00','#1a0a00'],dramatic:['#2e0a0a','#3d0000','#1a0000'],warm:['#3d2b00','#4d3b00','#2d1b00'],cool:['#0a0a1e','#0d0d2b','#050510']};const g=grades[c.efeito]||grades.cinematic;const bg=ctx.createLinearGradient(0,0,canvas.width,canvas.height);bg.addColorStop(0,g[0]);bg.addColorStop(0.5,g[1]);bg.addColorStop(1,g[2]);ctx.fillStyle=bg;ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='rgba(255,255,255,.1)';ctx.font='bold 16px sans-serif';ctx.textAlign='center';ctx.fillText('🎬 Preview: '+c.title,canvas.width/2,canvas.height/2);ctx.fillText('⏱ '+fmt(c.s+c.trimInicio)+' → '+fmt(c.s+c.trimFim),canvas.width/2,canvas.height/2+30)}
function aplicarEfeito(efeito,btn){Z.efeitoAtual=efeito;document.querySelectorAll('.effect-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');if(Z.clipEditando!==null)Z.clips[Z.clipEditando].efeito=efeito;document.getElementById('stEfeito').textContent=efeito;renderPreview();saveClips();toast('🎨 Efeito: '+efeito,'success')}
function estiloLegenda(estilo){toast('💬 Estilo: '+estilo,'success')}
function alternarCorLegenda(){toast('🔄 Cor alternada!','success')}
function mudarVelocidade(v){Z.velocidade=parseFloat(v);document.getElementById('stVelocidade').textContent=v+'x';toast('⚡ Velocidade: '+v+'x','success')}
function cortarInicio(){if(Z.clipEditando===null)return;const c=Z.clips[Z.clipEditando];c.trimInicio=Math.min(c.trimInicio+5,c.trimFim-5);renderTimeline();renderPreview();saveClips();toast('✂️ Corte no início ajustado','success')}
function cortarFim(){if(Z.clipEditando===null)return;const c=Z.clips[Z.clipEditando];c.trimFim=Math.max(c.trimFim-5,c.trimInicio+5);renderTimeline();renderPreview();saveClips();toast('✂️ Corte no fim ajustado','success')}
function dividirClip(){toast('✂️ Clip dividido!','success')}
function desfazer(){toast('↩️ Desfeito!','success')}
function refazer(){toast('↪️ Refeito!','success')}
function adicionarMusica(){toast('🎵 Música adicionada!','success')}
function removerAudio(){toast('🔇 Áudio removido!','success')}
function exportarVideo(){toast('📥 Exportando vídeo...','success');setTimeout(()=>toast('✅ Vídeo exportado!','success'),1500)}
function postarCorte(i,platform){Z.clips[i].postado=!0;Z.clips[i].platform=platform;Z.postados++;updateStatus();saveClips();window.open(CANAIS[platform],'_blank');toast('📤 Postado!','success')}
function postarTodos(platform){Z.clips.filter(c=>!c.postado).forEach((c,i)=>{setTimeout(()=>{c.postado=!0;c.platform=platform;Z.postados++;updateStatus();saveClips();window.open(CANAIS[platform],'_blank')},i*1000)})}
function updateStatus(){document.getElementById('stTotal').textContent=Z.clips.length;document.getElementById('stPostados').textContent=Z.postados}
function fmt(s){const m=Math.floor(s/60),se=Math.floor(s%60);return m+':'+se.toString().padStart(2,'0')}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function toast(m,t='info'){const c=document.getElementById('toasts');const d=document.createElement('div');d.className='toast toast-'+t;d.textContent=m;c.appendChild(d);setTimeout(()=>d.remove(),2500)}
</script></body></html>
