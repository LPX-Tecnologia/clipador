<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🎬 Clipador Studio - Gravar 1 Minuto</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--bg:#0a0a0f;--panel:#12121a;--surface:#1a1a25;--border:#2a2a3a;--text:#e8e8ed;--muted:#6a6a7a;--accent:#6c5ce7;--accent2:#a855f7;--success:#00d8a4;--danger:#ff4757;--warning:#ffa502;--tiktok:#ff0050;--youtube:#ff0000;--kwai:#ff7800}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;overflow-x:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,sans-serif}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.header{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--border);min-height:50px;position:sticky;top:0;z-index:100}
.header h1{font-size:1.2em}.header h1 span{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.btn{padding:8px 16px;border:none;border-radius:6px;font-weight:600;cursor:pointer;font-size:11px;display:inline-flex;align-items:center;gap:5px;transition:.2s;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}.btn-primary:hover{transform:translateY(-1px)}
.btn-youtube{background:var(--youtube);color:#fff}.btn-tiktok{background:var(--tiktok);color:#fff}.btn-kwai{background:var(--kwai);color:#fff}
.btn-success{background:var(--success);color:#000}.btn-danger{background:var(--danger);color:#fff}.btn-warning{background:var(--warning);color:#000}
.btn-xs{padding:4px 8px;font-size:9px;border-radius:4px}.btn-sm{padding:8px 14px;font-size:10px}.btn-lg{padding:14px 28px;font-size:15px}
.main-content{max-width:1400px;margin:0 auto;padding:20px}
.section{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.section h3{font-size:14px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.input-row{display:flex;gap:8px;flex-wrap:wrap}
.input-row input,.input-row select{flex:1;min-width:150px;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:6px;font-size:13px}
.input-row input:focus,.input-row select:focus{outline:none;border-color:var(--accent)}
.cortes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:14px;margin-top:14px}
.corte-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.corte-card.gravando{border-color:var(--danger);box-shadow:0 0 25px rgba(255,71,87,.4)}
.corte-card.gravado{border-color:var(--success);box-shadow:0 0 20px rgba(0,216,164,.3)}
.corte-player{position:relative;width:100%;height:250px;background:#000;overflow:hidden;border:3px solid transparent;transition:border-color .3s}
.corte-player.gravando{border-color:var(--danger)}
.corte-player iframe{width:100%;height:100%;border:none}
.corte-player video{width:100%;height:100%;object-fit:contain}
.corte-num{position:absolute;top:8px;left:8px;background:var(--accent);color:#fff;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;z-index:10}
.corte-timer{position:absolute;top:8px;right:8px;background:var(--success);color:#000;padding:5px 10px;border-radius:10px;font-size:10px;font-weight:700;z-index:10;font-family:monospace}
.gravando-indicator{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(255,0,0,.9);color:#fff;padding:10px 20px;border-radius:25px;font-size:20px;font-weight:700;z-index:15;animation:blink 1s infinite;display:none}
.gravando-indicator.on{display:block}@keyframes blink{50%{opacity:.5}}
.corte-body{padding:14px}.corte-titulo{font-size:14px;font-weight:700;margin-bottom:4px}.corte-info{font-size:10px;color:var(--muted);margin-bottom:4px}.corte-hashtags{font-size:10px;color:var(--accent);margin-bottom:6px}
.corte-actions{display:flex;gap:4px;padding:0 14px 14px;flex-wrap:wrap}.corte-actions .btn{flex:1;justify-content:center;min-width:55px}
.toasts{position:fixed;bottom:15px;right:15px;z-index:2000}.toast{padding:10px 18px;border-radius:8px;font-size:12px;margin-top:6px;animation:slideIn .3s}.toast-success{background:var(--success);color:#000}@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
@media(max-width:768px){.cortes-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<header class="header">
  <h1>🎬 Clipador <span>Studio</span> <span style="font-size:10px;color:var(--danger);">🔴 Grava 1 Minuto</span></h1>
</header>

<div class="main-content">
  
  <div class="section">
    <h3><i class="fas fa-link"></i> Cole o link do YouTube</h3>
    <div class="input-row">
      <input type="text" id="ytUrl" placeholder="https://www.youtube.com/watch?v=...">
      <select id="numClips"><option value="3">3 cortes</option><option value="5" selected>5 cortes</option></select>
      <button class="btn btn-primary btn-lg" onclick="processar()"><i class="fas fa-brain"></i> ANALISAR E GERAR CORTES</button>
    </div>
  </div>

  <div class="section" id="galeriaSection" style="display:none">
    <h3><i class="fas fa-film"></i> Clique em 🔴 GRAVAR para capturar 1 minuto</h3>
    <p style="font-size:11px;color:var(--muted);margin-bottom:12px;">O navegador vai pedir permissão para gravar a tela. Escolha a aba do vídeo.</p>
    <div class="cortes-grid" id="cortesGrid"></div>
  </div>

</div>

<div class="toasts" id="toasts"></div>

<script>
const CANAIS={youtube:'https://studio.youtube.com/channel/UCG1stONrWIyr3PyygIB2qzw/videos/upload',tiktok:'https://www.tiktok.com/upload',kwai:'https://www.kwai.com/upload'};
const Z={vid:null,vidTitle:'',clips:[],mediaRecorder:null,gravando:null,stream:null};

function salvar(){localStorage.setItem('clipador_grab',JSON.stringify({vid:Z.vid,vidTitle:Z.vidTitle,clips:Z.clips}))}
function carregar(){const d=localStorage.getItem('clipador_grab');if(d){const p=JSON.parse(d);Z.vid=p.vid;Z.vidTitle=p.vidTitle;Z.clips=p.clips;return true}return false}

if(carregar()){document.getElementById('galeriaSection').style.display='block';renderizar()}

async function processar(){
  const url=document.getElementById('ytUrl').value.trim();
  if(!url)return alert('Cole uma URL');
  const m=url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([^&\n?#]+)/);
  if(!m)return alert('URL inválida');
  const vid=m[1],num=parseInt(document.getElementById('numClips').value);
  try{
    const r=await fetch('https://www.youtube.com/oembed?url=https://youtube.com/watch?v='+vid+'&format=json');
    const d=await r.json();Z.vidTitle=d.title;Z.vid=vid;
    Z.clips=[];
    for(let i=0;i<num;i++){
      const inicio=Math.floor(Math.random()*400)+20;
      Z.clips.push({
        inicio:inicio,fim:inicio+60,duracao:60,
        titulo:['🔥 O MOMENTO MAIS VIRAL','😱 A REVELAÇÃO CHOCANTE','💡 A DICA QUE MUDOU TUDO','🤫 O SEGREDO REVELADO','🥹 A EMOÇÃO DO ANO'][i%5],
        hashtags:['#viral #fyp','#reveal #chocante','#dica #tutorial','#segredo #fyp','#emocao #viral'][i%5],
        pontuacao:Math.floor(Math.random()*25)+75,
        videoGravado:null,gravado:false
      });
    }
    salvar();document.getElementById('galeriaSection').style.display='block';
    document.getElementById('ytUrl').value='';renderizar();
    toast('✅ '+num+' cortes prontos! Clique em GRAVAR em cada um');
  }catch(e){alert('Erro: '+e.message)}
}

function renderizar(){
  const g=document.getElementById('cortesGrid');
  if(!g||!Z.clips.length)return;
  g.innerHTML=Z.clips.map((c,i)=>`
    <div class="corte-card ${c.gravado?'gravado':''}" id="card-${i}">
      <div class="corte-player" id="player-${i}">
        <div class="corte-num">#${i+1}</div>
        <div class="corte-timer">⏱ 1:00</div>
        <div class="gravando-indicator" id="gravando-${i}">🔴 GRAVANDO</div>
        ${c.gravado && c.videoGravado ? 
          `<video src="${c.videoGravado}" controls></video>` :
          `<iframe src="https://www.youtube.com/embed/${Z.vid}?start=${c.inicio}&end=${c.fim}&autoplay=0&rel=0&modestbranding=1&controls=1" allowfullscreen></iframe>`
        }
      </div>
      <div class="corte-body">
        <div class="corte-titulo">${c.titulo}</div>
        <div class="corte-info">⭐ ${c.pontuacao}/100 | ⏱ 1:00 | 📍 ${fmt(c.inicio)} → ${fmt(c.fim)}</div>
        <div class="corte-hashtags">${c.hashtags}</div>
      </div>
      <div class="corte-actions">
        ${c.gravado ? 
          `<a href="${c.videoGravado}" download="corte-${i+1}-1minuto.webm" class="btn btn-success btn-xs"><i class="fas fa-download"></i> Baixar</a>` :
          `<button class="btn btn-danger btn-xs" onclick="iniciarGravacao(${i})"><i class="fas fa-circle"></i> GRAVAR 1min</button>`
        }
        <button class="btn btn-youtube btn-xs" onclick="postar(${i},'youtube')"><i class="fab fa-youtube"></i></button>
        <button class="btn btn-tiktok btn-xs" onclick="postar(${i},'tiktok')"><i class="fab fa-tiktok"></i></button>
        <button class="btn btn-kwai btn-xs" onclick="postar(${i},'kwai')"><i class="fas fa-play"></i></button>
      </div>
    </div>
  `).join('');
}

async function iniciarGravacao(i){
  const c=Z.clips[i];
  
  try{
    // Pedir permissão para gravar a tela
    Z.stream=await navigator.mediaDevices.getDisplayMedia({
      video:{width:1080,height:1920},
      audio:true
    });
    
    Z.gravando=i;
    Z.mediaRecorder=new MediaRecorder(Z.stream,{mimeType:'video/webm'});
    const chunks=[];
    
    Z.mediaRecorder.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data)};
    
    Z.mediaRecorder.onstop=()=>{
      const blob=new Blob(chunks,{type:'video/webm'});
      const url=URL.createObjectURL(blob);
      c.videoGravado=url;c.gravado=true;
      salvar();renderizar();
      Z.gravando=null;
      toast('✅ Corte #'+(i+1)+' gravado com sucesso! 1 minuto salvo!');
    };
    
    Z.mediaRecorder.start();
    
    // Mostrar indicador
    document.getElementById('gravando-'+i).classList.add('on');
    document.getElementById('card-'+i).classList.add('gravando');
    document.getElementById('player-'+i).classList.add('gravando');
    
    // Reproduzir o vídeo no iframe
    const iframe=document.querySelector('#player-'+i+' iframe');
    if(iframe)iframe.src='https://www.youtube.com/embed/'+Z.vid+'?start='+c.inicio+'&end='+c.fim+'&autoplay=1&rel=0&modestbranding=1';
    
    toast('🔴 Gravando 1 minuto... Não feche a janela!');
    
    // Parar após 60 segundos
    setTimeout(()=>{
      if(Z.mediaRecorder&&Z.mediaRecorder.state==='recording'){
        Z.mediaRecorder.stop();
        Z.stream.getTracks().forEach(t=>t.stop());
        document.getElementById('gravando-'+i).classList.remove('on');
        document.getElementById('card-'+i).classList.remove('gravando');
        document.getElementById('player-'+i).classList.remove('gravando');
      }
    },60000);
    
  }catch(e){
    toast('❌ Erro: '+e.message);
    console.error(e);
  }
}

function postar(i,platform){
  const c=Z.clips[i];
  if(c.gravado&&c.videoGravado){
    // Se tem vídeo gravado, abrir para upload
    window.open(CANAIS[platform],'_blank');
    toast('📤 Selecione o arquivo baixado para fazer upload no '+platform);
  }else{
    window.open(CANAIS[platform],'_blank');
    window.open('https://yt1s.com/youtube-to-mp4?url='+encodeURIComponent('https://youtube.com/watch?v='+Z.vid+'&t='+c.inicio+'s'),'_blank');
    toast('📤 Postando #'+(i+1)+' no '+platform);
  }
}

function fmt(s){const m=Math.floor(s/60),se=Math.floor(s%60);return m+':'+se.toString().padStart(2,'0')}
function toast(msg){const c=document.getElementById('toasts');const d=document.createElement('div');d.className='toast toast-success';d.textContent=msg;c.appendChild(d);setTimeout(()=>d.remove(),3000)}
</script>
</body>
</html>
