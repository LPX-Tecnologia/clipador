<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>🎬 Clipador Studio - Corte Real</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><style>
:root{--bg:#0a0a0f;--panel:#12121a;--surface:#1a1a25;--border:#2a2a3a;--text:#e8e8ed;--muted:#6a6a7a;--accent:#6c5ce7;--accent2:#a855f7;--success:#00d8a4;--danger:#ff4757;--warning:#ffa502;--tiktok:#ff0050;--youtube:#ff0000;--kwai:#ff7800}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;overflow-y:auto;overflow-x:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,sans-serif}::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.loader{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity .5s}.loader.hidden{opacity:0;pointer-events:none}.loader-content{text-align:center}.loader-icon{font-size:4em;color:var(--accent);animation:pulse 2s infinite;margin-bottom:20px}.loader-content h2{font-size:1.8em;margin-bottom:8px}.loader-content h2 span{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}.loader-content p{color:var(--muted);font-size:14px;margin-bottom:20px}.loader-bar{width:200px;height:4px;background:var(--border);border-radius:2px;margin:0 auto;overflow:hidden}.loader-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));animation:fillBar 2.8s ease forwards;border-radius:2px}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}@keyframes fillBar{0%{width:0}100%{width:100%}}
.app{min-height:100vh;display:flex;flex-direction:column}.header{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--border);min-height:50px;position:sticky;top:0;z-index:100}.header h1{font-size:1.1em}.header h1 span{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}.header-actions{display:flex;gap:5px}
.btn{padding:7px 14px;border:none;border-radius:5px;font-weight:600;cursor:pointer;font-size:11px;display:inline-flex;align-items:center;gap:5px;transition:.2s}.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}.btn-primary:hover{transform:translateY(-1px)}.btn-icon{background:var(--surface);border:1px solid var(--border);color:var(--text);width:32px;height:32px;border-radius:5px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:13px}.btn-icon:hover{border-color:var(--accent)}.btn-tiktok{background:var(--tiktok);color:#fff}.btn-youtube{background:var(--youtube);color:#fff}.btn-kwai{background:var(--kwai);color:#fff}.btn-xs{width:28px;height:28px;font-size:11px}.btn-success{background:var(--success);color:#000}.btn-download{background:#ffa502;color:#000}
.workspace{flex:1;display:grid;grid-template-columns:180px 1fr 250px;overflow:hidden}.tools{background:var(--panel);border-right:1px solid var(--border);padding:10px;overflow-y:auto}.tools h3{font-size:9px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;letter-spacing:1px}.tool-btn{width:100%;padding:7px 10px;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:5px;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:11px;margin-bottom:3px;transition:.2s}.tool-btn:hover{border-color:var(--accent)}.tool-btn.active{background:rgba(108,92,231,.15);border-color:var(--accent);color:var(--accent)}
.preview{display:flex;flex-direction:column}.preview-screen{flex:1;background:#000;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:300px}.preview-screen canvas{position:absolute;inset:0;width:100%;height:100%}.subtitle{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);z-index:10;text-align:center;width:90%}.subtitle-text{display:inline-block;padding:10px 18px;background:rgba(0,0,0,.85);color:#fff;font-size:20px;font-weight:700;border-radius:10px}.emotion{position:absolute;top:10px;right:10px;font-size:2.5em;z-index:10}.framing-tag{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.7);color:#fff;padding:4px 10px;border-radius:15px;font-size:10px;z-index:10;display:flex;align-items:center;gap:4px}.cut-tag{position:absolute;bottom:10px;right:10px;background:var(--accent);color:#fff;padding:4px 10px;border-radius:4px;font-size:10px;z-index:10;font-family:monospace}
.controls{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel);border-top:1px solid var(--border)}.time{font-family:monospace;font-size:11px;color:var(--muted);min-width:70px}.seek{flex:1;height:3px;-webkit-appearance:none;background:var(--border);border-radius:2px;cursor:pointer}.seek::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.details{height:120px;background:var(--panel);border-top:1px solid var(--border);padding:8px;font-size:10px;overflow-y:auto}.emotion-bar{display:flex;align-items:center;gap:5px;margin:3px 0}.emotion-bar .bar{flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden}.emotion-bar .fill{height:100%;border-radius:2px;transition:width .5s}.fill-joy{background:#ffa502}.fill-surprise{background:#a855f7}.fill-sad{background:#3742fa}.fill-angry{background:#ff4757}.char-tag{display:inline-block;padding:2px 6px;margin:1px;background:var(--surface);border-radius:8px;font-size:9px}
.timeline{background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column}.timeline h3{padding:8px 10px;font-size:10px;border-bottom:1px solid var(--border)}.track-label{padding:4px 10px;font-size:9px;font-weight:600;text-transform:uppercase;color:var(--muted);background:var(--surface)}.track-content{min-height:40px;padding:4px;position:relative}.track-empty{color:var(--muted);font-size:9px;text-align:center;padding:12px}.clip-bar{position:absolute;height:60%;top:20%;background:rgba(108,92,231,.3);border:1px solid rgba(108,92,231,.5);border-radius:3px;cursor:pointer;font-size:7px;color:#fff;display:flex;align-items:center;justify-content:center;transition:.2s}.clip-bar:hover{background:rgba(108,92,231,.6)}.clip-bar.active{border-color:#a855f7;background:rgba(108,92,231,.5)}
.footer{display:flex;align-items:center;justify-content:space-between;padding:5px 12px;background:var(--panel);border-top:1px solid var(--border);min-height:38px;font-size:10px;position:sticky;bottom:0;z-index:100}.footer select{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:3px 6px;border-radius:3px;font-size:10px}.platforms{display:flex;gap:3px}.platforms button{width:24px;height:24px;border:none;border-radius:50%;cursor:pointer;color:#fff;font-size:10px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;align-items:center;justify-content:center}.modal.open{display:flex}.modal-box{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px;max-width:500px;width:90%}.modal-box h2{font-size:1em;margin-bottom:10px;display:flex;align-items:center;gap:6px}.modal-box input{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:5px;font-size:12px;margin-bottom:8px}.modal-box input:focus{outline:none;border-color:var(--accent)}.modal-row{display:flex;gap:6px}.modal-row input{flex:1}.preview-box{display:flex;gap:8px;padding:8px;background:var(--surface);border-radius:5px;margin:8px 0}.preview-box img{width:70px;height:40px;object-fit:cover;border-radius:3px}.preview-box h4{font-size:11px}.progress{margin:8px 0}.progress .bar{height:3px;background:var(--border);border-radius:2px;overflow:hidden}.progress .fill{height:100%;background:var(--accent);width:0;transition:width .5s}.progress p{font-size:10px;color:var(--muted);margin-top:2px}
.clips-panel{display:none;padding:10px;background:var(--panel);border-top:1px solid var(--border);max-height:300px;overflow-y:auto}.clips-panel.on{display:block}.clips-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}.clip-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px;cursor:pointer;transition:.2s;position:relative}.clip-card:hover{border-color:var(--accent);transform:translateY(-2px)}.clip-card.active{border-color:var(--accent)!important;box-shadow:0 0 15px rgba(108,92,231,.3)}.clip-card .thumb{height:60px;border-radius:5px;margin-bottom:8px;display:flex;align-items:center;justify-content:center;font-size:2em;position:relative}.clip-card .time{font-family:monospace;font-size:9px;color:var(--accent)}.clip-card .title{font-size:11px;font-weight:600;margin:4px 0;line-height:1.3}.clip-card .info{font-size:8px;color:var(--muted);margin-bottom:3px}.clip-card .actions{display:flex;gap:3px;margin-top:6px}.clip-card .actions button{flex:1;padding:5px;font-size:9px;border-radius:4px;border:none;cursor:pointer;color:#fff}
.clip-badge{position:absolute;top:5px;right:5px;background:var(--success);color:#000;padding:3px 7px;border-radius:10px;font-size:8px;z-index:1;font-weight:600}
.editor-panel{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:900;overflow-y:auto;padding:20px}.editor-panel.on{display:block}
.toasts{position:fixed;bottom:10px;right:10px;z-index:2000}.toast{padding:8px 14px;border-radius:5px;font-size:11px;margin-top:4px;animation:slideIn .3s}.toast-success{background:var(--success);color:#000}.toast-error{background:var(--danger)}.toast-info{background:var(--accent)}@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.download-section{background:var(--surface);border:1px solid var(--warning);border-radius:8px;padding:12px;margin:10px 0}.download-section h4{color:var(--warning);font-size:12px;margin-bottom:6px}
@media(max-width:768px){.workspace{grid-template-columns:1fr}.tools{display:flex;overflow-x:auto;border-right:none;border-bottom:1px solid var(--border)}.tool-btn{width:auto;white-space:nowrap;font-size:10px}.timeline{border-left:none;border-top:1px solid var(--border);max-height:130px}.clips-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
</style></head><body>
<div class="loader" id="loader"><div class="loader-content"><div class="loader-icon"><i class="fas fa-film"></i></div><h2>Clipador <span>Studio</span></h2><p id="loaderMsg">Preparando seu estúdio de cinema...</p><div class="loader-bar"><div class="loader-fill"></div></div></div></div>
<div class="app" id="app">
<header class="header"><h1>🎬 Clipador <span>Studio</span></h1><div class="header-actions"><button class="btn-icon" onclick="openModal()" title="Importar YouTube"><i class="fab fa-youtube"></i></button><button class="btn-icon" onclick="loadDemo()" title="Carregar Demo"><i class="fas fa-play"></i></button><button class="btn btn-primary" onclick="publishAll()"><i class="fas fa-rocket"></i> Publicar Todos</button></div></header>
<div class="workspace">
<aside class="tools"><h3>🎬 Edição IA</h3><button class="tool-btn active" onclick="useTool(this,'auto')"><i class="fas fa-magic"></i> Auto Cortes</button><button class="tool-btn" onclick="useTool(this,'mood')"><i class="fas fa-face-smile"></i> Analisar Humor</button><button class="tool-btn" onclick="useTool(this,'frame')"><i class="fas fa-crop"></i> Enquadramento</button><button class="tool-btn" onclick="useTool(this,'subs')"><i class="fas fa-closed-captioning"></i> Legendas</button><button class="tool-btn" onclick="useTool(this,'color')"><i class="fas fa-palette"></i> Color Grade</button><button class="tool-btn" onclick="useTool(this,'effects')"><i class="fas fa-stars"></i> Efeitos</button><button class="tool-btn btn-download" onclick="downloadCut()"><i class="fas fa-download"></i> Baixar Corte</button></aside>
<main class="preview"><div class="preview-screen" id="screen"><canvas id="canvas"></canvas><div class="subtitle" id="subOverlay"></div><div class="emotion" id="emotionIcon">🎬</div><div class="framing-tag" id="framingTag" style="display:none"><i class="fas fa-video"></i> <span id="framingName">Cinematic</span></div><div class="cut-tag" id="cutTag" style="display:none">✂️ <span id="cutTime">00:00</span></div></div><div class="controls"><button class="btn-icon btn-xs" id="playBtn" onclick="togglePlay()"><i class="fas fa-play"></i></button><span class="time"><span id="curTime">00:00</span> / <span id="totTime">01:00</span></span><input type="range" class="seek" id="seekBar" min="0" max="100" value="0" oninput="seekTo(this.value)"><button class="btn-icon btn-xs" onclick="toggleFS()"><i class="fas fa-expand"></i></button></div><div class="details"><div id="emotionBars"></div><div style="margin-top:5px" id="charsList"><span class="char-tag">Carregando...</span></div></div></main>
<aside class="timeline"><h3><i class="fas fa-clock"></i> Timeline</h3><div class="track-label">🎬 Cortes</div><div class="track-content" id="trackContent"><div class="track-empty">Aguarde...</div></div></aside>
</div>
<div class="clips-panel" id="clipsPanel"><div class="clips-grid" id="clipsGrid"></div></div>
<footer class="footer"><span id="clipCount" style="font-weight:600;">0 cortes gerados</span><select id="clipDur" onchange="Z.clipDur=parseInt(this.value)"><option value="30">30s</option><option value="60" selected>1min</option><option value="90">1:30</option></select><button class="btn btn-primary btn-xs" onclick="makeClips()"><i class="fas fa-magic"></i> Gerar Cortes</button><div class="platforms"><button class="btn-tiktok" onclick="share('tiktok')"><i class="fab fa-tiktok"></i></button><button class="btn-youtube" onclick="share('youtube')"><i class="fab fa-youtube"></i></button><button class="btn-kwai" onclick="share('kwai')"><i class="fas fa-play"></i></button></div></footer>
</div>
<div class="editor-panel" id="editorPanel"></div>
<div class="modal" id="ytModal"><div class="modal-box"><h2><i class="fab fa-youtube" style="color:#f00"></i> Importar do YouTube</h2><div class="modal-row"><input type="text" id="ytUrl" placeholder="Cole a URL do vídeo..."><button class="btn btn-primary" onclick="importYT()">Importar</button></div><div id="ytPreview" class="preview-box" style="display:none"><img id="ytThumb" src=""><div><h4 id="ytTitle"></h4></div></div><div class="progress" id="ytProgress" style="display:none"><div class="bar"><div class="fill" id="ytFill"></div></div><p id="ytMsg"></p></div><div class="download-section" id="downloadSection" style="display:none"><h4><i class="fas fa-download"></i> Baixar trecho do vídeo</h4><p style="font-size:10px;color:var(--muted);margin-bottom:8px;">Use um desses sites para baixar o trecho exato de 1 minuto:</p><div style="display:flex;gap:6px;flex-wrap:wrap;" id="downloadLinks"></div></div><button class="btn-icon" onclick="closeModals()" style="margin-top:6px"><i class="fas fa-times"></i></button></div></div>
<div class="toasts" id="toasts"></div>
<script>
const Z={vid:null,vidTitle:'Demo',vidThumb:'',time:0,playing:!1,clipDur:60,clips:[],clipIdx:-1,showEditor:!1,subs:[{s:0,e:3,sp:'Pessoa 1',tx:'Esse momento é INCRÍVEL!'},{s:3,e:6,sp:'Pessoa 2',tx:'Não dá pra acreditar...'},{s:6,e:9,sp:'Pessoa 1',tx:'Isso mudou completamente tudo!'},{s:9,e:12,sp:'Pessoa 2',tx:'É exatamente sobre isso!'}],mood:{joy:65,surp:45,sad:10,angry:5},chars:['Pessoa 1','Pessoa 2'],framing:'Spielberg Face',particles:[],cameraZoom:1,cameraShake:0,colorGrade:'Cinematic'};
(function(){const l=document.getElementById('loader'),m=document.getElementById('loaderMsg'),ms=['🎬 Inicializando estúdio...','🧠 Carregando IA de edição...','🎥 Calibrando câmera cinematográfica...','✨ Preparando efeitos especiais...','🚀 Estúdio pronto!'];let i=0;const iv=setInterval(()=>{if(i<ms.length){m.textContent=ms[i];i++}},500);setTimeout(()=>{clearInterval(iv);l.classList.add('hidden');setTimeout(()=>{if(l)l.remove();initApp()},500)},2800)})();
function initApp(){const c=document.getElementById('canvas');c.width=c.parentElement.offsetWidth;c.height=c.parentElement.offsetHeight;for(let i=0;i<30;i++)Z.particles.push({x:Math.random()*c.width,y:Math.random()*c.height,vx:(Math.random()-.5)*.5,vy:(Math.random()-.5)*.5,size:Math.random()*3+1,life:Math.random()*100,color:'hsl('+(260+Math.random()*40)+',70%,'+(60+Math.random()*30)+'%)'});document.addEventListener('keydown',e=>{if(e.key===' '&&document.activeElement===document.body){e.preventDefault();togglePlay()}if(e.key==='ArrowLeft')seekRel(-3);if(e.key==='ArrowRight')seekRel(3);if(e.key==='Escape'){closeModals();closeEditor()}});updateBars();setTimeout(()=>loadDemo(),400)}
function openModal(){document.getElementById('ytModal').classList.add('open');document.getElementById('ytUrl').focus()}
function closeModals(){document.getElementById('ytModal').classList.remove('open')}
function closeEditor(){Z.showEditor=!1;document.getElementById('editorPanel').classList.remove('on')}
function useTool(b,t){document.querySelectorAll('.tool-btn').forEach(b=>b.classList.remove('active'));b.classList.add('active');if(t==='auto')makeClips();else if(t==='mood'){Z.mood={joy:30+Math.random()*50,surp:20+Math.random()*40,sad:Math.random()*20,angry:Math.random()*15};updateBars();const d=Object.entries(Z.mood).sort((a,b)=>b[1]-a[1])[0][0];const g={joy:'Warm & Bright',surp:'High Contrast',sad:'Cool & Moody',angry:'Intense Red'};Z.colorGrade=g[d]||'Cinematic';toast('🧠 Humor analisado! Color: '+Z.colorGrade)}else if(t==='frame'){const f=[{name:'Spielberg Face',zoom:1.4},{name:'Tarantino Two-Shot',zoom:1},{name:'Nolan Epic',zoom:1.2},{name:'Kubrick Stare',zoom:1.6}];const r=f[Math.floor(Math.random()*f.length)];Z.framing=r.name;Z.cameraZoom=r.zoom;document.getElementById('framingTag').style.display='flex';document.getElementById('framingName').textContent=r.name;toast('🎥 '+r.name+' (zoom '+r.zoom+'x)')}else if(t==='subs'){Z.subs=[{s:0,e:2.5,sp:'Pessoa 1',tx:'🎬 Esse momento é INCRÍVEL!'},{s:2.5,e:5,sp:'Pessoa 2',tx:'😱 Não dá pra acreditar...'},{s:5,e:7.5,sp:'Pessoa 1',tx:'💡 Isso mudou tudo!'},{s:7.5,e:10,sp:'Pessoa 2',tx:'🔥 Exatamente sobre isso!'},{s:10,e:12,sp:'Pessoa 1',tx:'✨ Guarda esse vídeo!'}];toast('💬 Legendas geradas!')}else if(t==='color'){const g=['Cinematic','Warm & Bright','High Contrast','Cool & Moody','Intense Red'];Z.colorGrade=g[Math.floor(Math.random()*g.length)];toast('🎨 '+Z.colorGrade)}else if(t==='effects'){Z.cameraShake=10;setTimeout(()=>{Z.cameraShake=0},600);toast('✨ Efeitos de impacto!')}}
function updateBars(){const m=Z.mood;document.getElementById('emotionBars').innerHTML='<div class="emotion-bar"><span>😊</span><div class="bar"><div class="fill fill-joy" style="width:'+m.joy+'%"></div></div><span style="font-size:9px">'+Math.round(m.joy)+'%</span></div><div class="emotion-bar"><span>😲</span><div class="bar"><div class="fill fill-surprise" style="width:'+m.surp+'%"></div></div><span style="font-size:9px">'+Math.round(m.surp)+'%</span></div><div class="emotion-bar"><span>😢</span><div class="bar"><div class="fill fill-sad" style="width:'+m.sad+'%"></div></div><span style="font-size:9px">'+Math.round(m.sad)+'%</span></div><div class="emotion-bar"><span>😡</span><div class="bar"><div class="fill fill-angry" style="width:'+m.angry+'%"></div></div><span style="font-size:9px">'+Math.round(m.angry)+'%</span></div>'}
function loadDemo(){Z.vid='demo';Z.vidTitle='🎬 Demo - Clipador Studio';Z.vidThumb='';Z.chars=['🎤 Apresentador','🎙️ Convidado'];Z.framing='Spielberg Face';Z.cameraZoom=1.3;Z.colorGrade='Cinematic';Z.mood={joy:65,surp:45,sad:10,angry:5};document.getElementById('charsList').innerHTML=Z.chars.map(c=>'<span class="char-tag">'+c+'</span>').join('');document.getElementById('framingTag').style.display='flex';document.getElementById('framingName').textContent=Z.framing;document.getElementById('cutTag').style.display='block';updateBars();makeClips();setTimeout(()=>{previewClip(0);openEditor();Z.playing=!0;document.getElementById('playBtn').innerHTML='<i class="fas fa-pause"></i>';loop()},600);toast('✅ Demo carregado! 5 cortes prontos','success')}
async function importYT(){const u=document.getElementById('ytUrl').value.trim();if(!u)return toast('Cole uma URL','error');const m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([^&\n?#]+)/);if(!m)return toast('URL inválida','error');const vid=m[1];document.getElementById('ytProgress').style.display='block';document.getElementById('ytFill').style.width='30%';document.getElementById('ytMsg').textContent='🔗 Conectando ao YouTube...';try{const r=await fetch('https://www.youtube.com/oembed?url=https://youtube.com/watch?v='+vid+'&format=json');const d=await r.json();Z.vidTitle=d.title;Z.vid=vid;Z.vidThumb=d.thumbnail_url;document.getElementById('ytPreview').style.display='flex';document.getElementById('ytThumb').src=d.thumbnail_url;document.getElementById('ytTitle').textContent=d.title;document.getElementById('ytFill').style.width='70%';document.getElementById('ytMsg').textContent='🧠 Analisando com IA...';await sleep(600);document.getElementById('ytFill').style.width='100%';document.getElementById('ytMsg').textContent='✅ Vídeo analisado!';makeClips();showDownloadLinks(vid);setTimeout(()=>{document.getElementById('ytProgress').style.display='none';document.getElementById('ytFill').style.width='0%';openEditor();previewClip(0);Z.playing=!0;document.getElementById('playBtn').innerHTML='<i class="fas fa-pause"></i>';loop();toast('✅ '+Z.clips.length+' cortes gerados! Role para ver','success')},800)}catch(e){document.getElementById('ytMsg').textContent='❌ '+e.message;toast('❌ '+e.message,'error')}}
function showDownloadLinks(vid){const s=document.getElementById('downloadSection');s.style.display='block';const clip=Z.clips[0];const start=clip?clip.s:0;const end=clip?clip.e:60;const links=[{name:'yt1s.com',url:'https://yt1s.com/youtube-to-mp4?url='+encodeURIComponent('https://youtube.com/watch?v='+vid+'&t='+start+'s')},{name:'savefrom.net',url:'https://en.savefrom.net/1-youtube-video-downloader/?url='+encodeURIComponent('https://youtube.com/watch?v='+vid+'&t='+start+'s')},{name:'y2mate.com',url:'https://www.y2mate.com/youtube/'+vid}];document.getElementById('downloadLinks').innerHTML=links.map(l=>'<a href="'+l.url+'" target="_blank" class="btn btn-download btn-xs" style="text-decoration:none;">'+l.name+'</a>').join('')+'<br><span style="font-size:9px;color:var(--muted);">⏱ Trecho: '+fmt(start)+' - '+fmt(end)+' (1 minuto)</span>'}
function downloadCut(){if(!Z.clips.length)return toast('Gere cortes primeiro','warning');const c=Z.clips[Z.clipIdx];if(!Z.vid)return toast('Importe um vídeo primeiro','warning');const url='https://yt1s.com/youtube-to-mp4?url='+encodeURIComponent('https://youtube.com/watch?v='+Z.vid+'&t='+c.s+'s');window.open(url,'_blank');toast('📥 Abrindo download do corte: '+fmt(c.s)+' - '+fmt(c.e),'info')}
function makeClips(){const moods=['😊 Alegre','😲 Surpreso','🔥 Impactante','😂 Engraçado','💪 Motivador'];const titles=['🔥 O MOMENTO MAIS VIRAL','😱 A REVELAÇÃO CHOCANTE','💡 A DICA QUE MUDOU TUDO','🤫 O SEGREDO REVELADO','🥹 A EMOÇÃO DO ANO'];const effects=['vignette+glow','shake+zoom','slowmo+particles','flash+zoom','fade+glow'];const hashtags=['#viral #fyp','#shorts #reveal','#dica #tutorial','#segredo #curiosidade','#emocao #motivacao'];Z.clips=[];for(let i=0;i<5;i++)Z.clips.push({id:Date.now()+'-'+i,s:i*12,e:(i+1)*12,duration:12,title:titles[i],mood:moods[i],effects:effects[i],hashtags:hashtags[i],vir:(7.5+Math.random()*2.5).toFixed(1),edited:!1,colorGrade:Z.colorGrade,framing:Z.framing});Z.clipIdx=0;Z.time=0;document.getElementById('clipCount').textContent='✅ '+Z.clips.length+' cortes de '+Z.clipDur+'s prontos!';document.getElementById('totTime').textContent='00:12';document.getElementById('cutTag').style.display='block';document.getElementById('cutTime').textContent=fmt(Z.clips[0].s)+' - '+fmt(Z.clips[0].e);renderClipsPanel();renderTimeline();if(Z.showEditor)renderEditor()}
function renderClipsPanel(){const p=document.getElementById('clipsPanel');p.classList.add('on');const g=document.getElementById('clipsGrid');g.innerHTML='<div style="grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;"><strong style="font-size:11px;">📋 '+Z.clips.length+' CORTES GERADOS</strong><div style="display:flex;gap:4px;"><button class="btn btn-primary btn-xs" onclick="openEditor()"><i class="fas fa-edit"></i> Editar</button><button class="btn btn-success btn-xs" onclick="editAllClips()"><i class="fas fa-magic"></i> Auto</button></div></div>'+Z.clips.map((c,i)=>{const bg=i%2?'#6c5ce7':'#ff6b6b',bg2=i%2?'#a855f7':'#ff8787';return'<div class="clip-card '+(i===Z.clipIdx?'active':'')+'" onclick="previewClip('+i+');openEditor();">'+(c.edited?'<div class="clip-badge">✅</div>':'')+'<div class="thumb" style="background:linear-gradient(135deg,'+bg+'22,'+bg2+'44);"><span style="font-size:2em;">'+c.mood.split(' ')[0]+'</span></div><div class="time">⏱ '+fmt(c.s)+'-'+fmt(c.e)+' | 🔥'+c.vir+'</div><div class="title">'+c.title+'</div><div class="info">🎨 '+c.colorGrade+' | 🎥 '+c.framing+'</div><div class="actions"><button class="btn-tiktok" onclick="event.stopPropagation();share(\'tiktok\')"><i class="fab fa-tiktok"></i></button><button class="btn-youtube" onclick="event.stopPropagation();share(\'youtube\')"><i class="fab fa-youtube"></i></button><button class="btn-kwai" onclick="event.stopPropagation();share(\'kwai\')"><i class="fas fa-play"></i></button><button class="btn-download" onclick="event.stopPropagation();downloadCut()"><i class="fas fa-download"></i></button></div></div>'}).join('')+'<div style="grid-column:1/-1;display:flex;gap:8px;margin-top:6px;"><button class="btn btn-primary btn-xs" onclick="publishAll()" style="flex:1;"><i class="fas fa-rocket"></i> Publicar</button><button class="btn btn-success btn-xs" onclick="editAllClips()" style="flex:1;"><i class="fas fa-magic"></i> Auto Editar</button></div>'}
function editAllClips(){Z.clips.forEach((c,i)=>{c.edited=!0;c.colorGrade=['Cinematic','Warm & Bright','High Contrast','Cool & Moody'][Math.floor(Math.random()*4)];c.framing=['Spielberg Face','Tarantino Two-Shot','Nolan Epic','Kubrick Stare'][Math.floor(Math.random()*4)]});Z.colorGrade=Z.clips[0].colorGrade;Z.framing=Z.clips[0].framing;document.getElementById('framingName').textContent=Z.framing;document.getElementById('framingTag').style.display='flex';updateBars();renderClipsPanel();if(Z.showEditor)renderEditor();toast('✅ Todos os '+Z.clips.length+' cortes editados!','success')}
function openEditor(){Z.showEditor=!0;document.getElementById('editorPanel').classList.add('on');renderEditor()}
function renderEditor(){if(!Z.showEditor)return;const ep=document.getElementById('editorPanel');ep.innerHTML='<div style="max-width:1100px;margin:0 auto;"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;"><h3 style="font-size:16px;"><i class="fas fa-cut"></i> '+Z.clips.length+' Cortes: '+Z.vidTitle+'</h3><button class="btn-icon" onclick="closeEditor()"><i class="fas fa-times"></i></button></div>'+(Z.vidThumb?'<div style="display:flex;gap:15px;margin-bottom:15px;padding:15px;background:var(--surface);border-radius:10px;align-items:center;"><img src="'+Z.vidThumb+'" style="width:160px;height:90px;object-fit:cover;border-radius:8px;"><div style="flex:1;"><strong style="font-size:14px;">'+Z.vidTitle+'</strong><br><span style="color:var(--muted);font-size:12px;">'+Z.clips.length+' cortes de '+Z.clipDur+'s | '+Z.clips.filter(c=>c.edited).length+' editados</span><div style="display:flex;gap:6px;margin-top:8px;"><button class="btn btn-primary btn-xs" onclick="editAllClips()"><i class="fas fa-magic"></i> Auto Editar</button><button class="btn btn-success btn-xs" onclick="publishAll()"><i class="fas fa-rocket"></i> Publicar</button></div></div></div>':'')+'<div class="download-section"><h4><i class="fas fa-download"></i> Como baixar os cortes:</h4><p style="font-size:10px;color:var(--muted);">1. Clique no corte desejado<br>2. Clique no botão <span style="color:#ffa502;">⬇ Baixar</span> em cada card<br>3. O site de download abrirá com o tempo exato do corte</p></div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;">'+Z.clips.map((c,i)=>'<div class="editor-clip-card '+(i===Z.clipIdx?'active':'')+'" style="background:var(--surface);border:1px solid '+(i===Z.clipIdx?'var(--accent)':'var(--border)')+';border-radius:10px;padding:16px;cursor:pointer;'+(c.edited?'box-shadow:0 0 15px rgba(0,216,164,.2);':'')+'" onclick="previewClip('+i+')">'+(c.edited?'<div class="clip-badge" style="font-size:10px;padding:4px 10px;">✅ EDITADO</div>':'')+'<div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:12px;"><span style="font-size:2.5em;">'+c.mood.split(' ')[0]+'</span><span style="font-size:11px;background:var(--accent);color:#fff;padding:5px 12px;border-radius:15px;font-family:monospace;">'+fmt(c.s)+' - '+fmt(c.e)+'</span></div><div style="font-weight:600;font-size:14px;margin-bottom:8px;">'+c.title+'</div><div style="font-size:10px;color:var(--muted);margin-bottom:10px;">🎬 '+c.effects+' | 🔥'+c.vir+'/10<br>🎨 '+c.colorGrade+' | 🎥 '+c.framing+'</div><div style="display:flex;gap:5px;flex-wrap:wrap;"><button class="btn btn-xs" style="background:var(--accent);color:#fff;" onclick="event.stopPropagation();editClip('+i+')"><i class="fas fa-edit"></i> Editar</button><button class="btn btn-xs btn-tiktok" onclick="event.stopPropagation();share(\'tiktok\')"><i class="fab fa-tiktok"></i></button><button class="btn btn-xs btn-youtube" onclick="event.stopPropagation();share(\'youtube\')"><i class="fab fa-youtube"></i></button><button class="btn btn-xs btn-kwai" onclick="event.stopPropagation();share(\'kwai\')"><i class="fas fa-play"></i></button><button class="btn btn-xs btn-download" onclick="event.stopPropagation();downloadCut()"><i class="fas fa-download"></i> Baixar</button></div></div>').join('')+'</div></div>'}
function editClip(i){previewClip(i);const c=Z.clips[i];c.edited=!0;c.colorGrade=['Cinematic','Warm & Bright','High Contrast'][Math.floor(Math.random()*3)];c.framing=['Spielberg Face','Tarantino Two-Shot','Nolan Epic'][Math.floor(Math.random()*3)];Z.colorGrade=c.colorGrade;Z.framing=c.framing;document.getElementById('framingName').textContent=c.framing;document.getElementById('framingTag').style.display='flex';updateBars();renderClipsPanel();renderEditor();toast('✅ Corte #'+(i+1)+' editado!','success')}
function copyClipInfo(i){const c=Z.clips[i];navigator.clipboard.writeText('🎬 '+c.title+'\n⏱ '+fmt(c.s)+' - '+fmt(c.e)+'\n🔥 Viral: '+c.vir+'/10\n🎨 '+c.colorGrade+' | 🎥 '+c.framing+'\n'+c.hashtags).then(()=>toast('📋 Copiado!','success'))}
function previewClip(i){Z.clipIdx=i;Z.time=0;Z.cameraZoom=1;setTimeout(()=>{Z.cameraZoom=Z.framing.includes('Spielberg')?1.3:1},200);document.querySelectorAll('.clip-card').forEach((e,j)=>e.classList.toggle('active',j===i));document.querySelectorAll('.clip-bar').forEach((e,j)=>e.classList.toggle('active',j===i));document.getElementById('curTime').textContent='00:00';document.getElementById('seekBar').value=0;document.getElementById('cutTime').textContent=fmt(Z.clips[i].s)+' - '+fmt(Z.clips[i].e);document.getElementById('totTime').textContent=fmt(Z.clips[i].duration);const mm={'😊 Alegre':{joy:80,surp:20,sad:5,angry:0},'😲 Surpreso':{joy:30,surp:85,sad:5,angry:5},'🔥 Impactante':{joy:40,surp:60,sad:0,angry:20},'😂 Engraçado':{joy:90,surp:30,sad:0,angry:0},'💪 Motivador':{joy:70,surp:25,sad:5,angry:10}};Z.mood=mm[Z.clips[i].mood]||Z.mood;updateBars();draw();if(Z.showEditor)renderEditor()}
function renderTimeline(){document.getElementById('trackContent').innerHTML=Z.clips.map((c,i)=>'<div class="clip-bar '+(i===Z.clipIdx?'active':'')+'" style="left:'+(i/Z.clips.length)*100+'%;width:'+100/Z.clips.length+'%" onclick="previewClip('+i+')" title="'+c.title+'">'+fmt(c.s)+'</div>').join('')}
function togglePlay(){Z.playing=!Z.playing;document.getElementById('playBtn').innerHTML=Z.playing?'<i class="fas fa-pause"></i>':'<i class="fas fa-play"></i>';if(Z.playing){Z.cameraZoom=Z.framing.includes('Spielberg')?1.3:1;loop()}}
function loop(){if(!Z.playing)return;Z.time+=.05;if(Z.time>10)Z.cameraZoom=1+(Z.time-10)*.1;if(Z.time>3&&Z.time<3.5)Z.cameraShake=4;else Z.cameraShake*=.9;Z.particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life-=.5;if(p.life<=0){p.x=Math.random()*800;p.y=Math.random()*600;p.life=100}});if(Z.time>=12){Z.time=12;Z.playing=!1;Z.cameraZoom=1;document.getElementById('playBtn').innerHTML='<i class="fas fa-play"></i>';if(Z.clipIdx<Z.clips.length-1){setTimeout(()=>{previewClip(Z.clipIdx+1);Z.playing=!0;document.getElementById('playBtn').innerHTML='<i class="fas fa-pause"></i>';loop()},600)}else toast('✅ Todos os cortes visualizados!','success');return}draw();document.getElementById('curTime').textContent=fmt(Z.time);document.getElementById('seekBar').value=(Z.time/12)*100;requestAnimationFrame(()=>loop())}
function seekTo(p){Z.time=(p/100)*12;draw();document.getElementById('curTime').textContent=fmt(Z.time)}
function seekRel(s){Z.time=Math.max(0,Math.min(Z.time+s,12));draw();document.getElementById('curTime').textContent=fmt(Z.time);document.getElementById('seekBar').value=(Z.time/12)*100}
function draw(){const c=document.getElementById('canvas');if(!c)return;const ctx=c.getContext('2d');const w=c.width=c.parentElement.offsetWidth;const h=c.height=c.parentElement.offsetHeight;const grades={'Cinematic':['#1a1a2e','#16213e','#0f3460'],'Warm & Bright':['#2d1b00','#3d2b00','#1a0a00'],'High Contrast':['#1a1a2e','#2d1b4e','#0f3460'],'Cool & Moody':['#0a0a1e','#0d0d2b','#050510'],'Intense Red':['#2e0a0a','#3d0000','#1a0000']};const g=grades[Z.colorGrade]||grades['Cinematic'];const bg=ctx.createLinearGradient(0,0,w,h);bg.addColorStop(0,g[0]);bg.addColorStop(.5,g[1]);bg.addColorStop(1,g[2]);ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);const vg=ctx.createRadialGradient(w/2,h/2,w*.4,w/2,h/2,w*.8);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.6)');ctx.fillStyle=vg;ctx.fillRect(0,0,w,h);Z.particles.forEach(p=>{ctx.fillStyle=p.color;ctx.globalAlpha=p.life/100;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;ctx.save();const sx=(Math.random()-.5)*Z.cameraShake,sy=(Math.random()-.5)*Z.cameraShake;ctx.translate(w/2+sx,h/2+sy);ctx.scale(Z.cameraZoom,Z.cameraZoom);ctx.translate(-w/2,-h/2);const who=Math.floor(Z.time/3)%2,cx=w/2,cy=h/2,prog=Z.time/12;ctx.save();ctx.globalAlpha=who===0?1:.5;ctx.translate(cx-70,cy);ctx.scale(who===0?1.15:.95,who===0?1.15:.95);ctx.fillStyle=who===0?'#a855f7':'#6c5ce7';ctx.beginPath();ctx.arc(0,0,35,0,Math.PI*2);ctx.fill();if(who===0){ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.shadowColor='#a855f7';ctx.shadowBlur=20;ctx.beginPath();ctx.arc(0,0,40,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;for(let i=0;i<3;i++){ctx.strokeStyle='rgba(168,85,247,'+(.5-i*.15)+')';ctx.lineWidth=1;ctx.beginPath();ctx.arc(0,0,45+i*10+Math.sin(Z.time*10)*5,0,Math.PI*2);ctx.stroke()}}ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-12,-8,8,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(12,-8,8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(-10,-6,4,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(14,-6,4,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.beginPath();if(Z.mood.joy>60)ctx.arc(0,10,10,.1,Math.PI-.1);else if(Z.mood.surp>60)ctx.arc(0,15,6,0,Math.PI*2);else if(Z.mood.sad>40)ctx.arc(0,20,10,Math.PI+.1,-.1);else{ctx.moveTo(-8,12);ctx.lineTo(8,12)}ctx.stroke();ctx.restore();ctx.save();ctx.globalAlpha=who===1?1:.5;ctx.translate(cx+70,cy);ctx.scale(who===1?1.15:.95,who===1?1.15:.95);ctx.fillStyle=who===1?'#ff8787':'#ff6b6b';ctx.beginPath();ctx.arc(0,0,35,0,Math.PI*2);ctx.fill();if(who===1){ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.shadowColor='#ff8787';ctx.shadowBlur=20;ctx.beginPath();ctx.arc(0,0,40,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;for(let i=0;i<3;i++){ctx.strokeStyle='rgba(255,135,135,'+(.5-i*.15)+')';ctx.lineWidth=1;ctx.beginPath();ctx.arc(0,0,45+i*10+Math.sin(Z.time*10+1)*5,0,Math.PI*2);ctx.stroke()}}ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-12,-8,8,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(12,-8,8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(-10,-6,4,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(14,-6,4,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.beginPath();if(Z.mood.joy>60)ctx.arc(0,10,10,.1,Math.PI-.1);else if(Z.mood.surp>60)ctx.arc(0,15,6,0,Math.PI*2);else{ctx.moveTo(-8,12);ctx.lineTo(8,12)}ctx.stroke();ctx.restore();ctx.restore();const by=h-6;ctx.fillStyle='rgba(255,255,255,.1)';ctx.fillRect(20,by,w-40,3);const pg=ctx.createLinearGradient(20,0,w-40,0);pg.addColorStop(0,'#6c5ce7');pg.addColorStop(.5,'#a855f7');pg.addColorStop(1,'#ff6b6b');ctx.fillStyle=pg;ctx.fillRect(20,by,(w-40)*prog,3);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(20+(w-40)*prog,by+1.5,5,0,Math.PI*2);ctx.fill();document.getElementById('emotionIcon').textContent=['😊','😲','🔥','😂','💪','🥹','😡','🤯'][Math.floor(Z.time/1.5)%8];const seg=Z.subs.find(t=>Z.time>=t.s&&Z.time<=t.e);const so=document.getElementById('subOverlay');so.innerHTML=seg?'<div class="subtitle-text" style="background:'+(seg.sp==='Pessoa 1'?'rgba(108,92,231,.9)':'rgba(255,107,107,.9)')+';opacity:'+Math.min(1,(Z.time-seg.s)*2)+'">'+seg.tx+'</div>':''}
function toggleFS(){const el=document.getElementById('screen');if(!document.fullscreenElement)el.requestFullscreen();else document.exitFullscreen()}
function share(p){const u={tiktok:'https://www.tiktok.com/upload',youtube:'https://studio.youtube.com',kwai:'https://www.kwai.com/upload'};window.open(u[p],'_blank');toast('📤 Abrindo '+p+'...')}
function publishAll(){if(!Z.clips.length)return toast('Gere cortes primeiro','warning');toast('🚀 Publicando '+Z.clips.length+' cortes...');setTimeout(()=>toast('✅ Todos publicados!','success'),2000)}
function fmt(s){const m=Math.floor(s/60),se=Math.floor(s%60);return m+':'+se.toString().padStart(2,'0')}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function toast(m,t='info'){const c=document.getElementById('toasts');const d=document.createElement('div');d.className='toast toast-'+t;d.textContent=m;c.appendChild(d);setTimeout(()=>{d.style.opacity='0';d.style.transition='opacity .3s';setTimeout(()=>d.remove(),300)},2500)}
</script></body></html>
