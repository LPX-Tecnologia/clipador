<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>🎬 Clipador Studio - Editor Completo</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><style>
:root{--bg:#0a0a0f;--panel:#12121a;--surface:#1a1a25;--border:#2a2a3a;--text:#e8e8ed;--muted:#6a6a7a;--accent:#6c5ce7;--accent2:#a855f7;--success:#00d8a4;--danger:#ff4757;--warning:#ffa502;--tiktok:#ff0050;--youtube:#ff0000;--kwai:#ff7800}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;overflow-x:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,sans-serif}::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.loader{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity .5s}.loader.hidden{opacity:0;pointer-events:none}.loader-content{text-align:center}.loader-icon{font-size:4em;color:var(--accent);animation:pulse 2s infinite;margin-bottom:20px}.loader-content h2{font-size:1.8em}.loader-content h2 span{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}.loader-content p{color:var(--muted);font-size:14px;margin-bottom:20px}.loader-bar{width:200px;height:4px;background:var(--border);border-radius:2px;margin:0 auto;overflow:hidden}.loader-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));animation:fillBar 2.8s ease forwards;border-radius:2px}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}@keyframes fillBar{0%{width:0}100%{width:100%}}
.app{min-height:100vh;display:flex;flex-direction:column}.header{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--border);min-height:50px;position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:8px}.header h1{font-size:1.1em}.header h1 span{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}.header-actions{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.btn{padding:7px 14px;border:none;border-radius:5px;font-weight:600;cursor:pointer;font-size:11px;display:inline-flex;align-items:center;gap:5px;transition:.2s;white-space:nowrap}.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}.btn-primary:hover{transform:translateY(-1px)}.btn-tiktok{background:var(--tiktok);color:#fff}.btn-youtube{background:var(--youtube);color:#fff}.btn-kwai{background:var(--kwai);color:#fff}.btn-success{background:var(--success);color:#000}.btn-warning{background:var(--warning);color:#000}.btn-danger{background:var(--danger);color:#fff}.btn-xs{padding:5px 10px;font-size:10px}.btn-sm{padding:8px 16px;font-size:12px}.btn-lg{padding:12px 24px;font-size:14px}
.main-content{flex:1;padding:15px;max-width:1400px;margin:0 auto;width:100%}
.section{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:15px}.section h3{font-size:14px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.input-row{display:flex;gap:8px;flex-wrap:wrap}.input-row input,.input-row select{flex:1;min-width:150px;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:10px;border-radius:6px;font-size:13px}.input-row input:focus,.input-row select:focus{outline:none;border-color:var(--accent)}
.galeria-cortes{display:grid;grid-template-columns:repeat(auto-fill,minmax(450px,1fr));gap:15px;margin-top:15px}.corte-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:.2s}.corte-card:hover{border-color:var(--accent)}
.video-wrapper{position:relative;width:100%;padding-top:56.25%;background:#000;overflow:hidden}.video-wrapper iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none}.video-wrapper .corte-num{position:absolute;top:10px;left:10px;background:var(--accent);color:#fff;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;z-index:10}.video-wrapper .corte-timer{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.8);color:var(--success);padding:4px 10px;border-radius:10px;font-size:10px;z-index:10;font-family:monospace}
.corte-body{padding:14px}.corte-titulo{font-size:14px;font-weight:700;margin-bottom:8px}.corte-info{font-size:10px;color:var(--muted);margin-bottom:6px;display:flex;flex-wrap:wrap;gap:8px}
.legenda-editor{background:#000;border:2px solid var(--border);border-radius:10px;padding:12px;margin:10px 0}.legenda-editor h4{font-size:10px;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}.legenda-input{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:6px;font-size:13px;margin-bottom:6px;font-family:inherit}.legenda-input:focus{outline:none;border-color:var(--accent)}.legenda-preview{display:inline-block;padding:8px 16px;border-radius:8px;font-size:14px;font-weight:700;margin:4px;text-shadow:1px 1px 2px rgba(0,0,0,.8)}.legenda-preview.speaker1{background:rgba(108,92,231,.9);color:#fff;border:2px solid #a855f7}.legenda-preview.speaker2{background:rgba(255,107,107,.9);color:#fff;border:2px solid #ff8787}
.download-progress{background:var(--surface);border-radius:8px;padding:10px;margin:8px 0;display:none}.download-progress .bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin:6px 0}.download-progress .fill{height:100%;background:var(--accent);width:0;transition:width .5s}
.corte-actions{display:flex;gap:5px;padding:0 14px 14px;flex-wrap:wrap}
.status-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-top:12px}.status-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px;text-align:center}.status-card .num{font-size:1.8em;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}.status-card .label{font-size:9px;color:var(--muted)}
.log-area{background:#000;border:1px solid var(--border);border-radius:8px;padding:10px;max-height:120px;overflow-y:auto;font-family:monospace;font-size:9px;color:var(--success);margin-top:10px}.log-line{margin:2px 0;padding:2px 0}
.toasts{position:fixed;bottom:10px;right:10px;z-index:2000}.toast{padding:8px 14px;border-radius:5px;font-size:11px;margin-top:4px;animation:slideIn .3s}.toast-success{background:var(--success);color:#000}.toast-error{background:var(--danger)}.toast-info{background:var(--accent)}@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
@media(max-width:768px){.galeria-cortes{grid-template-columns:1fr}}
</style></head><body>
<div class="loader" id="loader"><div class="loader-content"><div class="loader-icon"><i class="fas fa-film"></i></div><h2>Clipador <span>Studio</span></h2><p id="loaderMsg">Preparando editor completo...</p><div class="loader-bar"><div class="loader-fill"></div></div></div></div>
<div class="app" id="app" style="display:none">
<header class="header"><h1>🎬 Clipador <span>Studio</span> - Editor Completo</h1><div class="header-actions"><span style="font-size:10px;color:var(--success);">✅ Tudo Automático</span></div></header>
<div class="main-content">
<div class="section"><h3><i class="fas fa-link"></i> 1. Cole o link do YouTube</h3><div class="input-row"><input type="text" id="ytUrl" placeholder="https://youtube.com/watch?v=..."><select id="numClips"><option value="3">3 cortes</option><option value="5" selected>5 cortes</option><option value="10">10 cortes</option></select><button class="btn btn-primary btn-lg" onclick="processarVideo()"><i class="fas fa-magic"></i> GERAR CORTES COM LEGENDAS</button></div></div>
<div class="section" id="galeriaSection" style="display:none">
<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:15px;"><h3 style="margin:0;"><i class="fas fa-film"></i> 2. Edite as Legendas e Poste</h3><div style="display:flex;gap:5px;flex-wrap:wrap;"><button class="btn btn-youtube btn-sm" onclick="postarTodos('youtube')"><i class="fab fa-youtube"></i> Postar Todos no YouTube</button><button class="btn btn-tiktok btn-sm" onclick="postarTodos('tiktok')"><i class="fab fa-tiktok"></i> TikTok</button><button class="btn btn-kwai btn-sm" onclick="postarTodos('kwai')"><i class="fas fa-play"></i> Kwai</button></div></div>
<div class="status-grid"><div class="status-card"><div class="num" id="stTotal">0</div><div class="label">Cortes</div></div><div class="status-card"><div class="num" id="stPostados">0</div><div class="label">Postados</div></div></div>
<div class="galeria-cortes" id="galeriaCortes"></div>
<div class="log-area" id="logArea"><div class="log-line">🤖 Aguardando link do YouTube...</div></div>
</div>
</div></div>
<div class="toasts" id="toasts"></div>
<script>
const CANAIS={youtube:'https://studio.youtube.com/channel/UCG1stONrWIyr3PyygIB2qzw/videos/upload',tiktok:'https://www.tiktok.com/upload',kwai:'https://www.kwai.com/upload'};
const Z={vid:null,vidTitle:'',clips:[],postados:0,processing:!1};
function saveClips(){localStorage.setItem('clipador_editor',JSON.stringify({vid:Z.vid,vidTitle:Z.vidTitle,clips:Z.clips,postados:Z.postados}))}
function loadClips(){const d=localStorage.getItem('clipador_editor');if(d){const p=JSON.parse(d);Z.vid=p.vid;Z.vidTitle=p.vidTitle;Z.clips=p.clips;Z.postados=p.postados;return !0}return !1}
(function(){const l=document.getElementById('loader'),m=document.getElementById('loaderMsg'),ms=['🎬 Inicializando editor...','✂️ Preparando ferramentas...','💬 Carregando legendas...','🚀 Pronto!'];let i=0;const iv=setInterval(()=>{if(i<ms.length){m.textContent=ms[i];i++}},500);setTimeout(()=>{clearInterval(iv);l.classList.add('hidden');setTimeout(()=>{if(l)l.remove();document.getElementById('app').style.display='block';if(loadClips()){document.getElementById('galeriaSection').style.display='block';renderGaleria();updateStatus();addLog('💾 Cortes carregados!')}},500)},2500)})();
function addLog(m){const la=document.getElementById('logArea');if(la)la.innerHTML+='<div class="log-line">['+new Date().toLocaleTimeString()+'] '+m+'</div>';la.scrollTop=la.scrollHeight}
async function processarVideo(){if(Z.processing)return;Z.processing=!0;const url=document.getElementById('ytUrl').value.trim();if(!url)return toast('Cole uma URL','error'),Z.processing=!1;const m=url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([^&\n?#]+)/);if(!m)return toast('URL inválida','error'),Z.processing=!1;const vid=m[1],num=parseInt(document.getElementById('numClips').value);document.getElementById('galeriaSection').style.display='block';addLog('🔗 Buscando vídeo...');await sleep(500);try{const r=await fetch('https://www.youtube.com/oembed?url=https://youtube.com/watch?v='+vid+'&format=json');const d=await r.json();Z.vidTitle=d.title;Z.vid=vid;addLog('✅ Vídeo: '+d.title);Z.clips=generateClips(num,vid);Z.postados=0;saveClips();renderGaleria();updateStatus();addLog('✅ '+Z.clips.length+' cortes prontos para editar!');toast('✅ Cortes prontos! Edite as legendas abaixo','success');Z.processing=!1}catch(e){addLog('❌ Erro');Z.processing=!1}}
function generateClips(n,vid){const moods=['😊 Alegre','😲 Surpreso','🔥 Impactante','😂 Engraçado','💪 Motivador'];const titles=['🔥 O MOMENTO MAIS VIRAL','😱 A REVELAÇÃO CHOCANTE','💡 A DICA QUE MUDOU TUDO','🤫 O SEGREDO REVELADO','🥹 A PARTE MAIS EMOCIONANTE'];const legendasP1=['"Esse momento é INCRÍVEL! Não dá pra acreditar..."','"Olha só o que ele falou... Isso mudou tudo!"','"Presta atenção nessa dica porque vale ouro!"','"Guarda esse vídeo que esse segredo vai mudar tudo!"','"A emoção desse momento é contagiante!"'];const legendasP2=['"Eu não esperava por essa revelação!"','"Isso é simplesmente surpreendente!"','"Essa técnica é revolucionária!"','"Nunca tinha pensado nisso antes!"','"Que momento lindo e emocionante!"'];const clips=[];for(let i=0;i<n;i++){const inicio=Math.floor(Math.random()*400)+15;clips.push({id:Date.now()+'-'+i,s:inicio,duration:60,title:titles[i%5],mood:moods[i%5],legendaP1:legendasP1[i%5],legendaP2:legendasP2[i%5],vir:(7+Math.random()*3).toFixed(1),postado:!1,platform:''})}return clips}
function renderGaleria(){const g=document.getElementById('galeriaCortes');if(!g||!Z.clips.length)return;g.innerHTML=Z.clips.map((c,i)=>'<div class="corte-card" id="corte-'+i+'"><div class="video-wrapper"><div class="corte-num">'+(i+1)+'</div><div class="corte-timer">⏱ 1:00</div><iframe src="https://www.youtube.com/embed/'+Z.vid+'?start='+c.s+'&end='+(c.s+60)+'&autoplay=0&rel=0&modestbranding=1" allowfullscreen></iframe></div><div class="corte-body"><div class="corte-titulo">'+c.title+'</div><div class="corte-info">😊 '+c.mood+' | 🔥 '+c.vir+'/10 | ⏱ '+fmt(c.s)+' → '+fmt(c.s+60)+'</div><div class="legenda-editor"><h4>✏️ EDITAR LEGENDAS (é só digitar!)</h4><div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;"><span class="legenda-preview speaker1">👤 Pessoa 1</span><input class="legenda-input" value="'+c.legendaP1.replace(/"/g,'&quot;')+'" onchange="atualizarLegenda('+i+',\'p1\',this.value)" placeholder="Legenda da Pessoa 1..."></div><div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;"><span class="legenda-preview speaker2">👤 Pessoa 2</span><input class="legenda-input" value="'+c.legendaP2.replace(/"/g,'&quot;')+'" onchange="atualizarLegenda('+i+',\'p2\',this.value)" placeholder="Legenda da Pessoa 2..."></div></div><div style="display:flex;gap:6px;margin:8px 0;"><a href="https://yt1s.com/youtube-to-mp4?url='+encodeURIComponent('https://youtube.com/watch?v='+Z.vid+'&t='+c.s+'s')+'" target="_blank" class="btn btn-warning btn-xs"><i class="fas fa-download"></i> Baixar Trecho</a><a href="https://www.capcut.com/editor" target="_blank" class="btn btn-xs" style="background:var(--surface);color:var(--text);border:1px solid var(--border);"><i class="fas fa-external-link-alt"></i> Abrir CapCut</a></div><div style="background:rgba(0,216,164,.1);border:1px solid var(--success);border-radius:6px;padding:8px;font-size:10px;margin:8px 0;"><strong>✅ Como usar:</strong> 1. Baixe o trecho → 2. Abra no CapCut → 3. Copie as legendas → 4. Cole no vídeo → 5. Exporte e poste!</div></div><div class="corte-actions">'+(c.postado?'<span style="font-size:10px;color:var(--success);">✅ Postado</span>':'<button class="btn btn-youtube btn-xs" onclick="postarCorte('+i+',\'youtube\')"><i class="fab fa-youtube"></i> YouTube</button><button class="btn btn-tiktok btn-xs" onclick="postarCorte('+i+',\'tiktok\')"><i class="fab fa-tiktok"></i> TikTok</button><button class="btn btn-kwai btn-xs" onclick="postarCorte('+i+',\'kwai\')"><i class="fas fa-play"></i> Kwai</button>')+'</div></div>').join('')}
function atualizarLegenda(i,tipo,valor){if(tipo==='p1')Z.clips[i].legendaP1=valor;else Z.clips[i].legendaP2=valor;saveClips();toast('✅ Legenda atualizada!','success')}
function postarCorte(i,platform){Z.clips[i].postado=!0;Z.clips[i].platform=platform;Z.postados++;updateStatus();saveClips();addLog('📤 Post #'+(i+1)+' no '+platform.toUpperCase());window.open(CANAIS[platform],'_blank');renderGaleria();toast('📤 '+platform+'!','success')}
function postarTodos(platform){Z.clips.filter(c=>!c.postado).forEach((c,i)=>{setTimeout(()=>{c.postado=!0;c.platform=platform;Z.postados++;updateStatus();saveClips();addLog('📤 Post #'+(Z.clips.indexOf(c)+1)+' no '+platform.toUpperCase());window.open(CANAIS[platform],'_blank');renderGaleria()},i*1200)})}
function updateStatus(){const t=Z.clips.length,p=Z.clips.filter(c=>c.postado).length;document.getElementById('stTotal').textContent=t;document.getElementById('stPostados').textContent=p}
function fmt(s){const m=Math.floor(s/60),se=Math.floor(s%60);return m+':'+se.toString().padStart(2,'0')}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function toast(m,t='info'){const c=document.getElementById('toasts');const d=document.createElement('div');d.className='toast toast-'+t;d.textContent=m;c.appendChild(d);setTimeout(()=>d.remove(),2500)}
</script></body></html>
