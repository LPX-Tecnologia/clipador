<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clipador — cortador de shorts com IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg: #0d0d10;
    --panel: #17171c;
    --panel-2: #1e1e25;
    --line: #2a2a33;
    --text: #f2f0ea;
    --muted: #8b8b93;
    --accent: #00d8c6;      /* teal — trilha/timeline */
    --tally: #ff3b3b;       /* vermelho de luz "gravando" */
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Space Grotesk', sans-serif;
    min-height:100vh;
  }
  .mono{ font-family:'IBM Plex Mono', monospace; }

  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 32px;
    border-bottom:1px solid var(--line);
  }
  .logo{
    display:flex; align-items:center; gap:10px;
    font-weight:700; font-size:20px; letter-spacing:-0.02em;
  }
  .logo .dot{
    width:10px; height:10px; border-radius:50%;
    background:var(--tally);
    box-shadow:0 0 8px var(--tally);
    animation:pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.35} }
  header .sub{ color:var(--muted); font-size:13px; }

  #settingsBtn{
    background:transparent; border:1px solid var(--line); color:var(--muted);
    padding:8px 14px; border-radius:var(--radius); cursor:pointer;
    font-family:'IBM Plex Mono', monospace; font-size:12px;
  }
  #settingsBtn:hover{ border-color:var(--accent); color:var(--accent); }

  main{ max-width:860px; margin:0 auto; padding:40px 24px 80px; }

  .intake{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px;
    margin-bottom:36px;
  }
  .intake label{
    display:block; font-size:12px; color:var(--muted);
    text-transform:uppercase; letter-spacing:.08em; margin-bottom:10px;
    font-family:'IBM Plex Mono', monospace;
  }
  .intake-row{ display:flex; gap:10px; }
  .intake input[type=text]{
    flex:1;
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:8px;
    padding:12px 14px;
    color:var(--text);
    font-size:14px;
    font-family:'IBM Plex Mono', monospace;
  }
  .intake input[type=text]:focus{ outline:none; border-color:var(--accent); }
  .intake button{
    background:var(--accent);
    color:#04211e;
    border:none;
    padding:0 22px;
    border-radius:8px;
    font-weight:600;
    cursor:pointer;
    font-size:14px;
  }
  .intake button:disabled{ opacity:.4; cursor:not-allowed; }
  #authGate{ color:var(--muted); font-size:13px; margin-top:10px; }
  #authGate a{ color:var(--accent); cursor:pointer; text-decoration:underline; }

  .section-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px; color:var(--muted); text-transform:uppercase;
    letter-spacing:.1em; margin:0 0 16px 4px;
  }

  .video-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px 22px;
    margin-bottom:16px;
  }
  .video-card .url{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px; color:var(--text);
    word-break:break-all;
  }
  .video-card .meta{ color:var(--muted); font-size:12px; margin-top:4px; }

  /* signature element: timeline/pipeline stepper, styled like a video editor scrubber */
  .stepper{
    display:flex; align-items:center; margin-top:16px; margin-bottom:4px;
  }
  .step{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:8px;
    position:relative;
  }
  .step .bar{
    width:100%; height:4px; background:var(--line); border-radius:2px;
  }
  .step.done .bar{ background:var(--accent); }
  .step.active .bar{
    background:linear-gradient(90deg, var(--accent) 50%, var(--line) 50%);
    background-size:200% 100%;
    animation:scrub 1.2s linear infinite;
  }
  @keyframes scrub{ from{background-position:0 0} to{background-position:-200% 0} }
  .step .label{
    font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--muted);
    text-transform:uppercase; letter-spacing:.05em;
  }
  .step.done .label, .step.active .label{ color:var(--text); }

  .clips{ margin-top:18px; display:flex; flex-direction:column; gap:8px; }
  .clip{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--panel-2); border:1px solid var(--line);
    border-radius:8px; padding:10px 14px;
  }
  .clip .tc{
    font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--accent);
    min-width:110px;
  }
  .clip .titulo{ font-size:13px; flex:1; padding:0 10px; }
  .clip a{
    font-family:'IBM Plex Mono', monospace; font-size:11px;
    color:var(--muted); border:1px solid var(--line);
    padding:5px 10px; border-radius:6px; text-decoration:none;
  }
  .clip a:hover{ border-color:var(--accent); color:var(--accent); }

  .empty{
    color:var(--muted); font-size:13px; text-align:center;
    padding:40px 0; border:1px dashed var(--line); border-radius:var(--radius);
  }

  /* settings modal */
  .modal-bg{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.6);
    align-items:center; justify-content:center; z-index:10;
  }
  .modal-bg.open{ display:flex; }
  .modal{
    background:var(--panel); border:1px solid var(--line);
    border-radius:var(--radius); padding:26px; width:100%; max-width:420px;
  }
  .modal h3{ margin:0 0 6px; font-size:16px; }
  .modal p{ color:var(--muted); font-size:12px; margin:0 0 18px; }
  .modal label{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; font-family:'IBM Plex Mono', monospace;}
  .modal input{
    width:100%; background:var(--bg); border:1px solid var(--line);
    border-radius:8px; padding:10px 12px; color:var(--text); margin:8px 0 16px;
    font-family:'IBM Plex Mono', monospace; font-size:13px;
  }
  .modal-actions{ display:flex; gap:10px; justify-content:flex-end; }
  .modal-actions button{
    padding:9px 16px; border-radius:8px; cursor:pointer; font-size:13px; border:1px solid var(--line);
    background:transparent; color:var(--muted);
  }
  .modal-actions button.primary{ background:var(--accent); color:#04211e; border:none; font-weight:600; }
</style>
</head>
<body>

<header>
  <div class="logo"><span class="dot"></span> Clipador</div>
  <div style="display:flex; align-items:center; gap:14px;">
    <span class="sub mono" id="userEmail"></span>
    <button id="settingsBtn">Configurar Supabase</button>
  </div>
</header>

<main>
  <div class="intake">
    <label>Colar link do YouTube</label>
    <div class="intake-row">
      <input type="text" id="youtubeUrl" placeholder="https://www.youtube.com/watch?v=..." />
      <button id="sendBtn">Enviar</button>
    </div>
    <div id="authGate"></div>
  </div>

  <div class="section-label">Vídeos enviados</div>
  <div id="videoList">
    <div class="empty">Nenhum vídeo ainda. Cole um link do YouTube acima pra começar.</div>
  </div>
</main>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3>Conectar ao Supabase</h3>
    <p>Pegue esses dois valores em Project Settings → API no seu projeto Supabase.</p>
    <label>Project URL</label>
    <input type="text" id="cfgUrl" placeholder="https://xxxx.supabase.co" />
    <label>Anon public key</label>
    <input type="text" id="cfgKey" placeholder="eyJhbGciOi..." />
    <div class="modal-actions">
      <button id="cancelCfg">Cancelar</button>
      <button class="primary" id="saveCfg">Salvar</button>
    </div>
  </div>
</div>

<script>
const ETAPAS = ['pendente','baixando','transcrevendo','analisando','pronto'];
const ROTULOS = {pendente:'Pendente', baixando:'Baixando', transcrevendo:'Transcrevendo', analisando:'Analisando', pronto:'Pronto', erro:'Erro'};

let supabase = null;

function getConfig(){
  return {
    url: localStorage.getItem('sb_url') || '',
    key: localStorage.getItem('sb_key') || ''
  };
}

function initSupabase(){
  const { url, key } = getConfig();
  if(url && key){
    try{
      supabase = window.supabase.createClient(url, key);
      return true;
    } catch(e){
      document.getElementById('authGate').innerHTML =
        '<span style="color:var(--tally)">Erro ao conectar: ' + e.message + '</span>';
      return false;
    }
  }
  return false;
}

// ---------- Modal de configuração ----------
const modalBg = document.getElementById('modalBg');
document.getElementById('settingsBtn').onclick = () => {
  const { url, key } = getConfig();
  document.getElementById('cfgUrl').value = url;
  document.getElementById('cfgKey').value = key;
  modalBg.classList.add('open');
};
document.getElementById('cancelCfg').onclick = () => modalBg.classList.remove('open');
document.getElementById('saveCfg').onclick = () => {
  localStorage.setItem('sb_url', document.getElementById('cfgUrl').value.trim());
  localStorage.setItem('sb_key', document.getElementById('cfgKey').value.trim());
  modalBg.classList.remove('open');
  boot();
};

// ---------- Autenticação simples por link mágico ----------
async function renderAuthGate(){
  const gate = document.getElementById('authGate');
  const emailLabel = document.getElementById('userEmail');
  if(!supabase){
    gate.innerHTML = 'Configure o Supabase primeiro (botão no topo).';
    document.getElementById('sendBtn').disabled = true;
    return;
  }
  const { data: { session } } = await supabase.auth.getSession();
  if(session){
    emailLabel.textContent = session.user.email;
    gate.innerHTML = '<a id="logoutLink">Sair</a>';
    document.getElementById('logoutLink').onclick = async () => { await supabase.auth.signOut(); location.reload(); };
    document.getElementById('sendBtn').disabled = false;
    carregarVideos();
  } else {
    document.getElementById('sendBtn').disabled = true;
    gate.innerHTML = 'Entre com seu e-mail: <input id="loginEmail" type="text" placeholder="voce@email.com" style="font-family:\'IBM Plex Mono\',monospace;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 8px;color:var(--text);margin:0 6px;"> <a id="loginLink">Enviar link de acesso</a>';
    document.getElementById('loginLink').onclick = async () => {
      const email = document.getElementById('loginEmail').value.trim();
      if(!email) return;
      document.getElementById('loginLink').textContent = 'Enviando...';
      const { error } = await supabase.auth.signInWithOtp({ email });
      if(error){
        gate.innerHTML = '<span style="color:var(--tally)">Erro: ' + error.message + '</span>';
      } else {
        gate.innerHTML = 'Link enviado! Confira seu e-mail (e a caixa de spam) e clique nele pra entrar.';
      }
    };
  }
}

// ---------- Envio de novo vídeo ----------
document.getElementById('sendBtn').onclick = async () => {
  const input = document.getElementById('youtubeUrl');
  const url = input.value.trim();
  if(!url || !supabase) return;
  const { data: { session } } = await supabase.auth.getSession();
  if(!session) return;
  const { error } = await supabase.from('videos').insert({ user_id: session.user.id, youtube_url: url, status: 'pendente' });
  if(error){
    alert('Erro ao enviar: ' + error.message);
    return;
  }
  input.value = '';
  carregarVideos();
};

// ---------- Listagem de vídeos + clipes ----------
async function carregarVideos(){
  const list = document.getElementById('videoList');
  const { data: videos, error } = await supabase.from('videos').select('*').order('created_at', { ascending:false });
  if(error || !videos || videos.length === 0){
    list.innerHTML = '<div class="empty">Nenhum vídeo ainda. Cole um link do YouTube acima pra começar.</div>';
    return;
  }
  list.innerHTML = '';
  for(const v of videos){
    const { data: clips } = await supabase.from('clips').select('*').eq('video_id', v.id).order('inicio_segundos');
    list.appendChild(renderVideoCard(v, clips || []));
  }
}

function tc(segundos){
  const s = Math.floor(segundos % 60).toString().padStart(2,'0');
  const m = Math.floor(segundos / 60).toString().padStart(2,'0');
  return m + ':' + s;
}

function renderVideoCard(v, clips){
  const card = document.createElement('div');
  card.className = 'video-card';

  const idxAtual = ETAPAS.indexOf(v.status);
  const stepperHtml = ETAPAS.map((etapa, i) => {
    let cls = '';
    if(v.status === 'erro'){ cls = i === 0 ? 'done' : ''; }
    else if(i < idxAtual) cls = 'done';
    else if(i === idxAtual) cls = 'done active';
    return `<div class="step ${cls}"><div class="bar"></div><div class="label">${ROTULOS[etapa]}</div></div>`;
  }).join('');

  const clipsHtml = clips.length
    ? clips.map(c => `
        <div class="clip">
          <span class="tc">${tc(c.inicio_segundos)}–${tc(c.fim_segundos)}</span>
          <span class="titulo">${c.titulo_gancho || 'Sem título ainda'}</span>
          ${c.arquivo_url ? `<a href="${c.arquivo_url}" target="_blank">baixar</a>` : `<span class="mono" style="color:var(--muted); font-size:11px;">${ROTULOS[c.status] || ''}</span>`}
        </div>`).join('')
    : '';

  card.innerHTML = `
    <div class="url">${v.youtube_url}</div>
    <div class="meta mono">${new Date(v.created_at).toLocaleString('pt-BR')}${v.status === 'erro' ? ' · erro: ' + (v.erro_mensagem || 'desconhecido') : ''}</div>
    <div class="stepper">${v.status === 'erro' ? '' : stepperHtml}</div>
    <div class="clips">${clipsHtml}</div>
  `;
  return card;
}

// ---------- Boot ----------
async function boot(){
  const ok = initSupabase();
  if(ok){
    await renderAuthGate();
    supabase.auth.onAuthStateChange(() => renderAuthGate());
  } else {
    document.getElementById('authGate').innerHTML = 'Configure o Supabase primeiro (botão no topo).';
    document.getElementById('sendBtn').disabled = true;
  }
}
boot();
</script>

</body>
</html>
